# One workspace for both clients: web/ (the CLI's embedded UI and the shared lib, web/src/lib)
# and desktop/ (the Tauri app, which imports the lib as @lib). Versions both use come from the
# catalog, so the lib's React, Vite and TypeScript are the desktop's too.
packages:
  - web
  - desktop

catalog:
  '@types/node': ^26.6.5
  '@types/react': ^19.1.10
  '@types/react-dom': ^19.1.7
  '@vitejs/plugin-react': ^5.0.0
  react: ^19.1.1
  react-dom: ^19.1.1
  typescript: ^5.9.2
  vite: ^7.1.3
  vitest: ^5.0.5

allowBuilds:
  esbuild: true
