openapi: 3.1.0
# The contract of `mtkprof engine` (docs/PLAN-DESKTOP.md § 2). Formatting
# rule: 2-space indentation, one path per line at indent 2 under `paths:`,
# its methods at indent 4. internal/engine/contract_test.go reads the paths
# with a line scanner and compares them with Server.Routes(); keep both in
# step (a route missing on either side fails the test).
info:
  title: mtkprof engine
  version: "1"
  description: |
    Control plane and per-session API of `mtkprof engine`, the desktop app's
    sidecar. `info.version` and `x-mtkprof-protocol` are the protocol
    integer (`engine.Protocol`); it increments on any breaking change and
    the shell refuses an engine whose protocol it does not know.

    Process: `mtkprof engine [-listen 127.0.0.1:0] [-cache DIR] [-cache-cap 20G]
    [-allow-origin O,...] [-idle-exit D] [-idle D] [-detach]`, token in the environment
    (`MTKPROF_TOKEN`, 32+ bytes). Once listening it prints one line on stdout:
    `{"ready":true,"addr":"127.0.0.1:41233","version":"...","protocol":1}`.
    It exits when stdin closes (unless -detach), on SIGINT/SIGTERM, or after
    -idle-exit without sessions and requests. With `-idle D` a ready session
    that has had no request on its `/s/{id}/` mount (a pending `api/doc`
    long poll counts) and no running job for D is closed as by `DELETE` (a
    `session` event with state `closed`; the cache entry stays); opening and
    live sessions are never closed. Default: never.

    Every request but `GET /engine/health` needs `Authorization: Bearer <token>`;
    that includes the event stream, so a browser client reads it with
    `fetch` (a streaming body), not `EventSource`, which cannot send headers.
    CORS is answered for the `-allow-origin` origins only.

    Control-plane errors use the envelope `{"error": {"code", "message"}}`
    (`ErrorEnvelope`) with the status of the code: bad_request 400,
    unauthorized 401, not_found 404, conflict and cancelled 409,
    needs_prompt 428, internal 500, remote 502 (a remote host or the
    connection to it failed). The slice endpoints under
    `/s/{id}/api/` answer a bad parameter with a plain-text 400 (they are
    the handlers of `mtkprof serve`); a missing session or a session that is
    not ready is the envelope (404, 409).
  license:
    name: Apache-2.0
x-mtkprof-protocol: 1
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
        description: the port of the ready line
security:
  - bearer: []
paths:
  /engine/health:
    get:
      operationId: health
      summary: Engine version, protocol, uptime, sessions and cache size (no token needed)
      security: []
      responses:
        "200":
          description: health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /engine/events:
    get:
      operationId: events
      summary: Server-sent events (job, session, prompt, log)
      description: |
        `text/event-stream`. The stream opens with the comment
        `: mtkprof engine`, then replays every prompt that is still open, then
        sends events as they happen; a `: keepalive` comment every 15 s.
        Each event is `event: <type>` and one `data:` line of JSON:

        - `job`: `JobInfo`, on every change of a job (state, phase, progress
          at most every 64 MB of parse).
        - `session`: `SessionEvent` (`{id, state, rev}`), on open, ready,
          failed and closed.
        - `prompt`: `PromptEvent`, `state: open` when a credential is needed
          and `state: closed` once it is answered, cancelled or abandoned.
        - `log`: `LogEvent` (`{level, message}`).

        A subscriber that falls behind by 256 events is disconnected; it
        reconnects and re-reads `GET /engine/sessions` and `/engine/jobs`.
      responses:
        "200":
          description: the event stream
          content:
            text/event-stream:
              schema:
                type: string
              x-mtkprof-events:
                job:
                  $ref: "#/components/schemas/JobInfo"
                session:
                  $ref: "#/components/schemas/SessionEvent"
                prompt:
                  $ref: "#/components/schemas/PromptEvent"
                log:
                  $ref: "#/components/schemas/LogEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/prompts/{id}:
    get:
      operationId: getPrompt
      summary: An open prompt
      description: >-
        The prompt as its `prompt` event announced it, while it is open. The
        desktop shell reads an apikey prompt's `endpoint` here before it
        answers with a key it remembered for that endpoint.
      parameters:
        - $ref: "#/components/parameters/PromptID"
      responses:
        "200":
          description: the open prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: answerPrompt
      summary: Answer or cancel an open prompt
      parameters:
        - $ref: "#/components/parameters/PromptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptAnswer"
      responses:
        "204":
          description: answered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/compare:
    get:
      operationId: compareSessions
      summary: Compare two ready non-live sessions (whole traces, B against A)
      description: Detached aggregate comparison snapshot. Source filters are ignored. No Lines or report endpoints are created.
      parameters:
        - { name: a, in: query, required: true, schema: { type: string } }
        - { name: b, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Existing format-2 CompareDocument with aggregate documents and SQL, wait and plan deltas
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /engine/sessions:
    get:
      operationId: listSessions
      summary: The sessions, oldest first
      responses:
        "200":
          description: sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: openSession
      summary: Open a trace set (one file, several, or directories of them)
      description: |
        Answers at once with the new session (`opening`) and its `open` job.
        The job's phases are `open` (cache lookup), on a miss `parse`
        (unit bytes, with lines and statements) and `index` (writing the cache
        entry), then `ready`. A hit goes from `open` straight to `ready`. The
        session becomes `ready` or `failed`.

        With `options.follow` (one file) the session is a live session over
        a growing file (not cached; spilled to a temporary directory under
        `<cache>/live/`): its job (kind `live`, phase `follow`, unit bytes,
        `done` = bytes parsed) runs until the session is deleted. The file is
        parsed as it grows (a line counts once its newline is written); at
        every settled batch (`batchMs`, default 1000, at least 3x the cost of
        the last snapshot; or after `batchMB` of new input) the session
        serves a new snapshot: `rev` increments, a session event
        `{state: live, rev}` goes out, and every route under `/s/{id}/`
        answers what a normal open of the input so far would. The first
        snapshot is taken as soon as the reader has caught up with the file
        (state `opening` until then). A stream error (the file shrank, the
        mirror of a remote follow ended) makes it `failed` with the error;
        the last snapshot is still served until DELETE. A file that ends with
        `*** TRACE CONTINUES IN FILE x ***` is followed into x once x exists
        (the path in the marker, the same name next to the file, or a
        `*.trc` there whose header names it), as a normal open follows a
        chain: `files` lists both, `bytes`/`lines` count all, a `log` event
        and a session event tell of the switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
      responses:
        "202":
          description: opening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeSession
      summary: Close a session (cancels its open job); the cache entry stays
      description: |
        A live session stops following (its job ends cancelled; a remote
        follow's mirror job is cancelled) and its spill directory is removed.
        The engine does the same for a ready session idle for `-idle`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/assist/tools:
    get:
      operationId: assistTools
      summary: The analysis tools an assistant can call, with their argument schemas
      description: |
        The registry behind `POST /s/{id}/api/assist/tools/{name}`: overview,
        statements, statement, executions, pivot, timeline, lines,
        search_lines, notes, current_view and show. `inputSchema` is the JSON Schema
        of the tool's arguments; the fields are those of MCP `tools/list`, which
        `mtkprof mcp` passes through.
      responses:
        "200":
          description: the tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/assist/backends:
    get:
      operationId: assistBackends
      summary: The provider kinds, with each CLI's path, version and login state
      description: |
        Every `provider.kind` a conversation takes, with its `auth` modes
        (the default first) and whether the app labels it `experimental`
        (codex). For a CLI kind (claude, codex) the engine looks the command
        up on its PATH and runs `--version` and the login check (`claude auth
        status`, `codex login status`, at most 10 s each): `path`, `version`,
        `loggedIn` and `login` (how it is logged in, or that it is not), or
        `error` `not found` (a conversation with that kind is then a 400).
      responses:
        "200":
          description: the provider kinds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/assist/conversations:
    post:
      operationId: createConversation
      summary: Start a conversation about a session's trace with a model provider
      description: |
        A conversation is one chat with one provider about one ready
        session's trace. It holds the provider definition (never a secret),
        the scope, the masking of bind values, the case text, the notes, the
        current view and the history. It lives until `DELETE` or until its
        session closes (or the engine stops).

        `consent` must be true: the DBA agreed to send what this trace shows
        to this provider. `provider.kind` is one of `GET
        /engine/assist/backends`:

        - `openai`: an OpenAI-compatible `/chat/completions` endpoint at
          `baseUrl`. With `auth` bearer (the default) the key is asked for
          once per provider with a `prompt` event of kind `apikey` whose
          `connection` is `provider.id` and `endpoint` its kind and
          `baseUrl`, answered with `POST /engine/prompts/{id}`, and held in
          memory only, for that endpoint (the same id with another `baseUrl`
          asks again); `auth` none sends
          no key (a local server such as Ollama). `headers` are extra request
          headers: a name that looks like a credential (auth, key, token,
          secret, password, cookie) or a `Bearer`/`Basic` value is a 400, and
          so is a `baseUrl` with a user, a query or a fragment.
        - `claude`: the Claude Code CLI with its own login (`auth` login),
          one process per conversation, in an empty temp directory, with no
          tools but mtkprof's (through `mtkprof mcp`), no user settings, and
          no transcript written.
        - `codex` (experimental): `codex exec` per turn with the user's own
          Codex home: read-only sandbox, `--ephemeral`, the shell, plugins,
          hooks and every MCP server of the user's `config.toml` switched
          off. `auth` login (default) uses the Codex login; `auth` bearer
          asks for an OpenAI API key as above and passes it as
          `CODEX_API_KEY`. Each turn resends the conversation so far.

        A CLI kind takes no `baseUrl` or `headers`; `model` is optional (the
        CLI's default). A CLI that is not on the engine's PATH is a 400.

        `binds`: `mask` (default) shows each bind value as its type, length and
        a hash salted per conversation; `keep` sends the traced values. SQL
        text is never masked. `scope` is where the tools look by default (a
        window in tim µs and session contexts, as the slice endpoints take
        them). `notes` absent means none were supplied (the notes tool says
        so); `[]` means the DBA has none. `view` is what the app shows (the
        current_view tool).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRequest"
      responses:
        "201":
          description: the conversation, idle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/assist/conversations/{c}:
    get:
      operationId: getConversation
      summary: A conversation's state, turns and token usage
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: the conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteConversation
      summary: Cancel the open turn and end the conversation
      description: |
        The open turn, if any, is cancelled: its stream ends with an `error`
        event of code `cancelled` and its request to the provider is closed.
        The answer comes once the turn has ended (at most 5 s). The
        conversation is then gone (404). To stop only the open turn and keep
        the conversation, close the request of its stream instead.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "204":
          description: ended
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/assist/conversations/{c}/messages:
    post:
      operationId: postMessage
      summary: Send a message; the answer streams as NDJSON events of one turn
      description: |
        Opens a turn (409 while one is open) and streams it on the answer,
        `application/x-ndjson`: one JSON object per line, told apart by
        `type` (`TurnEvent`). The model's tool calls run in the engine on the
        session's trace with the conversation's scope and masking; each one is
        a `tool_call` event and then a `tool_result` event whose `content` is
        exactly the text the model is given. A CLI agent's calls come through
        `mtkprof mcp` and have ids `mcp_N`. Text pieces are sent at most
        every 50 ms (the first at once). A turn ends with exactly one `done`
        or `error` event.

        Events:

        - `text` `{text}`: a piece of the answer.
        - `tool_call` `{id, name, args}`: `args` is the JSON object of the
          arguments, or a string holding what the model sent when it is not
          JSON (the call then fails).
        - `tool_result` `{id, name, isError, content, estTokens}`.
        - `intent` `{id, target, href}`: the show tool asks the app to move
          its view; `target` is checked against the trace, `href` is the
          same place as an `mtkprof:` link.
        - `usage` `{inputTokens, outputTokens, cachedInputTokens}`: one model
          request (a CLI agent: the whole turn, once).
        - `state` `{state, provider}`: `waiting_key` while the provider's key
          prompt (kind `apikey`, `connection` = `provider`) is open on
          `/engine/events`, then `running`.
        - `done` `{usage, total}`: the turn answered; the tokens of the turn
          and of the conversation so far.
        - `error` `{code, message}`: `cancelled` (DELETE, or this request
          went away), `session_closed`, `no_key` (the key prompt was
          cancelled), `auth` (the provider refused the key; it is dropped and
          the next message asks again), `provider` (an error answer after
          two retries of 429 and 5xx, or the provider could not be reached),
          `too_many_steps` (25 model requests without an answer), `internal`.
          A CLI agent that is not logged in is `auth`; one that exits, fails,
          offers a tool other than mtkprof's, or (codex) tries a shell
          command, a file change, a web search or another MCP server is
          `provider`, and its process is stopped.

        After `done` the conversation is idle; after `error` it is cancelled
        or failed, and either takes the next message. Closing this request
        cancels the turn. `view` and `notes`, when given, replace the
        conversation's (what the app shows now, the DBA's notes now).
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: the turn's events, one JSON object per line
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/TurnEvent"
              x-mtkprof-events:
                text:
                  $ref: "#/components/schemas/TextEvent"
                tool_call:
                  $ref: "#/components/schemas/ToolCallEvent"
                tool_result:
                  $ref: "#/components/schemas/ToolResultEvent"
                intent:
                  $ref: "#/components/schemas/IntentEvent"
                usage:
                  $ref: "#/components/schemas/UsageEvent"
                state:
                  $ref: "#/components/schemas/StateEvent"
                done:
                  $ref: "#/components/schemas/DoneEvent"
                error:
                  $ref: "#/components/schemas/ErrorEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/assist/providers/{id}/key:
    delete:
      operationId: forgetProviderKey
      summary: Drop the API key held for a provider
      description: The next turn with this provider asks for the key again. 204 also when none is held.
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      responses:
        "204":
          description: dropped
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/jobs:
    get:
      operationId: listJobs
      summary: Running jobs and the last 100 finished ones, oldest first
      responses:
        "200":
          description: jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/jobs/{id}:
    delete:
      operationId: cancelJob
      summary: Cancel a running job; a job event says when it has stopped
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: cancelling
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/cache:
    get:
      operationId: listCache
      summary: The entries of the index cache, most recently used first
      responses:
        "200":
          description: the cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: wipeCache
      summary: Remove every entry no session has open
      responses:
        "200":
          description: what was removed and what was kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheWipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/cache/{identity}:
    delete:
      operationId: deleteCacheEntry
      summary: Remove one entry (409 while a session has it open)
      parameters:
        - name: identity
          in: path
          required: true
          description: a session's cacheIdentity
          schema:
            $ref: "#/components/schemas/Identity"
      responses:
        "204":
          description: removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/askpass:
    post:
      operationId: askpass
      summary: A prompt of ssh, posted by the `mtkprof askpass` helper; answered once the user has
      description: |
        The engine spawns the system ssh/sftp with `SSH_ASKPASS` set to the
        mtkprof binary and `MTKPROF_ENGINE`, `MTKPROF_TOKEN`,
        `MTKPROF_PROMPT_CONN` in its environment. ssh runs the helper with
        its prompt text; the helper classifies it and posts it here. The
        engine raises a `prompt` event and holds the request until
        `POST /engine/prompts/{id}`, then answers `{answer}` (hostkey and
        confirm: the helper prints yes or no). Password and passphrase
        answers are kept in memory per connection until it is deleted; a
        cached answer is offered once per ssh run (`spawn`), so a wrong one
        is asked again. A cancelled prompt is 409 `cancelled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskpassRequest"
      responses:
        "200":
          description: the answer
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections:
    get:
      operationId: listConnections
      summary: The registered connections, by id
      responses:
        "200":
          description: connections
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: putConnection
      summary: Register (or replace) a connection definition; no secrets
      description: |
        Replacing a definition closes the old connection and drops its
        credentials (409 while a fetch or follow of it runs). A `db`
        connection is stored, but its operations answer 400 "not
        implemented yet" until internal/remote/db is wired (E8); follow is
        ssh only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionDef"
      responses:
        "200":
          description: registered
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    $ref: "#/components/schemas/ConnectionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Cancel the connection's jobs, close it and forget its credentials
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "204":
          description: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Connect (prompting as needed) and report the host
      description: |
        db connections: opens the connection's database session (asking for the
        password through a prompt unless it is cached), reports the server
        version and `diag` (V$DIAG_INFO). The session stays open until the
        connection is deleted.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/ls:
    get:
      operationId: lsConnection
      summary: List a remote directory (or one file)
      description: |
        ssh connections only (db: 400). ssh: `sftp -b -` running `ls -ln path` (cli) or SFTP ReadDir (lib).
        Hidden files are not listed; symbolic links are not followed.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: path
          in: query
          required: true
          description: remote directory or file (absolute, or relative to the login directory)
          schema:
            type: string
      responses:
        "200":
          description: the listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/diag:
    get:
      operationId: diagConnection
      summary: Candidate trace directories on the host
      description: |
        db connections: the `Diag Trace` of V$DIAG_INFO (one directory) and
        the `adrHome`.

        ssh: `$ORACLE_BASE/diag/rdbms/*/*/trace`, the same under the ORACLE_BASE of
        every home in /etc/oratab (/var/opt/oracle/oratab), then
        `/u01/app/oracle/diag/rdbms/*/*/trace`; existing directories only,
        without duplicates.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: directories
          content:
            application/json:
              schema:
                type: object
                required: [dirs]
                properties:
                  dirs:
                    type: array
                    items:
                      type: string
                  adrHome:
                    type: string
                    description: db connections only
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/fetch:
    post:
      operationId: fetchConnection
      summary: Copy remote files into the cache (job kind fetch)
      description: |
        db connections: body `{adrHome, name}` (see `DBFetchRequest`); the trace
        is read out of `V$DIAG_TRACE_FILE_CONTENTS`, 50 000 lines per query, on
        a database session of the job's own, into
        `<cache>/remote/<connection>/<name>`. The job counts `lines` (total
        unknown); a partial local file is continued after its last complete
        line (the file is cut there, so cancel and refetch resume). Past 200 MB
        the job's `message` says SSH is faster. `localPaths` has the one file.

        ssh connections: files go to `<cache>/remote/<connection>/<basename>` (base names must
        differ). A local file shorter than the remote one is resumed at its
        size; a longer one is fetched again from the start. ssh/cli streams
        `tail -c +N -- path`, through `gzip -1 -c` when the host has gzip
        and `gzip` is not false; lib reads over SFTP. Progress: bytes over
        all files (`total` from the remote sizes, raised if a file grows).
        The finished job carries `localPaths`; open them with
        `POST /engine/sessions`. Cancel with `DELETE /engine/jobs/{id}`;
        the partial files stay for the next fetch to resume.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SSHFetchRequest"
                - $ref: "#/components/schemas/DBFetchRequest"
      responses:
        "202":
          description: the job and where the files will be
          content:
            application/json:
              schema:
                type: object
                required: [job, localPaths]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
                  localPaths:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}/follow:
    post:
      operationId: followConnection
      summary: Follow a growing remote file in a live session (mirror job kind follow)
      description: |
        The job (kind follow) copies the file to
        `<cache>/remote/<connection>/<basename>` (resuming at the local size)
        and keeps appending what the host writes (ssh/cli: `tail -c +N -f --
        path`, stopped on the host when the stream ends; lib: SFTP size poll
        every 500 ms), reconnecting after a drop (5 failures in a row end
        it). `done` is the local size, `total` 0. The session is a live
        session over the local mirror (as `POST /engine/sessions` with
        `options.follow`; `options` as there, `follow` ignored): DELETE of
        the session cancels the job; the end of the job (cancelled with
        `DELETE /engine/jobs/{id}`, or failed) fails the session after the
        mirrored bytes are parsed, its last snapshot still served. Latency
        from a write on the host to a snapshot: the transport's delay (lib:
        up to 500 ms) + up to `batchMs` + 100 ms + the snapshot (< 2 s with
        the defaults). `mirrorOnly: true`: the mirror job alone, no
        session (answer without `session`). When the file continues in
        another (`TRACE CONTINUES IN FILE x`), the session starts a second
        follow job on the same connection for the file of that name in the
        same remote directory (it polls every 500 ms until the host has it),
        cancels the first one once the second has opened its local file,
        and parses on into it; DELETE of the session cancels the current
        one.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path:
                  type: string
                options:
                  $ref: "#/components/schemas/SessionOptions"
                mirrorOnly:
                  type: boolean
      responses:
        "202":
          description: the live session (unless mirrorOnly), the mirror job and the local file
          content:
            application/json:
              schema:
                type: object
                required: [job, localPath]
                properties:
                  session:
                    $ref: "#/components/schemas/SessionInfo"
                  job:
                    $ref: "#/components/schemas/JobInfo"
                  localPath:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}/tracefiles:
    get:
      operationId: tracefilesConnection
      summary: Trace files of the ADR home (db connections)
      description: |
        V$DIAG_TRACE_FILE (12.2+) joined to V$PROCESS and V$SESSION for the
        session writing each file, newest first. Without access to the view
        (ORA-00942) the live sessions' V$PROCESS.TRACEFILE are listed instead
        (`fromProcess`; `since` does not apply). Needs the grants of
        docs/REMOTE.md.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: sid
          in: query
          description: only the file of this session's server process
          schema:
            type: integer
        - name: serial
          in: query
          schema:
            type: integer
        - name: since
          in: query
          description: "only files modified within a duration (2h, 30m, 1d) or since an RFC 3339 time"
          schema:
            type: string
      responses:
        "200":
          description: the files
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/DBTraceFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/sessions:
    get:
      operationId: sessionsConnection
      summary: The user sessions of the database (db connections)
      description: V$SESSION of type USER, newest logon first; `self` marks the connection's own session.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: the sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/DBSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/trace:
    post:
      operationId: traceConnection
      summary: Switch SQL trace of a session on or off (db connections)
      description: |
        `DBMS_MONITOR.SESSION_TRACE_ENABLE` / `SESSION_TRACE_DISABLE` for the
        session sid,serial (needs EXECUTE on DBMS_MONITOR), or with `self`
        `DBMS_SESSION` for the connection's own session (waits, binds,
        plan_stat ALL_EXECUTIONS). Enabling answers with the trace file the
        session writes when it can tell.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enable]
              additionalProperties: false
              properties:
                sid:
                  type: integer
                serial:
                  type: integer
                enable:
                  type: boolean
                waits:
                  type: boolean
                  default: true
                binds:
                  type: boolean
                  default: true
                planStat:
                  type: string
                  enum: [never, first_execution, all_executions]
                  default: all_executions
                self:
                  type: boolean
                  description: the connection's own session; no sid or serial
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
                  traceFile:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /s/{id}/api/doc:
    get:
      operationId: sessionDoc
      summary: The session's document (format 3, slice true, packed, no fact tables)
      description: |
        The document `mtkprof serve -spill` serves at `/api/doc`. `stats.minimap`
        holds 1024 buckets of CPU and wait time per wait class over the whole
        span. `rev` is accepted. The session's `rev` (SessionInfo, session
        events) is 1 when it opens and rises by one whenever a reference
        bundle is applied (`POST /s/{id}/api/ref`); fetch the document again
        after a session event with a new `rev`. A live session answers its
        latest snapshot, the revision in the `X-Rev` header and the session's
        state in `X-Live` (`live` while it follows; `failed` or `closed` once
        the follow has stopped, no newer revision will come); with `rev=N`
        and no revision newer than N yet, the answer waits up to 25 s for the
        next snapshot (or the end of the follow) and is the document it has
        then, 200 either way (a long poll: compare `X-Rev`; the same `X-Rev`
        after the wait, never 304). A `rev` that is not a number is a 400 on
        a live session.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: rev
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: the document
          headers:
            X-Rev:
              description: the revision of the document (live sessions)
              schema:
                type: integer
            X-Live:
              description: "the state of a live session: live while it follows, failed or closed once it has stopped (live sessions)"
              schema:
                type: string
                enum: [live, failed, closed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/ref:
    post:
      operationId: sessionRef
      summary: Apply a reference bundle to the session (job kind ref)
      description: |
        Names for obj#, file# and user ids and DBMS_XPLAN plans
        (docs/REF-BUNDLE.md). `{dir}`: the files of a bundle directory
        (objects.csv, datafiles.csv, users.csv, plans/*.txt) are copied to the
        engine. `{connection}`: the reference queries of the session's trace
        are run on that db connection (own database session; `lite` = ALL_
        views only, no datafiles); queries that fail are skipped and named in
        the finished job's `message`. The bundle is kept at
        `<cache>/ref/<SessionInfo.identity>/` and applied to the model, the
        document is rebuilt and `rev` rises by one (a session event); the
        job ends `done` with the bundle's size in `message`. Opening the same
        trace again applies the kept bundle before the first document.
        Applying another bundle replaces the first. One ref job per session
        at a time (409). `DELETE /engine/cache` drops the kept bundles of the
        traces no session has open.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dir:
                  type: string
                  description: a bundle directory on the engine's machine
                connection:
                  type: string
                  description: id of a db connection
                lite:
                  type: boolean
                  description: with connection only
      responses:
        "202":
          description: the job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/brief:
    post:
      operationId: sessionBrief
      summary: A Markdown brief of the trace for an LLM agent
      description: |
        What `mtkprof brief` prints, for the session's trace and a scope: the
        response time and resource profile, the statements that make up 80% of
        the response time (at most `options.maxStatements`) with SQL, call
        table, top waits, slowest executions and plan, the findings with their
        evidence, the notes next to what they annotate, the case text, and
        closing instructions for the agent. It is facts only: interpretation is
        left to the agent the text is handed to.

        The body is optional (an empty body is `{}`: the whole trace, the
        defaults, binds masked). `scope` is the scope of the slice endpoints:
        a window (`from`, `to`, tim in µs, 0 = open) and session `contexts`
        (empty = all). Notes are the desktop's annotations; a note about
        something outside the scope is left out and counted, a note about a
        statement that is not listed is printed under "Other notes".

        `options.binds`: `mask` (default) shows each bind value as its type,
        length and a hash salted per brief (random unless `options.salt` is
        given), `keep` shows the traced values, `none` leaves binds out. SQL
        text is never masked. A session opened with `binds` redact or none
        can show no more than that.

        The answer is `text/markdown`; `X-Mtkprof-Est-Tokens` carries the
        estimate of its size in LLM tokens (bytes over 4).
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefRequest"
      responses:
        "200":
          description: the brief
          headers:
            X-Mtkprof-Est-Tokens:
              description: the estimated number of tokens of the body (bytes over 4)
              schema:
                type: integer
          content:
            text/markdown:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/assist/tools/{name}:
    post:
      operationId: sessionAssistTool
      summary: Run one analysis tool on the session's trace
      description: |
        The body is the JSON object of the tool's arguments (see
        `GET /engine/assist/tools`; an empty body is `{}`). The answer is the
        tool's result: compact JSON of at most about 8,000 tokens
        (`X-Mtkprof-Est-Tokens`, bytes over 4). A list that does not fit is
        cut and the result says so (`truncated`, `hint`). The numbers are those
        of the matching slice route for the same scope. A tool takes the scope
        as `from`, `to` and `contexts` arguments (the whole trace when absent).

        `binds`: `mask` (default) shows each bind value as its type, length and a
        hash salted per session (random), in `executions`, in the BINDS blocks of
        `lines` and `search_lines`, and drops the bind values the outlier
        executions finding appends; `keep` shows the traced values. A session
        opened with `binds` redact or none can show no more than that in the
        model, but the trace text of `lines` is masked all the same.

        `X-Mtkprof-Conversation` names the conversation the call belongs to
        (`MTKPROF_CONVERSATION` in `mtkprof mcp`), a conversation of this
        session (404 otherwise). Such a call runs with the conversation's scope
        (the default of `from`, `to`, `contexts`), masking (the `binds`
        parameter is ignored), notes and view, and shows on its open turn as
        `tool_call` and `tool_result` events. The notes and current_view tools
        only have something to say inside a conversation that was given notes
        and a view; elsewhere they answer `supplied: false`. show sends an
        `intent` event on the conversation's open turn; without one it is a
        400.

        Under masking, search_lines matches a line of a BINDS block on its
        masked text, so a bind value cannot be found by searching for it.

        An unknown tool or an argument that does not fit its schema is a 400
        with the envelope.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: name
          in: path
          required: true
          description: the tool (see `GET /engine/assist/tools`)
          schema:
            type: string
        - name: binds
          in: query
          description: mask (default) or keep bind values
          schema:
            type: string
            enum: [mask, keep]
            default: mask
        - name: X-Mtkprof-Conversation
          in: header
          description: the conversation the call belongs to
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: the tool's result
          headers:
            X-Mtkprof-Est-Tokens:
              description: the estimated number of tokens of the body (bytes over 4)
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines:
    get:
      operationId: sessionLines
      summary: Raw lines of one input file (optionally annotated with the line kinds)
      description: |
        Up to `n` lines (at most 2000) of input file `file`, starting at line
        `from`. Plain: `text/plain` with the file's line count in
        `X-Total-Lines`. With `annot=1`: JSON `{from, total, lines: [{t, k}]}`,
        each line without its terminator and its kind `k` (`trace.Classify`,
        see `LineKind`). A page that starts in the middle of a statement is
        classified from the 64 lines before it; a statement longer than both
        that and the page has wrong kinds until its `END OF STMT` (bind value
        continuation lines and PARSE ERROR text come out as `unknown`).

        With `annot=2` each line also carries the ids `api/at` answers for it:
        the call `c`, the statement `s`, the cursor `u`, the execution number
        `x` and the wait `w`, assigned by the same rules as `api/at` (cursor
        text lines get the cursor above them, STAT lines the cursor of their
        plan, a WAIT line its wait and the call it is attributed to, BINDS
        lines the call that follows, any other line the last call at or before
        it). An id that does not apply is -1; the five keys are all omitted
        when none applies (framing lines). Computed in one pass over the page.
        (`ctx`, `bindSet` and `planLine` of `api/at` are not part of it.) A
        server without the model (no `/api/at`) answers `annot=2` like
        `annot=1`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: file
          in: query
          description: index of the input file (document file.files order)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: from
          in: query
          description: 1-based first line
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: n
          in: query
          description: number of lines (missing or above 2000 = 2000)
          schema:
            type: integer
            maximum: 2000
            default: 2000
        - name: annot
          in: query
          description: "1: the JSON form with a kind per line; 2: also the ids per line (c, s, u, x, w)"
          schema:
            type: string
            enum: ["0", "1", "2"]
            default: "0"
      responses:
        "200":
          description: the lines
          headers:
            X-Total-Lines:
              description: the line count of the file (plain form)
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/LinesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/at:
    get:
      operationId: sessionLinesAt
      summary: The first line whose call or wait has tim >= the given one
      description: |
        Binary search over the call rows of the file, then over its waits;
        the smaller line wins (a call's WAIT lines come before its own line).
        A `tim` past the last record gives the line of the last call or wait.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: tim
          in: query
          required: true
          description: trace clock value in µs
          schema:
            type: integer
      responses:
        "200":
          description: "{line}: 1-based line number"
          content:
            application/json:
              schema:
                type: object
                properties:
                  line:
                    type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or a file without call and wait rows (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/next:
    get:
      operationId: sessionLinesNext
      summary: The next or previous structural line of a file
      description: |
        The first line strictly after (`dir=1`) or strictly before (`dir=-1`)
        `from` that holds the wanted element: `call` (a call row, XCTEND
        included), `wait`, `cursor` (a PARSING IN CURSOR block; implicit cursors
        have none), `plan` (the first line of a STAT block), `ctx` (a session
        context announcement), `error` (ERROR and PARSE ERROR lines) or `commit`
        (XCTEND lines) or `gap` (a call or wait row with an idle gap before it of
        at least `min` µs). Binary searches over the fact rows and the sorted
        per-file lists, so every step is O(log n) and no text is scanned; `gap`
        walks the rows from `from` (O(rows)). The gap of a row with tim T and
        duration D (a call's `e`, a wait's `ela`) is (T - D) - T' (negative gaps
        are 0). T' is the tim of the previous call row of the file for a call
        (the WAIT lines of a call are printed before the call line, so the wait
        just above would hide the idle time) and the tim of the previous row of
        either kind, in line order, for a wait. A row with no such row before
        it has no gap. 404 when there is
        nothing further in that direction.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: from
          in: query
          description: line to step from (0 = before the first line); default 0
          schema:
            type: integer
            minimum: 0
        - name: what
          in: query
          required: true
          schema:
            type: string
            enum: [call, wait, cursor, plan, ctx, error, commit, gap]
        - name: min
          in: query
          description: for `what=gap`, the smallest gap in µs (> 0); default 1000000
          schema:
            type: integer
            minimum: 1
            default: 1000000
        - name: dir
          in: query
          required: true
          schema:
            type: integer
            enum: [1, -1]
      responses:
        "200":
          description: "{line}: 1-based line number"
          content:
            application/json:
              schema:
                type: object
                properties:
                  line:
                    type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or nothing further in that direction (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/blocks:
    get:
      operationId: sessionLinesBlocks
      summary: The foldable blocks of one kind in a file
      description: |
        `stat`: every plan dump of the file, `[first STAT line, last STAT line]`.
        `binds`: every BINDS block of the file (the bind sets owned by its
        calls), from the `BINDS #N:` header to the last line that belongs to the
        block: bind lines and the unrecognised or blank lines that continue them
        (memory dump rows, multi-line values); trailing blank lines are left
        out, at most 4096 lines per block. The blocks are sorted and do not
        overlap; at most 20000 are answered, `truncated` says there were more.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: what
          in: query
          required: true
          schema:
            type: string
            enum: [binds, stat]
      responses:
        "200":
          description: BlocksAnswer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocksAnswer"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/profile:
    get:
      operationId: sessionLinesProfile
      summary: Per-bucket density of a file's lines (the Lines view strip)
      description: |
        The file cut into `buckets` runs of `size = ceil(total/buckets)` lines
        (bucket i covers lines `i*size+1 .. min(total, (i+1)*size)`) with, per
        bucket, the number of calls, waits, cursor parses (PARSING IN CURSOR
        blocks; implicit cursors have none), errors (ERROR and PARSE ERROR) and
        commits (XCTEND) on its lines. A file with fewer lines than `buckets`
        gets one bucket per line (`size` 1); when `size` does not divide `total`
        the last buckets may be empty. An empty file answers `total`, `buckets`
        and `size` 0 and empty arrays. Binary searches at the bucket edges over
        the fact rows and the sorted per-file lists: no text is scanned.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: buckets
          in: query
          description: number of buckets, 1..2000; default 200
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: LinesProfile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinesProfile"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/hot:
    get:
      operationId: sessionLinesHot
      summary: The calls and waits of a file that took long (the Lines view time bars)
      description: |
        The call rows (`us` = the `e=` of the line) and wait rows (`us` = `ela`;
        idle waits count like any wait) of the file whose time is at least `min`
        microseconds. At most `limit` rows are answered: when more qualify the
        ones with the largest `us` are kept (the earlier line wins a tie) and
        listed in line order, and `truncated` says some were left out. `max` is
        the largest `us` of any call or wait row of the file (0 when it has
        none), whatever `min` and `limit` say: the scale for the time bars. One
        pass over the file's call and wait rows.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: min
          in: query
          description: smallest time in microseconds that is listed; default 1000 (1 ms)
          schema:
            type: integer
            minimum: 0
            default: 1000
        - name: limit
          in: query
          description: most rows listed, 1..20000; default 2000
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 2000
      responses:
        "200":
          description: LinesHot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinesHot"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/repeats:
    get:
      operationId: sessionLinesRepeats
      summary: Stretches of repeated rows of a file that can be folded to one line
      description: |
        The candidates of the Lines view's "Fold repeats". The call and wait rows
        of the file are walked in line order and three kinds of folds are found;
        they are sorted by `from`, do not overlap, at most 20000 are answered
        (`truncated` says there were more).

        `run`: 3 or more waits of one event in a row (`event`) inside a wait
        block. A wait block is a maximal run of consecutive non-idle waits of one
        cursor with no call row between them; an idle wait ends a block and is
        never folded on its own. `block`: when a wait block, with each run
        counted as one item and every other wait as one, still has more than 10
        items, the whole block is one fold (and has no `run` folds); `by` is the
        time per event, largest `us` first (the event name breaks a tie).
        `fetches`: 6 or more FETCH calls of one cursor, each with `e` below
        `small`, with only waits of that cursor below `small` between them (idle
        ones included) and no other call: `from` and `to` are the first and the
        last fetch's line; `rows`, `cr` and `p` are the sums of the fetches' rows,
        consistent reads and physical reads, `idle` the idle wait time between
        them. A fetch with `e` of `small` or more is not part of a loop. The
        `run` and `block` folds that lie inside a `fetches` fold are left out.

        `n` counts the folded waits (run, block) or fetches; `us` is their summed
        elapsed time and `max` the largest single one, in microseconds.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: small
          in: query
          description: |
            microseconds below which a fetch or a wait of a fetch loop is cheap;
            default (and 0): 1% of the file's time span (the `tim` of its last
            row minus that of its first, calls and waits together), at least 1
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: LinesRepeats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinesRepeats"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/at:
    get:
      operationId: sessionAt
      summary: The model objects a trace line belongs to
      description: |
        Ids are -1 where there is no such object (`execNo` and `planLine`
        too). By `kind` of the line: WAIT: the wait and the call it is
        attributed to; PARSING IN CURSOR, SQL text, END OF STMT: only the
        cursor (and its statement and context); STAT: `planLine`, the index
        into the document's `planLines`, and the cursor; BINDS block: the
        call (EXEC) it is attached to, also for the continuation lines of a
        bind value or memory dump inside the block; anything else: the last
        call at or before the line. With a `bindSet`, `bindLine` and `binds`
        carry its header line and values.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: line
          in: query
          required: true
          description: 1-based line number
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: the objects at the line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtAnswer"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or no such line (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/search:
    get:
      operationId: sessionSearch
      summary: Search the text of one input file (NDJSON stream)
      description: |
        Scans the file from line `from` in 4 MB chunks and streams one JSON
        object per matching line, in line order, flushed as they are found:
        `{line, col, text}` (`col` is the 0-based byte offset of the first
        match, `text` the line without its terminator, cut to 400 bytes). The
        last record is `{done: true, scanned, truncated}`: `scanned` is the
        number of lines examined from `from`, `truncated` is true when
        `limit` stopped the scan. A request that is cancelled (the client
        closes the connection) stops within a chunk and ends without the done
        record. A literal `q` cannot contain a newline.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: q
          in: query
          required: true
          description: the text, or the regular expression (Go RE2 syntax) with regex=1
          schema:
            type: string
        - name: regex
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
        - name: case
          in: query
          description: "1: case-sensitive; 0 folds ASCII letters (regex: (?i))"
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: from
          in: query
          description: 1-based first line to search
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: matches to report (above 10000 = 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        "200":
          description: newline-delimited JSON, SearchHit records then one SearchEnd
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SearchHit"
                  - $ref: "#/components/schemas/SearchEnd"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/plan:
    get:
      operationId: sessionPlan
      summary: The rows of one STAT plan dump (what `mtkprof plan` prints)
      description: |
        The statement is `stmt` (its id in the document's `statements`) or
        `sql_id`. With `plh` the answer is the array of `PlanRow` of one
        dump of that plan hash (visualizer input, the V$SQL_PLAN_STATISTICS_ALL
        row format); `exec` picks the n-th STAT dump of the hash in trace
        order, the latest when missing. Without `plh` the statement's plan
        hashes are answered: the array when it has one, otherwise an object
        `{"<plan hash>": [rows]}` in order of first appearance (hashes with
        fewer than `exec` dumps are left out). The first row carries
        `sql_text`, `execution` (the dump's number among those of the hash)
        and `trace_line`. Compact JSON; `mtkprof plan` prints the same
        indented.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: stmt
          in: query
          description: statement id (document statements index); give this or sql_id
          schema:
            type: integer
            minimum: 0
        - name: sql_id
          in: query
          description: the Oracle sql_id (the first statement with it)
          schema:
            type: string
        - name: plh
          in: query
          description: plan hash value, decimal
          schema:
            type: string
        - name: exec
          in: query
          description: n-th STAT dump of the plan hash, 1-based (0 or missing = the latest)
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: the rows of one dump, or an object of them keyed by plan hash
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/PlanRow"
                  - type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: "#/components/schemas/PlanRow"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such sql_id, no STAT plan for the statement, no such plan hash or dump (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/report:
    get:
      operationId: sessionReport
      summary: The CLI's outputs for this session (download)
      description: |
        Streams what `mtkprof report`, `json`, `export` and `html` write for
        the session's trace, as an attachment (`Content-Disposition` names it
        after the first input file). The session's model is the aggregate one
        `mtkprof serve -spill` has, which shapes the outputs:

        - `text`: the report of `mtkprof report -aggregate`: everything but the
          per-statement executions tables, which it says it leaves out
          (`execs` is accepted and has no effect). Bind values are in or out
          as the session was opened (`options.binds`).
        - `json`: the document with `facts: false` and `packed: false` (an
          aggregate model has no fact tables), the plan visualizer URL of the
          engine (`-plan-viz-url`).
        - `csv`: a zip of the files `mtkprof export` writes (`statements.csv`
          ... `errors.csv`, flat in the archive); calls, waits and binds are
          read from the spill and equal the CLI's.
        - `html`: the single-file report, the UI page with the document of
          `json` (packed, no fact tables) inlined; the drill-downs that need
          fact tables have nothing to show.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: format
          in: query
          schema:
            type: string
            enum: [text, json, csv, html]
            default: text
        - name: sort
          in: query
          description: text only, statement order
          schema:
            type: string
            enum: [elapsed, self, cpu, execs, disk, query, rows, line]
            default: elapsed
        - name: top
          in: query
          description: text only, only the top N statements (0 = all)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: execs
          in: query
          description: text only, executions to list per statement (0 = none, -1 = all)
          schema:
            type: integer
            minimum: -1
            default: 20
        - name: binds
          in: query
          description: text only, bind sets to print per statement (0 = none)
          schema:
            type: integer
            minimum: 0
            default: 5
        - name: sys
          in: query
          description: text only, include recursive SYS statements
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: width
          in: query
          description: text only, report width (below 80 = 120)
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 120
      responses:
        "200":
          description: the report, as an attachment
          headers:
            Content-Disposition:
              description: attachment; filename="<first input without .trc>.txt|.json|.csv.zip|.html"
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
            application/zip:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: the report could not be produced (before the first byte; a failure later ends the stream short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /s/{id}/api/pivot:
    get:
      operationId: slicePivot
      summary: Group-by of calls or waits (analyze.Pivot)
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: fact
          in: query
          required: true
          schema:
            type: string
            enum: [calls, waits]
        - name: by
          in: query
          required: true
          description: comma-separated dimensions (a 400 lists the valid ones)
          schema:
            type: string
        - name: measure
