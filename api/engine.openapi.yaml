                    items:
                      type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/waits/hist:
    get:
      operationId: sliceWaitHist
      summary: log2 histogram of wait durations
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          description: LogHist
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  us:
                    type: integer
                  counts:
                    type: array
                    items:
                      type: integer
                  sums:
                    type: array
                    items:
                      type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/waits/scatter:
    get:
      operationId: sliceWaitScatter
      summary: Sampled waits over time; rows are [tim, ela, line, stmt, ctx]
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: max
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 20000
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          description: ScatterResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  sampled:
                    type: boolean
                  cols:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/waits/by:
    get:
      operationId: sliceWaitsBy
      summary: Wait time by statement, object, p1 or p2, largest first
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: by
          in: query
          required: true
          schema:
            type: string
            enum: [stmt, obj, p1, p2]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 12
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          description: WaitsByResponse (rows of {key, count, us})
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: integer
                  rows:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/profile:
    get:
      operationId: sliceProfile
      summary: CPU and waits per event in scope
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      description: |
        `analyze.ProfileOfOn`: the CPU of the top-level calls and the waits
        per event in scope (the ledger), and the scope's response time the
        ledger is measured against (`analyze.ResponseOf`): the sum over the
        scope's sessions (a process of a file chain) of each session's span
        from its first call start to its last row, clipped to the window;
        PX slaves attached to a coordinator in scope are left out. `wallUs`
        is the wall-clock span (the window, else the span of the files of
        the contexts, else the trace's). `stmt`, `event` and `idle` filter
        the ledger rows only.
      responses:
        "200":
          description: the profile of the scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeProfile"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/statements:
    get:
      operationId: sliceStatements
      summary: The document's statement table (doc.stats.statements) over the scope
      description: |
        `analyze.StatementsOn`: one `StmtStats` per statement in id order,
        computed from the calls in scope (zero numbers where none is; `id`
        is always set), the same JSON as the entries of
        `doc.stats.statements`. Without parameters it equals
        `doc.stats.statements`. The UI's file selection sends the contexts of
        the selected files. `idle` is accepted and changes nothing: the wait
        times are those attributed to the calls in scope. Cursors, plans and
        errors follow the scope too (see `analyze.StatementsOn`).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: "{statements: [StmtStats]}"
          content:
            application/json:
              schema:
                type: object
                required: [statements]
                properties:
                  statements:
                    type: array
                    items:
                      $ref: "#/components/schemas/StmtStats"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/findings:
    get:
      operationId: sliceFindings
      summary: The document's findings (doc.stats.findings) over the scope
      description: |
        `analyze.FindingsOn`: the finding rules over the rows in scope, with
        the thresholds of the document's findings, the same JSON as
        `doc.stats.findings` (most severe first). Without parameters it
        equals `doc.stats.findings`. The statement table is that of
        `api/statements`, the executions are those whose EXEC call is in
        scope, the waits, commits and round trips those in scope, and the
        response time the severities are measured against is the window,
        else the span of the files of the selected contexts. A finding with
        `scope: "set"` is about the whole trace set and was not narrowed
        (no current rule is). `idle` is accepted and changes nothing.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: "{findings: [Finding]}"
          content:
            application/json:
              schema:
                type: object
                required: [findings]
                properties:
                  findings:
                    type: array
                    items:
                      type: object
                      required: [rule, title, severity, summary, statement, impactUs, evidence]
                      properties:
                        rule:
                          type: string
                        title:
                          type: string
                        severity:
                          type: string
                          enum: [serious, notable, info]
                        summary:
                          type: string
                        statement:
                          type: integer
                          description: statement id, -1 for a trace-level finding
                        impactUs:
                          type: integer
                        evidence:
                          type: array
                          items:
                            type: object
                        scope:
                          type: string
                          enum: [set]
                          description: present when the finding is about the whole set (not narrowed)
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/stmt/roles:
    get:
      operationId: sliceStmtRoles
      summary: Wait time per statement and wait class (waits in scope); rows are [statement, class index, µs]
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: classes and rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        type: integer
  /s/{id}/api/stmt/waits:
    get:
      operationId: sliceStmtWaits
      summary: Top wait events of statements (waits in scope), keyed by statement id
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/StmtList"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
        - name: max
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 6
      responses:
        "200":
          description: "{waits: {<stmt>: [{event, us, count, maxUs, obj}]}}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  waits:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/stmt/spans:
    get:
      operationId: sliceStmtSpans
      summary: Merged time intervals of statements' calls in scope, keyed by statement id
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/StmtList"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - name: gap
          in: query
          description: merge intervals closer than this many µs
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: phases
          in: query
          description: >-
            segment the calls by phase instead of merging them: each interval then also has
            kind (the dominant call group by elapsed time) and us (µs per group). Calls join a
            segment when they start at most gap µs after its end and either continue its
            dominant group, or the segment is still narrower than gap, or the call is shorter
            than gap, so segments stay about gap wide.
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
      responses:
        "200":
          description: >-
            {spans: {<stmt>: [{start, end}]}}; with phases=1 each interval also has kind and us
          content:
            application/json:
              schema:
                type: object
                properties:
                  spans:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: integer
                          end:
                            type: integer
                          kind:
                            type: string
                            enum: [parse, exec, fetch, close, other]
                            description: only with phases=1
                          us:
                            type: array
                            description: only with phases=1; elapsed µs per group, in the order parse, exec, fetch, close, other (other = every kind but PARSE/EXEC/FETCH/CLOSE)
                            minItems: 5
                            maxItems: 5
                            items:
                              type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/stmt/waitspans:
    get:
      operationId: sliceStmtWaitSpans
      summary: Stretches of statements' waits in scope with their dominant events, keyed by statement id
      description: >-
        A wait covers [tim-ela, tim] (a WAIT line's tim is its end). Waits are cut into segments in start order: a wait
        joins the current segment when it starts at most gap µs after its end and either is on the segment's dominant
        event, or the segment is still narrower than gap, or the wait is shorter than gap. Idle waits follow idle.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/StmtList"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
        - name: gap
          in: query
          description: segmentation width in µs (see above)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: "{spans: {<stmt>: [{start, end, event, top, restUs}]}}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  spans:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: integer
                          end:
                            type: integer
                          event:
                            type: integer
                            description: id of the dominant event (most µs; ties the lower id) in the document's events table
                          top:
                            type: array
                            description: "[event id, µs] of the (at most 3) events with the most time, biggest first"
                            maxItems: 3
                            items:
                              type: array
                              minItems: 2
                              maxItems: 2
                              items:
                                type: integer
                          restUs:
                            type: integer
                            description: µs of the segment's other events
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/io/map:
    get:
      operationId: sliceIOMap
      summary: The physical I/O waits with a block address in scope, at their file and block (the Blocks view)
      description: >-
        `analyze.IOMapOn`: every wait in scope whose event's parameters are a file number and a block address
        (p1 `file#` or `file number`, p2 `block#` or `first dba`: `model.Event.IsBlockIO`), in trace order. A row is
        [tim, ela, event, file, block, blocks, obj, stmt, call, line, ctx, dep] (`cols`); blocks is p3 when the event's
        p3 is a block count (`blocks`, `block cnt`) and positive, else 1; obj, stmt and call are -1 when none. With
        more than `limit` waits every k-th is kept (the 1st, the (k+1)-th, ...), k = ceil(total / limit), and
        `sampled` is set; `total`, `files` and `events` are over all of them. `idle` is accepted and changes nothing:
        block I/O is never idle.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: limit
          in: query
          description: rows at most; above it every k-th wait is kept
          schema:
            type: integer
            minimum: 1
            maximum: 200000
            default: 20000
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Event"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: the block I/O waits in scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IOMap"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/cut:
    get:
      operationId: sessionCut
      summary: The plan of a new trace file cut from the session's trace set (the desktop's Cut view)
      description: >-
        `cut.Cutter.Plan`: what /api/cut/file writes for the same parameters, without writing it. The units kept are
        whole top-level calls overlapping the window in the selected contexts (with `stmt`: that statement's calls),
        each with everything rolled up under it (recursive calls, waits, binds). The pieces of the new file in order
        (header, provenance, borrowed session markers, cursors restated before their first use, plans borrowed from
        outside the cut, generated timestamps and process switches, kept lines) and, per source file, every line's
        label as runs (K kept, E kept outside the window to finish a call, H header, B borrowed before the cut, A
        borrowed after it, C a caller left out; unlabelled lines are left out).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - name: edges
          in: query
          description: calls (default) keeps whole calls; executions widens to every call of a kept call's execution
          schema:
            type: string
            enum: [calls, executions]
        - name: binds
          in: query
          description: >-
            what the kept BINDS blocks get: keep (as traced), mask (each value replaced by the redaction token
            `<TYPE len=N h=XXXXXXXX>`, salted with the session's salt) or none (left out). A session opened with
            redacted bind values allows mask and none, one opened without them none; the default is the first allowed.
          schema:
            type: string
            enum: [keep, mask, none]
        - name: plans
          in: query
          description: 0 = do not borrow STAT dumps from outside the kept lines
          schema:
            type: integer
            enum: [0, 1]
        - name: prov
          in: query
          description: 0 = no "mtkprof cut:" provenance lines in the header
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CutPlan"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/cut/check:
    get:
      operationId: sessionCutCheck
      summary: The new file written to a temporary file, parsed back and compared with the selection
      description: >-
        `cut.Cutter.Check`: per statement and call kind the count and elapsed of the calls, the waits (count and
        µs), the wall clock of the first kept call, and the statements that lost their SQL text, against what the
        selection keeps. `ok` when everything is equal. The temporary file is removed.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - name: edges
          in: query
          description: calls (default) keeps whole calls; executions widens to every call of a kept call's execution
          schema:
            type: string
            enum: [calls, executions]
        - name: binds
          in: query
          description: >-
            what the kept BINDS blocks get: keep (as traced), mask (each value replaced by the redaction token
            `<TYPE len=N h=XXXXXXXX>`, salted with the session's salt) or none (left out). A session opened with
            redacted bind values allows mask and none, one opened without them none; the default is the first allowed.
          schema:
            type: string
            enum: [keep, mask, none]
        - name: plans
          in: query
          description: 0 = do not borrow STAT dumps from outside the kept lines
          schema:
            type: integer
            enum: [0, 1]
        - name: prov
          in: query
          description: 0 = no "mtkprof cut:" provenance lines in the header
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: the comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CutCheck"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/cut/file:
    get:
      operationId: sessionCutFile
      summary: The new trace file
      description: >-
        `cut.Cutter.Write`, streamed as an attachment named after the first input (`<name>-cut.trc`). A failure
        before the first byte is a 500 with the reason as plain text; a failure after it ends the stream short.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - name: edges
          in: query
          description: calls (default) keeps whole calls; executions widens to every call of a kept call's execution
          schema:
            type: string
            enum: [calls, executions]
        - name: binds
          in: query
          description: >-
            what the kept BINDS blocks get: keep (as traced), mask (each value replaced by the redaction token
            `<TYPE len=N h=XXXXXXXX>`, salted with the session's salt) or none (left out). A session opened with
            redacted bind values allows mask and none, one opened without them none; the default is the first allowed.
          schema:
            type: string
            enum: [keep, mask, none]
        - name: plans
          in: query
          description: 0 = do not borrow STAT dumps from outside the kept lines
          schema:
            type: integer
            enum: [0, 1]
        - name: prov
          in: query
          description: 0 = no "mtkprof cut:" provenance lines in the header
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: the trace file
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "500":
          description: the cut failed before writing anything, the reason as plain text
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: the MTKPROF_TOKEN the engine was started with
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      description: session id (s + 12 hex digits)
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      description: job id (j + 12 hex digits)
      schema:
        type: string
    PromptID:
      name: id
      in: path
      required: true
      description: prompt id (p + 12 hex digits)
      schema:
        type: string
    ConversationID:
      name: c
      in: path
      required: true
      description: conversation id (c + 12 hex digits)
      schema:
        type: string
    ProviderID:
      name: id
      in: path
      required: true
      description: the provider id of the conversation request
      schema:
        type: string
    File:
      name: file
      in: query
      description: index of the input file (document file.files order)
      schema:
        type: integer
        minimum: 0
        default: 0
    ConnectionID:
      name: id
      in: path
      required: true
      description: connection id (the shell's)
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    From:
      name: from
      in: query
      description: scope start, tim in µs (a row is in when its [tim-ela, tim] overlaps the scope)
      schema:
        type: integer
        minimum: 0
    To:
      name: to
      in: query
      description: scope end, tim in µs (0 = open; not before from)
      schema:
        type: integer
        minimum: 0
    Contexts:
      name: contexts
      in: query
      description: >-
        comma-separated context ids (at most 10000); empty or absent = every context;
        `-` = no context at all (an explicit empty set: no row is in scope)
      schema:
        type: string
    Stmt:
      name: stmt
      in: query
      description: one statement id
      schema:
        type: integer
        minimum: 0
    StmtList:
      name: stmt
      in: query
      required: true
      description: comma-separated statement ids (at most 200)
      schema:
        type: string
    Event:
      name: event
      in: query
      description: one event id (waits only)
      schema:
        type: integer
        minimum: 0
    Idle:
      name: idle
      in: query
      description: include idle waits
      schema:
        type: string
        enum: ["0", "1"]
        default: "1"
    Scope:
      name: scope
      in: query
      description: "all: every wait; without it event or stmt is required"
      schema:
        type: string
        enum: [all]
  responses:
    BadRequest:
      description: bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: missing or wrong bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: no such object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: the object is in the wrong state (session not ready, job finished, entry open, engine shutting down)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Remote:
      description: the remote host or the connection to it failed (unreachable, authentication, permission, missing file)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SliceBadRequest:
      description: a bad parameter, the reason as plain text
      content:
        text/plain:
          schema:
            type: string
    Pivot:
      description: PivotResponse
      content:
        application/json:
          schema:
            type: object
            properties:
              fact:
                type: string
              dims:
                type: array
                items:
                  type: object
              measures:
                type: array
                items:
                  type: object
              rows:
                type: array
                items:
                  type: object
              total:
                type: array
                items:
                  type: number
              facts:
                type: integer
              bucketUs:
                type: integer
              groups:
                type: integer
              truncated:
                type: boolean
  schemas:
    LineKind:
      type: string
      description: the parser's kind of a trace line (trace.Kind.String())
      enum: [unknown, blank, header, separator, marker, parsing-in-cursor, sql-text, end-of-stmt, call, wait, stat, binds, bind-line, xctend, error, parse-error, lob, rpc]
    LinesPage:
      type: object
      properties:
        from:
          type: integer
        total:
          type: integer
          description: the line count of the file
        lines:
          type: array
          items:
            type: object
            properties:
              t:
                type: string
                description: the line without its terminator
              k:
                $ref: "#/components/schemas/LineKind"
              c:
                type: integer
                description: annot=2 only. Call id of the line as api/at gives it (-1 where none; the keys c, s, u, x, w are all omitted when none applies)
              s:
                type: integer
                description: annot=2 only. Statement id (-1 where none)
              u:
                type: integer
                description: annot=2 only. Cursor id (-1 where none)
              x:
                type: integer
                description: annot=2 only. Execution number of the call (-1 where none)
              w:
                type: integer
                description: annot=2 only. Wait id (-1 where none)
    LinesProfile:
      type: object
      description: |
        Per-bucket counts of one file; every array has `buckets` entries.
        Bucket i covers lines `i*size+1 .. min(total, (i+1)*size)`.
      required: [total, buckets, size, calls, waits, cursors, errors, commits, maxCalls, maxWaits]
      properties:
        total:
          type: integer
          description: the line count of the file
        buckets:
          type: integer
          description: the number of buckets, min(requested, total)
        size:
          type: integer
          description: lines per bucket, ceil(total/buckets)
        calls:
          type: array
          items:
            type: integer
        waits:
          type: array
          items:
            type: integer
        cursors:
          type: array
          items:
            type: integer
        errors:
          type: array
          items:
            type: integer
        commits:
          type: array
          items:
            type: integer
        maxCalls:
          type: integer
        maxWaits:
          type: integer
    LinesHot:
      type: object
      description: The long call and wait rows of one file, in line order.
      required: [hot, max, truncated]
      properties:
        hot:
          type: array
          items:
            type: object
            required: [line, us, wait]
            properties:
              line:
                type: integer
                description: 1-based line of the call or WAIT line
              us:
                type: integer
                description: microseconds, the call's e= or the wait's ela=
              wait:
                type: boolean
                description: a wait row (else a call row)
        max:
          type: integer
          description: the largest time of any call or wait row of the file; 0 when it has none
        truncated:
          type: boolean
          description: more rows than `limit` qualified; the smaller ones are left out
    LinesRepeats:
      type: object
      description: Fold candidates of one file, sorted by `from`, not overlapping.
      required: [folds, truncated]
      properties:
        folds:
          type: array
          items:
            $ref: "#/components/schemas/LinesRepeatFold"
        truncated:
          type: boolean
          description: more than 20000 folds existed; the later ones are left out
    LinesRepeatFold:
      type: object
      description: |
        One fold. `event` is answered for `run`, `by` for `block`, and `rows`,
        `cr`, `p` and `idle` for `fetches`.
      required: [from, to, kind, n, us, max]
      properties:
        from:
          type: integer
          description: first line of the fold (1-based, inclusive)
        to:
          type: integer
          description: last line of the fold (inclusive)
        kind:
          type: string
          enum: [run, block, fetches]
        n:
          type: integer
          description: waits (run, block) or fetch calls (fetches) in the fold
        us:
          type: integer
          description: their summed elapsed time in microseconds
        max:
          type: integer
          description: the largest single elapsed time among them, microseconds
        event:
          type: string
          description: kind run, the wait event
        by:
          type: array
          description: kind block, the waits per event, largest `us` first
          items:
            type: object
            required: [event, n, us]
            properties:
              event:
                type: string
              n:
                type: integer
              us:
                type: integer
        rows:
          type: integer
          description: kind fetches, rows returned by the fetches
        cr:
          type: integer
          description: kind fetches, consistent reads (query) of the fetches
        p:
          type: integer
          description: kind fetches, physical reads (disk) of the fetches
        idle:
          type: integer
          description: kind fetches, microseconds of idle waits between the fetches
    BlocksAnswer:
      type: object
      required: [blocks, truncated]
      properties:
        blocks:
          type: array
          description: sorted 1-based inclusive line ranges [from, to]
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
        bindLines:
          type: array
          description: |
            `binds` only: for each block (in the order of `blocks`), the lines of
            its `Bind#N` entries, ascending (empty for a block without one)
          items:
            type: array
            items:
              type: integer
        truncated:
          type: boolean
          description: more than 20000 blocks existed; the rest is left out
    AtAnswer:
      type: object
      description: ids are -1 where absent
      properties:
        call:
          type: integer
        stmt:
          type: integer
        cursor:
          type: integer
        execNo:
          type: integer
        wait:
          type: integer
        bindSet:
          type: integer
        bindLine:
          type: integer
          description: line of the BINDS header of `bindSet`; -1 when `bindSet` is -1
        binds:
          type: array
          description: the values of `bindSet` (absent when `bindSet` is -1), so a client without the facts tables can decode a bind line
          items:
            $ref: "#/components/schemas/BindValue"
        ctx:
          type: integer
        planLine:
          type: integer
          description: index into the document's planLines
        kind:
          $ref: "#/components/schemas/LineKind"
        execFrom:
          type: integer
          description: |
            first line of the execution the line belongs to (set when `execNo`
            >= 1): the BINDS block of the EXEC when it has one, else the first
            call; -1 where absent
        execTo:
          type: integer
          description: last line of that execution (its last FETCH, or the CLOSE that follows it); -1 where absent
        prevExec:
          type: integer
          description: line of the EXEC call of the previous execution of the same cursor in this file; -1 where absent (also beyond a 100k-row search window)
        nextExec:
          type: integer
          description: line of the EXEC call of the next execution of the same cursor in this file; -1 where absent (also beyond a 100k-row search window)
        cursorLine:
          type: integer
          description: line of the cursor's PARSING IN CURSOR block; -1 for an implicit cursor or one parsed in another file
        closeLine:
          type: integer
          description: line of the first CLOSE of the cursor at or after the line (within 100k call rows); -1 where absent
        object:
          type: string
          description: owner.name of a WAIT line's obj# when the session has a reference bundle that knows it, else ""
    BindValue:
      type: object
      description: one bind value of an execution
      properties:
        pos:
          type: integer
        type:
          type: string
          description: datatype name (`NUMBER`, `VARCHAR2`, ...)
        value:
          type: string
        isNull:
          type: boolean
        noDef:
          type: boolean
          description: '"No oacdef for this bind." (repeated bind name)'
        dump:
          type: boolean
          description: the value is a memory dump
        mal:
          type: integer
        kind:
          type: string
        typed:
          type: string
          description: decoded typed form of a dumped value; absent when none
    SearchHit:
      type: object
      properties:
        line:
          type: integer
        col:
          type: integer
          description: 0-based byte offset of the first match
        text:
          type: string
          description: the line, cut to 400 bytes
    SearchEnd:
      type: object
      properties:
        done:
          type: boolean
        scanned:
          type: integer
        truncated:
          type: boolean
    PlanRow:
      type: object
      description: one STAT line in the V$SQL_PLAN_STATISTICS_ALL-style row format of ora-explain-plan-viz; numbers are omitted where unknown
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, "null"]
        depth:
          type: integer
        operation:
          type: string
        object_name:
          type: string
        object_id:
          type: integer
        object_alias:
          type: string
        qblock_name:
          type: string
        access_predicates:
          type: string
        filter_predicates:
          type: string
        cardinality:
          type: integer
        bytes:
          type: integer
        cost:
          type: integer
        actual_rows:
          type: integer
        starts:
          type: integer
        actual_elapsed_time:
          type: integer
          description: µs
        cr_buffer_gets:
          type: integer
        physical_reads:
          type: integer
        physical_writes:
          type: integer
        sql_id:
          type: string
        plan_hash_value:
          type: string
        sql_text:
          type: string
          description: first row only
        execution:
          type: integer
          description: first row only, the dump's number among those of the plan hash
        trace_line:
          type: integer
          description: first row only, line of the first STAT line
    CallStats:
      type: object
      description: analyze.CallStats, tkprof-style totals of one call kind
      properties:
        count:
          type: integer
          description: "calls"
        misses:
          type: integer
          description: "library cache misses (Σ mis)"
        cpu:
          type: integer
          description: "µs"
        elapsed:
          type: integer
          description: "µs"
        disk:
          type: integer
        query:
          type: integer
        current:
          type: integer
        rows:
          type: integer
        waitUs:
          type: integer
          description: "in-call waits attributed to these calls, µs"
        idleUs:
          type: integer
          description: "between-call waits attributed to these calls, µs"
        selfCpu:
          type: integer
          description: "µs, excluding recursive children"
        selfElapsed:
          type: integer
          description: "µs, excluding recursive children"
        selfDisk:
          type: integer
        selfQuery:
          type: integer
        selfCurrent:
          type: integer
    Link:
      type: object
      description: analyze.Link, a recursive relationship between two statements
      properties:
        statement:
          type: integer
        calls:
          type: integer
        elapsed:
          type: integer
          description: µs
    ScopeProfile:
      type: object
      description: analyze.ScopeProfile, the answer of api/profile
      properties:
        calls:
          type: integer
          description: calls in scope
        waits:
          type: integer
          description: waits in scope
        cpuUs:
          type: integer
          description: Σ c of the top-level calls in scope, µs
        events:
          type: array
          description: analyze.EventAgg per event with waits in scope (event, name, class, idle, count, us, minUs, maxUs)
          items:
            type: object
        responseUs:
          type: integer
          description: the scope's response time, Σ session spans, µs (the trace span for a single session)
        wallUs:
          type: integer
          description: wall-clock span of the scope, µs
        sessions:
          type: integer
          description: sessions with time in scope
    StmtStats:
      type: object
      description: analyze.StmtStats, one entry of doc.stats.statements
      properties:
        id:
          type: integer
          description: statement id (index into the document's statements)
        parse:
          $ref: "#/components/schemas/CallStats"
        exec:
          $ref: "#/components/schemas/CallStats"
        fetch:
          $ref: "#/components/schemas/CallStats"
        close:
          $ref: "#/components/schemas/CallStats"
        other:
          $ref: "#/components/schemas/CallStats"
        total:
          $ref: "#/components/schemas/CallStats"
        allCalls:
          $ref: "#/components/schemas/CallStats"
        elapsed:
          type: integer
          description: "response time, µs: Σ e of calls not nested in a call of the same statement"
        selfElapsed:
          type: integer
          description: "µs"
        cpu:
          type: integer
          description: "µs"
        selfCpu:
          type: integer
          description: "µs"
        waitUs:
          type: integer
          description: "in-call waits, µs"
        idleUs:
          type: integer
          description: "between-call waits, µs"
        childUs:
          type: integer
          description: "µs in recursive children"
        executions:
          type: integer
        hardParses:
          type: integer
        cursors:
          type: integer
          description: "cursors in scope"
        errors:
          type: integer
        minDepth:
          type: integer
        maxDepth:
          type: integer
        topLevel:
          type: boolean
        firstWallUs:
          type: integer
        lastWallUs:
          type: integer
        firstTim:
          type: integer
        lastTim:
          type: integer
        pxEla:
          type: integer
          description: "attached PX slaves: Σ self elapsed, µs"
        pxCpu:
          type: integer
          description: "attached PX slaves: Σ self cpu, µs"
        pxSessions:
          type: integer
          description: "distinct slave processes"
        parents:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Link"
        children:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Link"
        plans:
          type: [array, "null"]
          items:
            type: integer
        planHashes:
          type: [array, "null"]
          items:
            type: integer
    IOMap:
      type: object
      description: analyze.IOMap, the answer of api/io/map
      required: [total, sampled, cols, rows, files, events]
      properties:
        total:
          type: integer
          description: block I/O waits in scope
        sampled:
          type: boolean
          description: every k-th kept, k = ceil(total / limit)
        cols:
          type: array
          description: "the columns of rows: tim, ela, event, file, block, blocks, obj, stmt, call, line, ctx, dep"
          items:
            type: string
        rows:
          type: array
          description: one per kept wait, in trace order; tim is the wait's end (µs), ela µs, event an id of the document's events table, file p1, block p2, blocks moved, obj the obj# (-1 none), stmt and call ids (-1 none), the trace line, the session context and the depth
          items:
            type: array
            minItems: 12
            maxItems: 12
            items:
              type: integer
        files:
          type: array
          description: per file over all waits in scope (not only the kept rows), sorted by file
          items:
            $ref: "#/components/schemas/IOMapFile"
        events:
          type: array
          description: the ids of the events that occurred, sorted
          items:
            type: integer
    IOMapFile:
      type: object
      description: analyze.IOMapFile, the block range [lo, hi) of one file's block I/O waits
      required: [file, lo, hi, n]
      properties:
        file:
          type: integer
          description: the p1 of the waits (a datafile, a tempfile as db_files + its number, or a control file)
        lo:
          type: integer
          description: lowest block
        hi:
          type: integer
          description: end of the range, exclusive (the largest block + blocks)
        n:
          type: integer
          description: waits
    CutPlan:
      type: object
      description: cut.Plan, the new file of a selection
      required: [files, pieces, lines, bytes, keptFrom, keptTo, calls, waits, waitUs, statements, callers, processes, binds, bindsAllowed]
      properties:
        files:
          type: array
          description: every source file of the set, with its labelled lines
          items:
            $ref: "#/components/schemas/CutFileRuns"
        pieces:
          type: array
          description: the blocks of the new file in order
          items:
            $ref: "#/components/schemas/CutPiece"
        lines:
          type: integer
        bytes:
          type: integer
        keptFrom:
          type: integer
          description: tim extent of the kept calls (min tim-e)
        keptTo:
          type: integer
          description: max tim of the kept calls
        calls:
          type: integer
        waits:
          type: integer
        waitUs:
          type: integer
        statements:
          type: array
          items:
            $ref: "#/components/schemas/CutStmt"
        callers:
          type: [array, "null"]
          description: statement ids of the calls above the kept ones, left out (stmt)
          items:
            type: integer
        processes:
          type: integer
          description: processes with kept lines (more than one gets process switch lines)
        binds:
          type: string
          enum: [keep, mask, none]
        bindsAllowed:
          type: array
          items:
            type: string
            enum: [keep, mask, none]
    CutPiece:
      type: object
      description: cut.Piece, a block of the new file
      required: [kind, file, n, o0, o1, head]
      properties:
        kind:
          type: string
          enum: [header, kept, before, after, generated]
        title:
          type: string
        reason:
          type: string
        file:
          type: integer
        from:
          type: integer
          description: first source line (absent for a generated block)
        to:
          type: integer
        lines:
          type: array
          description: the source lines when they are not one run (borrowed session markers)
          items:
            type: integer
        runs:
          type: integer
          description: kept, runs of consecutive source lines
        n:
          type: integer
        o0:
          type: integer
          description: first line in the new file
        o1:
          type: integer
        edge:
          type: integer
          description: kept call and wait lines outside the window
        sql:
          type: string
        head:
          type: [array, "null"]
          items:
            type: string
        tail:
          type: array
          items:
            type: string
    CutRun:
      type: object
      description: cut.Run, a stretch of source lines with one label
      required: [f, t, l]
      properties:
        f:
          type: integer
        t:
          type: integer
        l:
          type: string
          enum: [K, E, H, B, A, C]
    CutFileRuns:
      type: object
      description: cut.FileRuns
      required: [idx, name, lines, runs]
      properties:
        idx:
          type: integer
        name:
          type: string
        lines:
          type: integer
        runs:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CutRun"
    CutStmt:
      type: object
      description: cut.StmtCut, one statement's part of a cut
      required: [id, calls, execs, elaUs, minDep]
      properties:
        id:
          type: integer
        calls:
          type: integer
        execs:
          type: integer
        elaUs:
          type: integer
          description: elapsed of its kept calls at its smallest depth in the cut
        minDep:
          type: integer
    CutCheck:
      type: object
      description: cut.Check
      required: [ok, calls, callsWant, waits, waitsWant, waitUs, waitUsWant, wallOk, newUnknown, unknownLines, statements, bindSets, plans, lines, bytes]
      properties:
        ok:
          type: boolean
        calls:
          type: integer
        callsWant:
          type: integer
        waits:
          type: integer
        waitsWant:
          type: integer
        waitUs:
          type: integer
        waitUsWant:
          type: integer
        wallOk:
          type: boolean
        newUnknown:
          type: integer
          description: statements that lost their SQL text
        unknownLines:
          type: integer
        statements:
          type: integer
        bindSets:
          type: integer
        plans:
          type: integer
        lines:
          type: integer
        bytes:
          type: integer
        mismatches:
          type: array
          items:
            type: string
    ErrorCode:
      type: string
      enum: [bad_request, unauthorized, not_found, conflict, cancelled, needs_prompt, internal, remote]
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
    Identity:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Health:
      type: object
      required: [version, protocol, uptime, sessions, cache]
      additionalProperties: false
      properties:
        version:
          type: string
        protocol:
          type: integer
        uptime:
          type: integer
          description: seconds
        sessions:
          type: integer
        cache:
          $ref: "#/components/schemas/CacheHealth"
    CacheHealth:
      type: object
      required: [bytes, entries, cap]
      additionalProperties: false
      properties:
        bytes:
          type: integer
        entries:
          type: integer
        cap:
          type: integer
    JobInfo:
      type: object
      required: [id, kind, state, phase, done, total, unit, message]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [open, fetch, follow, ref, live]
        state:
          type: string
          enum: [running, done, failed, cancelled]
        phase:
          type: string
          description: "open: open (cache lookup), parse (miss only), index (miss only), ready; fetch: fetch; follow, live: follow; ref: ref (obtaining the bundle), apply"
          enum: [open, parse, index, ready, fetch, follow, ref, apply]
        done:
          type: integer
        total:
          type: integer
          description: 0 = unknown
        unit:
          type: string
          description: "bytes in phases parse, fetch (ssh) and follow (live: bytes parsed at the last snapshot); lines in fetch of a db connection; files and queries in ref; empty otherwise"
          enum: [bytes, lines, files, queries, ""]
        message:
          type: string
          description: "the error of a failed job, \"cancelled\" for a cancelled one. A finished ref job: what the bundle holds, and the reference queries it skipped. A running db fetch: a note once it is past 200 MB"
        session:
          type: string
          description: the session the job opens (kind open) or applies to (kind ref)
        lines:
          type: integer
          description: parse progress
        statements:
          type: integer
          description: parse progress
        connection:
          type: string
          description: "fetch, follow, live (of a remote follow), and ref of a db connection: the connection"
        localPaths:
          type: array
          items:
            type: string
          description: "fetch: the local files, once done; follow: the local file"
    JobList:
      type: object
      required: [jobs]
      additionalProperties: false
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobInfo"
    FileInfo:
      type: object
      required: [path, name, size]
      additionalProperties: false
      properties:
        path:
          type: string
        name:
          type: string
        size:
          type: integer
    SessionState:
      type: string
      description: "opening → ready | failed; a live session: opening → live (from its first snapshot) → failed on a stream error; closed only in the event of a DELETE"
      enum: [opening, ready, live, failed, closed]
    SessionInfo:
      type: object
      required: [id, paths, state, rev, identity, cacheIdentity, hit, files, opened, bytes, lines]
      additionalProperties: false
      properties:
        id:
          type: string
        paths:
          type: array
          items:
            type: string
          description: the requested paths, absolute
        state:
          $ref: "#/components/schemas/SessionState"
        rev:
          type: integer
          description: document revision; a live session counts its snapshots (0 before the first)
        identity:
          type: string
          pattern: "^([0-9a-f]{64})?$"
          description: content identity of the trace files without options (sha256 of size and first MiB per file, order-independent); the key of annotations. Empty for a live session (a growing file has no identity)
        cacheIdentity:
          type: string
          pattern: "^([0-9a-f]{64})?$"
          description: identity of the cache entry (files plus bind mode, salt, thresholds, index format); the {identity} of /engine/cache. Empty for a live session (not cached)
        hit:
          type: boolean
          description: opened from the cache without a parse (false while opening)
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInfo"
          description: the input files (while opening) or the model's files (once ready, followed files included)
        opened:
          type: string
          format: date-time
        bytes:
          type: integer
        lines:
          type: integer
        job:
          type: string
          description: the open job
        error:
          type: string
          description: why the session failed ("cancelled" when its job was cancelled)
    SessionList:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
    SessionOptions:
      type: object
      additionalProperties: false
      properties:
        follow:
          type: boolean
          description: a live session over one growing file (see POST /engine/sessions)
        batchMs:
          type: integer
          minimum: 50
          maximum: 60000
          default: 1000
          description: "live: the batch period: a snapshot at most this often (and at least 3x the cost of the last one apart)"
        batchMB:
          type: integer
          minimum: 0
          default: 0
          description: "live: also a snapshot after this many MiB of new input (0 = off)"
        binds:
          type: string
          enum: [keep, redact, none]
          default: keep
        salt:
          type: string
          description: redaction salt (implies redact)
        thresholds:
          type: object
          description: finding thresholds (`mtkprof findings-config`); unknown keys are a 400
    OpenSessionRequest:
      type: object
      required: [paths]
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
          description: trace files or directories of them
        options:
          $ref: "#/components/schemas/SessionOptions"
    OpenSessionResponse:
      type: object
      required: [session, job]
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/SessionInfo"
        job:
          $ref: "#/components/schemas/JobInfo"
    BackendList:
      type: object
      additionalProperties: false
      required: [backends]
      properties:
        backends:
          type: array
          items:
            $ref: "#/components/schemas/BackendInfo"
    BackendInfo:
      type: object
      additionalProperties: false
      required: [kind, auth, experimental]
      properties:
        kind:
          type: string
          enum: [claude, codex, openai]
        auth:
          type: array
          items:
            type: string
            enum: [bearer, none, login]
          description: the auth modes the kind takes, its default first
        experimental:
          type: boolean
          description: the app labels the kind experimental
        command:
          type: string
          description: the CLI the kind runs (claude, codex)
        path:
          type: string
          description: where the CLI was found on the engine's PATH
        version:
          type: string
          description: the first line of its --version
        loggedIn:
          type: boolean
          description: whether the CLI's own login is there (absent when the CLI was not asked)
        login:
          type: string
          description: "how it is logged in (claude: the auth method; codex: its status line), or that it is not"
        error:
          type: string
          description: "not found (not on PATH), or what failed asking the CLI"
    ToolList:
      type: object
      additionalProperties: false
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolInfo"
    ToolInfo:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          description: JSON Schema of the tool's arguments
    BriefRequest:
      type: object
      additionalProperties: false
      properties:
        case:
          type: string
          maxLength: 200000
          description: the DBA's description of the problem, printed once, quoted
        notes:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/Note"
        options:
          $ref: "#/components/schemas/BriefOptions"
        scope:
          $ref: "#/components/schemas/BriefScope"
    BriefOptions:
      type: object
      additionalProperties: false
      properties:
        maxStatements:
          type: integer
          minimum: 0
          maximum: 50
          default: 10
          description: statements listed at most (0 = the default)
        maxSqlChars:
          type: integer
          minimum: 0
          maximum: 20000
          default: 2000
          description: characters of one statement's SQL (0 = the default, else at least 100)
        maxPlanLines:
          type: integer
          minimum: -1
          maximum: 200
          default: 40
          description: lines of one plan (0 = the default, -1 = no plans)
        binds:
          type: string
          enum: [mask, keep, none]
          default: mask
        salt:
          type: string
          description: salt of the masked bind hashes; default random per brief
    BriefScope:
      type: object
      additionalProperties: false
      properties:
        from:
          type: integer
          minimum: 0
          description: window start, tim in µs (0 = from the start)
        to:
          type: integer
          minimum: 0
          description: window end, tim in µs (0 = to the end)
        contexts:
          type: array
          items:
            type: integer
            minimum: 0
          description: session context ids (empty = all)
    Note:
      type: object
      additionalProperties: false
      description: |
        A note on a trace, in the shape of the desktop's annotation. `statement`
        needs `stmt`; `execution` needs `stmt`, `execNo` and `cursorLine`;
        `window` needs `from` and `to`; `line` is a bookmark (`file`, `line`,
        `label`). `id`, `created` and `updated` are accepted and not used.
      required: [kind]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [statement, execution, window, line]
        note:
          type: string
          maxLength: 20000
        created:
          type: integer
          description: ms since the epoch
        updated:
          type: integer
          description: ms since the epoch
        stmt:
          $ref: "#/components/schemas/NoteStmt"
        execNo:
          type: integer
          description: execution; the execution number counts per cursor
        cursorLine:
          type: integer
          description: execution; the trace line of its cursor
        from:
          type: integer
          description: window; tim in µs
        to:
          type: integer
          description: window; tim in µs
        label:
          type: string
        file:
          type: integer
          description: line; the input file
        line:
          type: integer
          description: line; the line in that file
    NoteStmt:
      type: object
      additionalProperties: false
      description: a statement by what survives a re-parse
      properties:
        sqlId:
          type: string
        hash:
          type: string
          description: FNV-1a 32 of "<statement kind>\n<text>" over UTF-16 code units, 8 hex digits
    Provider:
      type: object
      additionalProperties: false
      required: [id, kind]
      description: Where a conversation's model runs. Never a secret; a key comes through a prompt of kind apikey.
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
          description: the desktop's provider id; the connection of its apikey prompt, the {id} of its key route
        kind:
          type: string
          enum: [openai, claude, codex]
        name:
          type: string
          maxLength: 200
          description: shown in the key prompt
        baseUrl:
          type: string
          description: "openai (required): http or https, up to the version (http://localhost:11434/v1); /chat/completions is appended"
        model:
          type: string
          maxLength: 200
          description: "openai: required; claude, codex: optional (the CLI's default), a name of letters, digits and . _ : / @ [ ] -"
        headers:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
          description: openai only, extra request headers, none a credential
        auth:
          type: string
          enum: [bearer, none, login]
          description: "the kind's default when absent (openai bearer, claude and codex login). bearer: a key from the apikey prompt (openai: in Authorization; codex: as CODEX_API_KEY); none: no key; login: the CLI's own login"
    ConversationRequest:
      type: object
      additionalProperties: false
      required: [session, provider, consent]
      properties:
        session:
          type: string
          description: a ready session
        provider:
          $ref: "#/components/schemas/Provider"
        consent:
          type: boolean
          description: the DBA agreed to send what this trace shows to this provider; must be true
        case:
          type: string
          maxLength: 200000
          description: the DBA's description of the problem, in the system message
        notes:
          type: array
          maxItems: 2000
          description: the desktop's annotations of the trace; absent = not supplied
          items:
            $ref: "#/components/schemas/Note"
        view:
          $ref: "#/components/schemas/View"
        scope:
          $ref: "#/components/schemas/BriefScope"
        binds:
          type: string
          enum: [mask, keep]
          default: mask
    MessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100000
        view:
          $ref: "#/components/schemas/View"
        notes:
          type: array
          maxItems: 2000
          description: the notes now; absent = unchanged
          items:
            $ref: "#/components/schemas/Note"
    View:
      type: object
      additionalProperties: false
      description: What the app shows, in the terms of the UI's URL state (absolute tim for the window).
      properties:
        view:
          type: string
        sql_id:
          type: string
          description: the selected statement, sql_id or @N
        event:
          type: string
          description: the selected wait event
        from:
          type: integer
          description: the window, tim in µs (both 0 = none)
        to:
          type: integer
        files:
          type: array
          items:
            type: integer
          description: the files shown (empty = all)
        file:
          type: integer
          description: the Lines view's file
        line:
          type: integer
          description: the Lines view's line
        contexts:
          type: array
          items:
            type: integer
          description: the session contexts selected
    ConversationState:
      type: string
      enum: [idle, running, waiting_key, cancelled, failed]
      description: "idle -> running -> idle | cancelled | failed, with running <-> waiting_key while the key prompt is open; cancelled and failed take the next message"
    ConversationInfo:
      type: object
      additionalProperties: false
      required: [id, session, state, provider, scope, binds, turns, messages, usage, created]
      properties:
        id:
          type: string
        session:
          type: string
        state:
          $ref: "#/components/schemas/ConversationState"
        provider:
          $ref: "#/components/schemas/Provider"
        scope:
          $ref: "#/components/schemas/BriefScope"
        binds:
          type: string
          enum: [mask, keep]
        turns:
          type: integer
        messages:
          type: integer
          description: messages in the history (the DBA's, the model's, the tool results)
        usage:
          $ref: "#/components/schemas/Usage"
        created:
          type: string
          format: date-time
        error:
          type: string
          description: "how the last turn failed: code: message"
    Usage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, cachedInputTokens, requests]
      properties:
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        cachedInputTokens:
          type: integer
        requests:
          type: integer
          description: model requests
    Intent:
      type: object
      additionalProperties: false
      required: [view]
      description: |
        A place in the app the show tool asks for, checked against the trace.
        The ids are the URL state's: `sql_id` (or @N), an execution by
        `cursorLine` and `execNo`, a window in tim µs (clipped to the trace).
      properties:
        view:
          type: string
          enum: [overview, statements, waits, timeline, sessions, pivot, lines]
        sql_id:
          type: string
        execNo:
          type: integer
          description: with cursorLine, one execution of the statement
        cursorLine:
          type: integer
          description: the trace line of the execution's cursor
        event:
          type: string
          description: a wait event name
        from:
          type: integer
          description: the window, tim in µs
        to:
          type: integer
        contexts:
          type: array
          items:
            type: integer
        file:
          type: integer
          description: view lines, the input file
        line:
          type: integer
          description: view lines, the trace line
        pivot:
          $ref: "#/components/schemas/PivotIntent"
    PivotIntent:
      type: object
      additionalProperties: false
      required: [fact, by]
      properties:
        fact:
          type: string
          enum: [calls, waits]
        by:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
          description: dimension ids
        sort:
          type: string
          description: the measure id the rows are sorted by
        sql_id:
          type: string
        event:
          type: string
    TurnEvent:
      description: one line of a turn's stream
      oneOf:
        - $ref: "#/components/schemas/TextEvent"
        - $ref: "#/components/schemas/ToolCallEvent"
        - $ref: "#/components/schemas/ToolResultEvent"
        - $ref: "#/components/schemas/IntentEvent"
        - $ref: "#/components/schemas/UsageEvent"
        - $ref: "#/components/schemas/StateEvent"
        - $ref: "#/components/schemas/DoneEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextEvent"
          tool_call: "#/components/schemas/ToolCallEvent"
          tool_result: "#/components/schemas/ToolResultEvent"
          intent: "#/components/schemas/IntentEvent"
          usage: "#/components/schemas/UsageEvent"
          state: "#/components/schemas/StateEvent"
          done: "#/components/schemas/DoneEvent"
          error: "#/components/schemas/ErrorEvent"
    TextEvent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
    ToolCallEvent:
      type: object
      additionalProperties: false
      required: [type, id, name, args]
      properties:
        type:
          type: string
          const: tool_call
        id:
          type: string
          description: the model's call id (mcp_N for a CLI agent's call)
        name:
          type: string
        args:
          description: the arguments, a JSON object; a string with what the model sent when that is not JSON
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
    ToolResultEvent:
      type: object
      additionalProperties: false
      required: [type, id, name, isError, content, estTokens]
      properties:
        type:
          type: string
          const: tool_result
        id:
          type: string
        name:
          type: string
        isError:
          type: boolean
        content:
          type: string
          description: "exactly the text the model is given: the tool's JSON, or error: and the reason for a failed call"
        estTokens:
          type: integer
    IntentEvent:
      type: object
      additionalProperties: false
      required: [type, id, target, href]
      properties:
        type:
          type: string
          const: intent
        id:
          type: string
          description: the show call's id
        target:
          $ref: "#/components/schemas/Intent"
        href:
          type: string
          description: "the target as an mtkprof: link, mtkprof:#view=...&sql=...&ev=...&win=<from>-<to>&exec=<cursorLine>:<execNo>&contexts=<id,...>&file=...&line=... (win in µs from the trace's first tim)"
    UsageEvent:
      type: object
      additionalProperties: false
      required: [type, inputTokens, outputTokens]
      properties:
        type:
          type: string
          const: usage
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        cachedInputTokens:
          type: integer
    StateEvent:
      type: object
      additionalProperties: false
      required: [type, state]
      properties:
        type:
          type: string
          const: state
        state:
          type: string
          enum: [waiting_key, running]
        provider:
          type: string
          description: "waiting_key: the provider id, the connection of the apikey prompt"
    DoneEvent:
      type: object
      additionalProperties: false
      required: [type, usage, total]
      properties:
        type:
          type: string
          const: done
        usage:
          $ref: "#/components/schemas/Usage"
        total:
          $ref: "#/components/schemas/Usage"
    ErrorEvent:
      type: object
      additionalProperties: false
      required: [type, code, message]
      properties:
        type:
          type: string
          const: error
        code:
          $ref: "#/components/schemas/TurnErrorCode"
        message:
          type: string
    TurnErrorCode:
      type: string
      enum: [cancelled, session_closed, no_key, auth, provider, too_many_steps, internal]
    SessionEvent:
      type: object
      required: [id, state, rev]
      additionalProperties: false
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/SessionState"
        rev:
          type: integer
    PromptEvent:
      type: object
      required: [id, connection, kind, text, echo, state]
      additionalProperties: false
      properties:
        id:
          type: string
        connection:
          type: string
          description: the connection asking; for kind apikey, the assistant provider id
        kind:
          type: string
          enum: [password, passphrase, otp, hostkey, confirm, apikey]
          description: "apikey: the API key of an assistant provider (a conversation's turn waits for it)"
        text:
          type: string
        echo:
          type: boolean
        state:
          type: string
          enum: [open, closed]
        fingerprint:
          type: string
          description: "hostkey: the SHA256 fingerprint of the unknown host key (answer yes to accept; it is then added to ~/.ssh/known_hosts)"
        endpoint:
          type: string
          description: "apikey: where the key is sent, the provider's kind and base URL (`openai https://api.example.com/v1`, `codex`). A key remembered for the provider id answers only for the same endpoint."
    PromptAnswer:
      type: object
      description: "{answer} or {cancel: true}"
      properties:
        answer:
          type: string
        cancel:
          type: boolean
    LogEvent:
      type: object
      required: [level, message]
      additionalProperties: false
      properties:
        level:
          type: string
          enum: [info, error]
        message:
          type: string
    CacheItem:
      type: object
      required: [identity, bytes, created, lastUsed, paths, open]
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
        bytes:
          type: integer
        created:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
        paths:
          type: array
          items:
            type: string
          description: absolute source paths at build time
        open:
          type: boolean
          description: a session of this engine has it open
    CacheList:
      type: object
      required: [bytes, entries, cap, items]
      additionalProperties: false
      properties:
        bytes:
          type: integer
        entries:
          type: integer
        cap:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CacheItem"
    CacheWipe:
      type: object
      required: [removed, skipped, bytes]
      additionalProperties: false
      properties:
        removed:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
          description: entries kept because a session has them open
        bytes:
          type: integer
          description: bytes freed
    AskpassRequest:
      type: object
      required: [text]
      properties:
        connection:
          type: string
          description: MTKPROF_PROMPT_CONN (empty or unknown = no caching)
        kind:
          type: string
          enum: [password, passphrase, otp, hostkey, confirm]
          description: the helper's classification (absent = classified by the engine)
        text:
          type: string
          description: the prompt as ssh printed it
        fingerprint:
          type: string
        spawn:
          type: string
          description: id of the ssh run (MTKPROF_PROMPT_SPAWN)
    ConnectionDef:
      type: object
      required: [id, kind, host]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        kind:
          type: string
          enum: [ssh, db]
        host:
          type: string
          description: "ssh: a host name or ~/.ssh/config alias"
        port:
          type: integer
          description: 0 = ~/.ssh/config or 22
        user:
          type: string
          description: empty = ~/.ssh/config or the local user
        service:
          type: string
          description: db service name (required for db)
        adrHome:
          type: string
          description: db ADR home, the default of a fetch that names none (else V$DIAG_INFO's)
        tcps:
          type: boolean
          description: db only. Connect with TCPS (TLS); the port is then usually 2484
        tlsSkipVerify:
          type: boolean
          description: db only, needs tcps. Do not verify the server certificate (encrypts, does not authenticate)
        transport:
          type: string
          enum: [auto, cli, lib]
          default: auto
          description: "ssh only. cli: the system ssh/sftp with the askpass bridge; lib: the Go SSH library; auto: cli when ssh is on PATH, lib otherwise or once ssh ignored SSH_ASKPASS"
    ConnectionInfo:
      type: object
      required: [id, kind, host, port, user, transport, active]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [ssh, db]
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        service:
          type: string
        adrHome:
          type: string
        tcps:
          type: boolean
        tlsSkipVerify:
          type: boolean
        transport:
          type: string
          enum: [auto, cli, lib, ""]
        active:
          type: string
          enum: [cli, lib, ""]
          description: the SSH transport in use ("" before the first operation)
    ConnectionTest:
      type: object
      required: [server, transport]
      additionalProperties: false
      properties:
        server:
          type: string
          description: "ssh: the host's `uname -sr` (lib adds the SSH server version); db: the server version (V$INSTANCE.VERSION_FULL, else the V$VERSION banner)"
        transport:
          type: string
          enum: [cli, lib, tcp, tcps]
        diag:
          $ref: "#/components/schemas/DBDiag"
    SSHFetchRequest:
      type: object
      required: [paths]
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        gzip:
          type: boolean
          default: true
    DBFetchRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        adrHome:
          type: string
          description: "the file's ADR home (DBTraceFile.adrHome); default the connection's adrHome, else V$DIAG_INFO's"
        name:
          type: string
          description: "TRACE_FILENAME, a file name (no path)"
    DBDiag:
      type: object
      description: V$DIAG_INFO of a db connection
      required: [adrHome, traceDir]
      additionalProperties: false
      properties:
        adrHome:
          type: string
          description: "ADR Home: the adrHome of a fetch"
        traceDir:
          type: string
          description: "Diag Trace: the trace directory on the database host"
    DBTraceFile:
      type: object
      description: a trace file of the ADR home (V$DIAG_TRACE_FILE, with the session writing it)
      required: [adrHome, name]
      properties:
        adrHome:
          type: string
        name:
          type: string
          description: TRACE_FILENAME, the name of a fetch
        path:
          type: string
          description: full path on the host, when a live process writes the file (V$PROCESS.TRACEFILE)
        modified:
          type: string
          format: date-time
        conId:
          type: integer
        sid:
          type: integer
        serial:
          type: integer
        username:
          type: string
        fromProcess:
          type: boolean
          description: V$DIAG_TRACE_FILE was not readable (ORA-00942); the row is the file a live session would write
    DBSession:
      type: object
      description: a user session (V$SESSION type USER) with its server process' trace file
      required: [sid, serial, username, status, sqlTrace, traceFile, self]
      properties:
        sid:
          type: integer
        serial:
          type: integer
        username:
          type: string
        osuser:
          type: string
        machine:
          type: string
        program:
          type: string
        module:
          type: string
        action:
          type: string
        status:
          type: string
        sqlId:
          type: string
        logonTime:
          type: string
          format: date-time
        sqlTrace:
          type: string
          description: V$SESSION.SQL_TRACE, ENABLED or DISABLED
        traceFile:
          type: string
          description: V$PROCESS.TRACEFILE of the server process
        self:
          type: boolean
          description: the session the connection itself runs on
    RemoteEntry:
      type: object
      required: [name, path, size, mode, modTime, dir, link]
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        mode:
          type: string
          description: as ls -l prints it (-rw-r-----)
        modTime:
          type: string
          format: date-time
          description: minute precision (cli, from sftp ls -l; day precision past 6 months)
        dir:
          type: boolean
        link:
          type: boolean
    RemoteListing:
      type: object
      required: [path, entries]
      additionalProperties: false
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RemoteEntry"
    Document:
      type: object
      description: report.Document (format 3); see web/src/lib/data/types.ts
      properties:
        tool:
          type: string
        version:
          type: string
        generated:
          type: string
          format: date-time
        format:
          type: integer
        file:
          type: object
        span:
          type: object
        statements:
          type: array
          items:
            type: object
        cursors:
