          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1000
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
