openapi: 3.1.0
# The contract of `mtkprof engine` (docs/PLAN-DESKTOP.md § 2). Formatting
# rule: 2-space indentation, one path per line at indent 2 under `paths:`,
# its methods at indent 4. internal/engine/contract_test.go reads the paths
# with a line scanner and compares them with Server.Routes(); keep both in
# step (a route missing on either side fails the test).
info:
  title: mtkprof engine
  version: "1"
  description: |
    Control plane and per-session API of `mtkprof engine`, the desktop app's
    sidecar. `info.version` and `x-mtkprof-protocol` are the protocol
    integer (`engine.Protocol`); it increments on any breaking change and
    the shell refuses an engine whose protocol it does not know.

    Process: `mtkprof engine [-listen 127.0.0.1:0] [-cache DIR] [-cache-cap 20G]
    [-allow-origin O,...] [-idle-exit D] [-idle D] [-detach]`, token in the environment
    (`MTKPROF_TOKEN`, 32+ bytes). Once listening it prints one line on stdout:
    `{"ready":true,"addr":"127.0.0.1:41233","version":"...","protocol":1}`.
    It exits when stdin closes (unless -detach), on SIGINT/SIGTERM, or after
    -idle-exit without sessions and requests. With `-idle D` a ready session
    that has had no request on its `/s/{id}/` mount (a pending `api/doc`
    long poll counts) and no running job for D is closed as by `DELETE` (a
    `session` event with state `closed`; the cache entry stays); opening and
    live sessions are never closed. Default: never.

    Every request but `GET /engine/health` needs `Authorization: Bearer <token>`;
    that includes the event stream, so a browser client reads it with
    `fetch` (a streaming body), not `EventSource`, which cannot send headers.
    CORS is answered for the `-allow-origin` origins only.

    Control-plane errors use the envelope `{"error": {"code", "message"}}`
    (`ErrorEnvelope`) with the status of the code: bad_request 400,
    unauthorized 401, not_found 404, conflict and cancelled 409,
    needs_prompt 428, internal 500, remote 502 (a remote host or the
    connection to it failed). The slice endpoints under
    `/s/{id}/api/` answer a bad parameter with a plain-text 400 (they are
    the handlers of `mtkprof serve`); a missing session or a session that is
    not ready is the envelope (404, 409).
  license:
    name: Apache-2.0
x-mtkprof-protocol: 1
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
        description: the port of the ready line
security:
  - bearer: []
paths:
  /engine/health:
    get:
      operationId: health
      summary: Engine version, protocol, uptime, sessions and cache size (no token needed)
      security: []
      responses:
        "200":
          description: health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /engine/events:
    get:
      operationId: events
      summary: Server-sent events (job, session, prompt, log)
      description: |
        `text/event-stream`. The stream opens with the comment
        `: mtkprof engine`, then replays every prompt that is still open, then
        sends events as they happen; a `: keepalive` comment every 15 s.
        Each event is `event: <type>` and one `data:` line of JSON:

        - `job`: `JobInfo`, on every change of a job (state, phase, progress
          at most every 64 MB of parse).
        - `session`: `SessionEvent` (`{id, state, rev}`), on open, ready,
          failed and closed.
        - `prompt`: `PromptEvent`, `state: open` when a credential is needed
          and `state: closed` once it is answered, cancelled or abandoned.
        - `log`: `LogEvent` (`{level, message}`).

        A subscriber that falls behind by 256 events is disconnected; it
        reconnects and re-reads `GET /engine/sessions` and `/engine/jobs`.
      responses:
        "200":
          description: the event stream
          content:
            text/event-stream:
              schema:
                type: string
              x-mtkprof-events:
                job:
                  $ref: "#/components/schemas/JobInfo"
                session:
                  $ref: "#/components/schemas/SessionEvent"
                prompt:
                  $ref: "#/components/schemas/PromptEvent"
                log:
                  $ref: "#/components/schemas/LogEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/prompts/{id}:
    post:
      operationId: answerPrompt
      summary: Answer or cancel an open prompt
      parameters:
        - $ref: "#/components/parameters/PromptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptAnswer"
      responses:
        "204":
          description: answered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/compare:
    get:
      operationId: compareSessions
      summary: Compare two ready non-live sessions (whole traces, B against A)
      description: Detached aggregate comparison snapshot. Source filters are ignored. No Lines or report endpoints are created.
      parameters:
        - { name: a, in: query, required: true, schema: { type: string } }
        - { name: b, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Existing format-2 CompareDocument with aggregate documents and SQL, wait and plan deltas
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /engine/sessions:
    get:
      operationId: listSessions
      summary: The sessions, oldest first
      responses:
        "200":
          description: sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: openSession
      summary: Open a trace set (one file, several, or directories of them)
      description: |
        Answers at once with the new session (`opening`) and its `open` job.
        The job's phases are `open` (cache lookup), on a miss `parse`
        (unit bytes, with lines and statements) and `index` (writing the cache
        entry), then `ready`. A hit goes from `open` straight to `ready`. The
        session becomes `ready` or `failed`.

        With `options.follow` (one file) the session is a live session over
        a growing file (not cached; spilled to a temporary directory under
        `<cache>/live/`): its job (kind `live`, phase `follow`, unit bytes,
        `done` = bytes parsed) runs until the session is deleted. The file is
        parsed as it grows (a line counts once its newline is written); at
        every settled batch (`batchMs`, default 1000, at least 3x the cost of
        the last snapshot; or after `batchMB` of new input) the session
        serves a new snapshot: `rev` increments, a session event
        `{state: live, rev}` goes out, and every route under `/s/{id}/`
        answers what a normal open of the input so far would. The first
        snapshot is taken as soon as the reader has caught up with the file
        (state `opening` until then). A stream error (the file shrank, the
        mirror of a remote follow ended) makes it `failed` with the error;
        the last snapshot is still served until DELETE. A file that ends with
        `*** TRACE CONTINUES IN FILE x ***` is followed into x once x exists
        (the path in the marker, the same name next to the file, or a
        `*.trc` there whose header names it), as a normal open follows a
        chain: `files` lists both, `bytes`/`lines` count all, a `log` event
        and a session event tell of the switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
      responses:
        "202":
          description: opening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeSession
      summary: Close a session (cancels its open job); the cache entry stays
      description: |
        A live session stops following (its job ends cancelled; a remote
        follow's mirror job is cancelled) and its spill directory is removed.
        The engine does the same for a ready session idle for `-idle`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/jobs:
    get:
      operationId: listJobs
      summary: Running jobs and the last 100 finished ones, oldest first
      responses:
        "200":
          description: jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/jobs/{id}:
    delete:
      operationId: cancelJob
      summary: Cancel a running job; a job event says when it has stopped
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: cancelling
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/cache:
    get:
      operationId: listCache
      summary: The entries of the index cache, most recently used first
      responses:
        "200":
          description: the cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: wipeCache
      summary: Remove every entry no session has open
      responses:
        "200":
          description: what was removed and what was kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheWipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/cache/{identity}:
    delete:
      operationId: deleteCacheEntry
      summary: Remove one entry (409 while a session has it open)
      parameters:
        - name: identity
          in: path
          required: true
          description: a session's cacheIdentity
          schema:
            $ref: "#/components/schemas/Identity"
      responses:
        "204":
          description: removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/askpass:
    post:
      operationId: askpass
      summary: A prompt of ssh, posted by the `mtkprof askpass` helper; answered once the user has
      description: |
        The engine spawns the system ssh/sftp with `SSH_ASKPASS` set to the
        mtkprof binary and `MTKPROF_ENGINE`, `MTKPROF_TOKEN`,
        `MTKPROF_PROMPT_CONN` in its environment. ssh runs the helper with
        its prompt text; the helper classifies it and posts it here. The
        engine raises a `prompt` event and holds the request until
        `POST /engine/prompts/{id}`, then answers `{answer}` (hostkey and
        confirm: the helper prints yes or no). Password and passphrase
        answers are kept in memory per connection until it is deleted; a
        cached answer is offered once per ssh run (`spawn`), so a wrong one
        is asked again. A cancelled prompt is 409 `cancelled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskpassRequest"
      responses:
        "200":
          description: the answer
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections:
    get:
      operationId: listConnections
      summary: The registered connections, by id
      responses:
        "200":
          description: connections
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: putConnection
      summary: Register (or replace) a connection definition; no secrets
      description: |
        Replacing a definition closes the old connection and drops its
        credentials (409 while a fetch or follow of it runs). A `db`
        connection is stored, but its operations answer 400 "not
        implemented yet" until internal/remote/db is wired (E8); follow is
        ssh only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionDef"
      responses:
        "200":
          description: registered
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    $ref: "#/components/schemas/ConnectionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Cancel the connection's jobs, close it and forget its credentials
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "204":
          description: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Connect (prompting as needed) and report the host
      description: |
        db connections: opens the connection's database session (asking for the
        password through a prompt unless it is cached), reports the server
        version and `diag` (V$DIAG_INFO). The session stays open until the
        connection is deleted.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/ls:
    get:
      operationId: lsConnection
      summary: List a remote directory (or one file)
      description: |
        ssh connections only (db: 400). ssh: `sftp -b -` running `ls -ln path` (cli) or SFTP ReadDir (lib).
        Hidden files are not listed; symbolic links are not followed.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: path
          in: query
          required: true
          description: remote directory or file (absolute, or relative to the login directory)
          schema:
            type: string
      responses:
        "200":
          description: the listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/diag:
    get:
      operationId: diagConnection
      summary: Candidate trace directories on the host
      description: |
        db connections: the `Diag Trace` of V$DIAG_INFO (one directory) and
        the `adrHome`.

        ssh: `$ORACLE_BASE/diag/rdbms/*/*/trace`, the same under the ORACLE_BASE of
        every home in /etc/oratab (/var/opt/oracle/oratab), then
        `/u01/app/oracle/diag/rdbms/*/*/trace`; existing directories only,
        without duplicates.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: directories
          content:
            application/json:
              schema:
                type: object
                required: [dirs]
                properties:
                  dirs:
                    type: array
                    items:
                      type: string
                  adrHome:
                    type: string
                    description: db connections only
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/fetch:
    post:
      operationId: fetchConnection
      summary: Copy remote files into the cache (job kind fetch)
      description: |
        db connections: body `{adrHome, name}` (see `DBFetchRequest`); the trace
        is read out of `V$DIAG_TRACE_FILE_CONTENTS`, 50 000 lines per query, on
        a database session of the job's own, into
        `<cache>/remote/<connection>/<name>`. The job counts `lines` (total
        unknown); a partial local file is continued after its last complete
        line (the file is cut there, so cancel and refetch resume). Past 200 MB
        the job's `message` says SSH is faster. `localPaths` has the one file.

        ssh connections: files go to `<cache>/remote/<connection>/<basename>` (base names must
        differ). A local file shorter than the remote one is resumed at its
        size; a longer one is fetched again from the start. ssh/cli streams
        `tail -c +N -- path`, through `gzip -1 -c` when the host has gzip
        and `gzip` is not false; lib reads over SFTP. Progress: bytes over
        all files (`total` from the remote sizes, raised if a file grows).
        The finished job carries `localPaths`; open them with
        `POST /engine/sessions`. Cancel with `DELETE /engine/jobs/{id}`;
        the partial files stay for the next fetch to resume.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SSHFetchRequest"
                - $ref: "#/components/schemas/DBFetchRequest"
      responses:
        "202":
          description: the job and where the files will be
          content:
            application/json:
              schema:
                type: object
                required: [job, localPaths]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
                  localPaths:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}/follow:
    post:
      operationId: followConnection
      summary: Follow a growing remote file in a live session (mirror job kind follow)
      description: |
        The job (kind follow) copies the file to
        `<cache>/remote/<connection>/<basename>` (resuming at the local size)
        and keeps appending what the host writes (ssh/cli: `tail -c +N -f --
        path`, stopped on the host when the stream ends; lib: SFTP size poll
        every 500 ms), reconnecting after a drop (5 failures in a row end
        it). `done` is the local size, `total` 0. The session is a live
        session over the local mirror (as `POST /engine/sessions` with
        `options.follow`; `options` as there, `follow` ignored): DELETE of
        the session cancels the job; the end of the job (cancelled with
        `DELETE /engine/jobs/{id}`, or failed) fails the session after the
        mirrored bytes are parsed, its last snapshot still served. Latency
        from a write on the host to a snapshot: the transport's delay (lib:
        up to 500 ms) + up to `batchMs` + 100 ms + the snapshot (< 2 s with
        the defaults). `mirrorOnly: true`: the mirror job alone, no
        session (answer without `session`). When the file continues in
        another (`TRACE CONTINUES IN FILE x`), the session starts a second
        follow job on the same connection for the file of that name in the
        same remote directory (it polls every 500 ms until the host has it),
        cancels the first one once the second has opened its local file,
        and parses on into it; DELETE of the session cancels the current
        one.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path:
                  type: string
                options:
                  $ref: "#/components/schemas/SessionOptions"
                mirrorOnly:
                  type: boolean
      responses:
        "202":
          description: the live session (unless mirrorOnly), the mirror job and the local file
          content:
            application/json:
              schema:
                type: object
                required: [job, localPath]
                properties:
                  session:
                    $ref: "#/components/schemas/SessionInfo"
                  job:
                    $ref: "#/components/schemas/JobInfo"
                  localPath:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}/tracefiles:
    get:
      operationId: tracefilesConnection
      summary: Trace files of the ADR home (db connections)
      description: |
        V$DIAG_TRACE_FILE (12.2+) joined to V$PROCESS and V$SESSION for the
        session writing each file, newest first. Without access to the view
        (ORA-00942) the live sessions' V$PROCESS.TRACEFILE are listed instead
        (`fromProcess`; `since` does not apply). Needs the grants of
        docs/REMOTE.md.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: sid
          in: query
          description: only the file of this session's server process
          schema:
            type: integer
        - name: serial
          in: query
          schema:
            type: integer
        - name: since
          in: query
          description: "only files modified within a duration (2h, 30m, 1d) or since an RFC 3339 time"
          schema:
            type: string
      responses:
        "200":
          description: the files
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/DBTraceFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/sessions:
    get:
      operationId: sessionsConnection
      summary: The user sessions of the database (db connections)
      description: V$SESSION of type USER, newest logon first; `self` marks the connection's own session.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: the sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/DBSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/trace:
    post:
      operationId: traceConnection
      summary: Switch SQL trace of a session on or off (db connections)
      description: |
        `DBMS_MONITOR.SESSION_TRACE_ENABLE` / `SESSION_TRACE_DISABLE` for the
        session sid,serial (needs EXECUTE on DBMS_MONITOR), or with `self`
        `DBMS_SESSION` for the connection's own session (waits, binds,
        plan_stat ALL_EXECUTIONS). Enabling answers with the trace file the
        session writes when it can tell.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enable]
              additionalProperties: false
              properties:
                sid:
                  type: integer
                serial:
                  type: integer
                enable:
                  type: boolean
                waits:
                  type: boolean
                  default: true
                binds:
                  type: boolean
                  default: true
                planStat:
                  type: string
                  enum: [never, first_execution, all_executions]
                  default: all_executions
                self:
                  type: boolean
                  description: the connection's own session; no sid or serial
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
                  traceFile:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /s/{id}/api/doc:
    get:
      operationId: sessionDoc
      summary: The session's document (format 3, slice true, packed, no fact tables)
      description: |
        The document `mtkprof serve -spill` serves at `/api/doc`. `stats.minimap`
        holds 1024 buckets of CPU and wait time per wait class over the whole
        span. `rev` is accepted. The session's `rev` (SessionInfo, session
        events) is 1 when it opens and rises by one whenever a reference
        bundle is applied (`POST /s/{id}/api/ref`); fetch the document again
        after a session event with a new `rev`. A live session answers its
        latest snapshot, the revision in the `X-Rev` header and the session's
        state in `X-Live` (`live` while it follows; `failed` or `closed` once
        the follow has stopped, no newer revision will come); with `rev=N`
        and no revision newer than N yet, the answer waits up to 25 s for the
        next snapshot (or the end of the follow) and is the document it has
        then, 200 either way (a long poll: compare `X-Rev`; the same `X-Rev`
        after the wait, never 304). A `rev` that is not a number is a 400 on
        a live session.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: rev
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: the document
          headers:
            X-Rev:
              description: the revision of the document (live sessions)
              schema:
                type: integer
            X-Live:
              description: "the state of a live session: live while it follows, failed or closed once it has stopped (live sessions)"
              schema:
                type: string
                enum: [live, failed, closed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/ref:
    post:
      operationId: sessionRef
      summary: Apply a reference bundle to the session (job kind ref)
      description: |
        Names for obj#, file# and user ids and DBMS_XPLAN plans
        (docs/REF-BUNDLE.md). `{dir}`: the files of a bundle directory
        (objects.csv, datafiles.csv, users.csv, plans/*.txt) are copied to the
        engine. `{connection}`: the reference queries of the session's trace
        are run on that db connection (own database session; `lite` = ALL_
        views only, no datafiles); queries that fail are skipped and named in
        the finished job's `message`. The bundle is kept at
        `<cache>/ref/<SessionInfo.identity>/` and applied to the model, the
        document is rebuilt and `rev` rises by one (a session event); the
        job ends `done` with the bundle's size in `message`. Opening the same
        trace again applies the kept bundle before the first document.
        Applying another bundle replaces the first. One ref job per session
        at a time (409). `DELETE /engine/cache` drops the kept bundles of the
        traces no session has open.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dir:
                  type: string
                  description: a bundle directory on the engine's machine
                connection:
                  type: string
                  description: id of a db connection
                lite:
                  type: boolean
                  description: with connection only
      responses:
        "202":
          description: the job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines:
    get:
      operationId: sessionLines
      summary: Raw lines of one input file (optionally annotated with the line kinds)
      description: |
        Up to `n` lines (at most 2000) of input file `file`, starting at line
        `from`. Plain: `text/plain` with the file's line count in
        `X-Total-Lines`. With `annot=1`: JSON `{from, total, lines: [{t, k}]}`,
        each line without its terminator and its kind `k` (`trace.Classify`,
        see `LineKind`). A page that starts in the middle of a statement is
        classified from the 64 lines before it; a statement longer than both
        that and the page has wrong kinds until its `END OF STMT` (bind value
        continuation lines and PARSE ERROR text come out as `unknown`).

        With `annot=2` each line also carries the ids `api/at` answers for it:
        the call `c`, the statement `s`, the cursor `u`, the execution number
        `x` and the wait `w`, assigned by the same rules as `api/at` (cursor
        text lines get the cursor above them, STAT lines the cursor of their
        plan, a WAIT line its wait and the call it is attributed to, BINDS
        lines the call that follows, any other line the last call at or before
        it). An id that does not apply is -1; the five keys are all omitted
        when none applies (framing lines). Computed in one pass over the page.
        (`ctx`, `bindSet` and `planLine` of `api/at` are not part of it.) A
        server without the model (no `/api/at`) answers `annot=2` like
        `annot=1`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: file
          in: query
          description: index of the input file (document file.files order)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: from
          in: query
          description: 1-based first line
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: n
          in: query
          description: number of lines (missing or above 2000 = 2000)
          schema:
            type: integer
            maximum: 2000
            default: 2000
        - name: annot
          in: query
          description: "1: the JSON form with a kind per line; 2: also the ids per line (c, s, u, x, w)"
          schema:
            type: string
            enum: ["0", "1", "2"]
            default: "0"
      responses:
        "200":
          description: the lines
          headers:
            X-Total-Lines:
              description: the line count of the file (plain form)
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/LinesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/at:
    get:
      operationId: sessionLinesAt
      summary: The first line whose call or wait has tim >= the given one
      description: |
        Binary search over the call rows of the file, then over its waits;
        the smaller line wins (a call's WAIT lines come before its own line).
        A `tim` past the last record gives the line of the last call or wait.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: tim
          in: query
          required: true
          description: trace clock value in µs
          schema:
            type: integer
      responses:
        "200":
          description: "{line}: 1-based line number"
          content:
            application/json:
              schema:
                type: object
                properties:
                  line:
                    type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or a file without call and wait rows (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/next:
    get:
      operationId: sessionLinesNext
      summary: The next or previous structural line of a file
      description: |
        The first line strictly after (`dir=1`) or strictly before (`dir=-1`)
        `from` that holds the wanted element: `call` (a call row, XCTEND
        included), `wait`, `cursor` (a PARSING IN CURSOR block; implicit cursors
        have none), `plan` (the first line of a STAT block), `ctx` (a session
        context announcement), `error` (ERROR and PARSE ERROR lines) or `commit`
        (XCTEND lines). Binary searches over the fact rows and the sorted
        per-file lists, so every step is O(log n); no text is scanned. 404 when
        there is nothing further in that direction.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: from
          in: query
          description: line to step from (0 = before the first line); default 0
          schema:
            type: integer
            minimum: 0
        - name: what
          in: query
          required: true
          schema:
            type: string
            enum: [call, wait, cursor, plan, ctx, error, commit]
        - name: dir
          in: query
          required: true
          schema:
            type: integer
            enum: [1, -1]
      responses:
        "200":
          description: "{line}: 1-based line number"
          content:
            application/json:
              schema:
                type: object
                properties:
                  line:
                    type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or nothing further in that direction (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/profile:
    get:
      operationId: sessionLinesProfile
      summary: Per-bucket density of a file's lines (the Lines view strip)
      description: |
        The file cut into `buckets` runs of `size = ceil(total/buckets)` lines
        (bucket i covers lines `i*size+1 .. min(total, (i+1)*size)`) with, per
        bucket, the number of calls, waits, cursor parses (PARSING IN CURSOR
        blocks; implicit cursors have none), errors (ERROR and PARSE ERROR) and
        commits (XCTEND) on its lines. A file with fewer lines than `buckets`
        gets one bucket per line (`size` 1); when `size` does not divide `total`
        the last buckets may be empty. An empty file answers `total`, `buckets`
        and `size` 0 and empty arrays. Binary searches at the bucket edges over
        the fact rows and the sorted per-file lists: no text is scanned.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: buckets
          in: query
          description: number of buckets, 1..2000; default 200
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: LinesProfile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinesProfile"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/at:
    get:
      operationId: sessionAt
      summary: The model objects a trace line belongs to
      description: |
        Ids are -1 where there is no such object (`execNo` and `planLine`
        too). By `kind` of the line: WAIT: the wait and the call it is
        attributed to; PARSING IN CURSOR, SQL text, END OF STMT: only the
        cursor (and its statement and context); STAT: `planLine`, the index
        into the document's `planLines`, and the cursor; BINDS block: the
        call (EXEC) it is attached to, also for the continuation lines of a
        bind value or memory dump inside the block; anything else: the last
        call at or before the line. With a `bindSet`, `bindLine` and `binds`
        carry its header line and values.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: line
          in: query
          required: true
          description: 1-based line number
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: the objects at the line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtAnswer"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or no such line (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/search:
    get:
      operationId: sessionSearch
      summary: Search the text of one input file (NDJSON stream)
      description: |
        Scans the file from line `from` in 4 MB chunks and streams one JSON
        object per matching line, in line order, flushed as they are found:
        `{line, col, text}` (`col` is the 0-based byte offset of the first
        match, `text` the line without its terminator, cut to 400 bytes). The
        last record is `{done: true, scanned, truncated}`: `scanned` is the
        number of lines examined from `from`, `truncated` is true when
        `limit` stopped the scan. A request that is cancelled (the client
        closes the connection) stops within a chunk and ends without the done
        record. A literal `q` cannot contain a newline.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: q
          in: query
          required: true
          description: the text, or the regular expression (Go RE2 syntax) with regex=1
          schema:
            type: string
        - name: regex
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
        - name: case
          in: query
          description: "1: case-sensitive; 0 folds ASCII letters (regex: (?i))"
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: from
          in: query
          description: 1-based first line to search
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: matches to report (above 10000 = 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        "200":
          description: newline-delimited JSON, SearchHit records then one SearchEnd
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SearchHit"
                  - $ref: "#/components/schemas/SearchEnd"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/plan:
    get:
      operationId: sessionPlan
      summary: The rows of one STAT plan dump (what `mtkprof plan` prints)
      description: |
        The statement is `stmt` (its id in the document's `statements`) or
        `sql_id`. With `plh` the answer is the array of `PlanRow` of one
        dump of that plan hash (visualizer input, the V$SQL_PLAN_STATISTICS_ALL
        row format); `exec` picks the n-th STAT dump of the hash in trace
        order, the latest when missing. Without `plh` the statement's plan
        hashes are answered: the array when it has one, otherwise an object
        `{"<plan hash>": [rows]}` in order of first appearance (hashes with
        fewer than `exec` dumps are left out). The first row carries
        `sql_text`, `execution` (the dump's number among those of the hash)
        and `trace_line`. Compact JSON; `mtkprof plan` prints the same
        indented.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: stmt
          in: query
          description: statement id (document statements index); give this or sql_id
          schema:
            type: integer
            minimum: 0
        - name: sql_id
          in: query
          description: the Oracle sql_id (the first statement with it)
          schema:
            type: string
        - name: plh
          in: query
          description: plan hash value, decimal
          schema:
            type: string
        - name: exec
          in: query
          description: n-th STAT dump of the plan hash, 1-based (0 or missing = the latest)
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: the rows of one dump, or an object of them keyed by plan hash
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/PlanRow"
                  - type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: "#/components/schemas/PlanRow"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such sql_id, no STAT plan for the statement, no such plan hash or dump (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/report:
    get:
      operationId: sessionReport
      summary: The CLI's outputs for this session (download)
      description: |
        Streams what `mtkprof report`, `json`, `export` and `html` write for
        the session's trace, as an attachment (`Content-Disposition` names it
        after the first input file). The session's model is the aggregate one
        `mtkprof serve -spill` has, which shapes the outputs:

        - `text`: the report of `mtkprof report -aggregate`: everything but the
          per-statement executions tables, which it says it leaves out
          (`execs` is accepted and has no effect). Bind values are in or out
          as the session was opened (`options.binds`).
        - `json`: the document with `facts: false` and `packed: false` (an
          aggregate model has no fact tables), the plan visualizer URL of the
          engine (`-plan-viz-url`).
        - `csv`: a zip of the files `mtkprof export` writes (`statements.csv`
          ... `errors.csv`, flat in the archive); calls, waits and binds are
          read from the spill and equal the CLI's.
        - `html`: the single-file report, the UI page with the document of
          `json` (packed, no fact tables) inlined; the drill-downs that need
          fact tables have nothing to show.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: format
          in: query
          schema:
            type: string
            enum: [text, json, csv, html]
            default: text
        - name: sort
          in: query
          description: text only, statement order
          schema:
            type: string
            enum: [elapsed, self, cpu, execs, disk, query, rows, line]
            default: elapsed
        - name: top
          in: query
          description: text only, only the top N statements (0 = all)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: execs
          in: query
          description: text only, executions to list per statement (0 = none, -1 = all)
          schema:
            type: integer
            minimum: -1
            default: 20
        - name: binds
          in: query
          description: text only, bind sets to print per statement (0 = none)
          schema:
            type: integer
            minimum: 0
            default: 5
        - name: sys
          in: query
          description: text only, include recursive SYS statements
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: width
          in: query
          description: text only, report width (below 80 = 120)
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 120
      responses:
        "200":
          description: the report, as an attachment
          headers:
            Content-Disposition:
              description: attachment; filename="<first input without .trc>.txt|.json|.csv.zip|.html"
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
            application/zip:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: the report could not be produced (before the first byte; a failure later ends the stream short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /s/{id}/api/pivot:
    get:
      operationId: slicePivot
      summary: Group-by of calls or waits (analyze.Pivot)
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: fact
          in: query
          required: true
          schema:
            type: string
            enum: [calls, waits]
        - name: by
          in: query
          required: true
          description: comma-separated dimensions (a 400 lists the valid ones)
          schema:
            type: string
        - name: measure
          in: query
          description: comma-separated measures; the first sorts, the rest project
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1000
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          $ref: "#/components/responses/Pivot"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/timeline:
    get:
      operationId: sliceTimeline
      summary: CPU and waits per time bucket and event
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: bucket
          in: query
          description: bucket width in µs (default from the span; at most analyze.MaxBuckets buckets)
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: SpanSeries
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucketUs:
                    type: integer
                  firstTim:
                    type: integer
                  n:
                    type: integer
                  cpu:
                    type: array
                    items:
                      type: number
                  events:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/calls:
    get:
      operationId: sliceCalls
      summary: The longest calls in scope (Timeline swimlanes)
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 20000
        - name: longest
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
      responses:
        "200":
          description: CallRows (rows are arrays in the order of cols)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  sampled:
                    type: boolean
                  cols:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        type: integer
                  longest:
                    type: array
                    items:
                      type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/executions:
    get:
      operationId: sliceExecutions
      summary: A page of the executions of one statement (those whose EXEC call is in scope), with binds
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - name: stmt
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: offset+limit at most 100000
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          description: file order (default) or largest first by a measure
          schema:
            type: string
            enum: [file, e, c, waitEla, r, p, cr, fetches, start]
      responses:
        "200":
          description: ExecResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  stmt:
                    type: integer
                  total:
                    type: integer
                  offset:
                    type: integer
                  avgE:
                    type: number
                  slowest:
                    type: [object, "null"]
                  rows:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/executions/detail:
    get:
      operationId: sliceExecutionDetail
      summary: One execution taken apart (A/B comparison)
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: stmt
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: execNo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: ExecDetailResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    type: integer
                  execNo:
                    type: integer
                  exec:
                    type: integer
                  line:
                    type: integer
                  ctx:
                    type: integer
                  planHash:
                    type: integer
                  parse:
                    type: object
                  execPart:
                    type: object
                  fetch:
                    type: object
                  total:
                    type: object
                  waits:
                    type: array
                    items:
                      type: object
                  execWaits:
                    type: integer
                  bindSet:
                    type: integer
                  bindLine:
                    type: integer
                  binds:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/waits:
    get:
      operationId: sliceWaits
      summary: Wait rows, slowest or earliest first
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: sort
          in: query
          schema:
            type: string
            enum: [ela, tim]
            default: ela
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          description: WaitsResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  us:
                    type: integer
                  rows:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/waits/hist:
    get:
      operationId: sliceWaitHist
      summary: log2 histogram of wait durations
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          description: LogHist
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  us:
                    type: integer
                  counts:
                    type: array
                    items:
                      type: integer
                  sums:
                    type: array
                    items:
                      type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/waits/scatter:
    get:
      operationId: sliceWaitScatter
      summary: Sampled waits over time; rows are [tim, ela, line, stmt, ctx]
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: max
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 20000
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          description: ScatterResponse
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  sampled:
                    type: boolean
                  cols:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/waits/by:
    get:
      operationId: sliceWaitsBy
      summary: Wait time by statement, object, p1 or p2, largest first
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: by
          in: query
          required: true
          schema:
            type: string
            enum: [stmt, obj, p1, p2]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 12
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      responses:
        "200":
          description: WaitsByResponse (rows of {key, count, us})
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: integer
                  rows:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/profile:
    get:
      operationId: sliceProfile
      summary: CPU and waits per event in scope
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Stmt"
        - $ref: "#/components/parameters/Idle"
        - $ref: "#/components/parameters/Event"
      description: |
        `analyze.ProfileOfOn`: the CPU of the top-level calls and the waits
        per event in scope (the ledger), and the scope's response time the
        ledger is measured against (`analyze.ResponseOf`): the sum over the
        scope's sessions (a process of a file chain) of each session's span
        from its first call start to its last row, clipped to the window;
        PX slaves attached to a coordinator in scope are left out. `wallUs`
        is the wall-clock span (the window, else the span of the files of
        the contexts, else the trace's). `stmt`, `event` and `idle` filter
        the ledger rows only.
      responses:
        "200":
          description: the profile of the scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeProfile"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/statements:
    get:
      operationId: sliceStatements
      summary: The document's statement table (doc.stats.statements) over the scope
      description: |
        `analyze.StatementsOn`: one `StmtStats` per statement in id order,
        computed from the calls in scope (zero numbers where none is; `id`
        is always set), the same JSON as the entries of
        `doc.stats.statements`. Without parameters it equals
        `doc.stats.statements`. The UI's file selection sends the contexts of
        the selected files. `idle` is accepted and changes nothing: the wait
        times are those attributed to the calls in scope. Cursors, plans and
        errors follow the scope too (see `analyze.StatementsOn`).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: "{statements: [StmtStats]}"
          content:
            application/json:
              schema:
                type: object
                required: [statements]
                properties:
                  statements:
                    type: array
                    items:
                      $ref: "#/components/schemas/StmtStats"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/findings:
    get:
      operationId: sliceFindings
      summary: The document's findings (doc.stats.findings) over the scope
      description: |
        `analyze.FindingsOn`: the finding rules over the rows in scope, with
        the thresholds of the document's findings, the same JSON as
        `doc.stats.findings` (most severe first). Without parameters it
        equals `doc.stats.findings`. The statement table is that of
        `api/statements`, the executions are those whose EXEC call is in
        scope, the waits, commits and round trips those in scope, and the
        response time the severities are measured against is the window,
        else the span of the files of the selected contexts. A finding with
        `scope: "set"` is about the whole trace set and was not narrowed
        (no current rule is). `idle` is accepted and changes nothing.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: "{findings: [Finding]}"
          content:
            application/json:
              schema:
                type: object
                required: [findings]
                properties:
                  findings:
                    type: array
                    items:
                      type: object
                      required: [rule, title, severity, summary, statement, impactUs, evidence]
                      properties:
                        rule:
                          type: string
                        title:
                          type: string
                        severity:
                          type: string
                          enum: [serious, notable, info]
                        summary:
                          type: string
                        statement:
                          type: integer
                          description: statement id, -1 for a trace-level finding
                        impactUs:
                          type: integer
                        evidence:
                          type: array
                          items:
                            type: object
                        scope:
                          type: string
                          enum: [set]
                          description: present when the finding is about the whole set (not narrowed)
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/stmt/roles:
    get:
      operationId: sliceStmtRoles
      summary: Wait time per statement and wait class (waits in scope); rows are [statement, class index, µs]
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
      responses:
        "200":
          description: classes and rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        type: integer
  /s/{id}/api/stmt/waits:
    get:
      operationId: sliceStmtWaits
      summary: Top wait events of statements (waits in scope), keyed by statement id
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/StmtList"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
        - name: max
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 6
      responses:
        "200":
          description: "{waits: {<stmt>: [{event, us, count, maxUs, obj}]}}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  waits:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/stmt/spans:
    get:
      operationId: sliceStmtSpans
      summary: Merged time intervals of statements' calls in scope, keyed by statement id
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/StmtList"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - name: gap
          in: query
          description: merge intervals closer than this many µs
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: phases
          in: query
          description: >-
            segment the calls by phase instead of merging them: each interval then also has
            kind (the dominant call group by elapsed time) and us (µs per group). Calls join a
            segment when they start at most gap µs after its end and either continue its
            dominant group, or the segment is still narrower than gap, or the call is shorter
            than gap, so segments stay about gap wide.
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
      responses:
        "200":
          description: >-
            {spans: {<stmt>: [{start, end}]}}; with phases=1 each interval also has kind and us
          content:
            application/json:
              schema:
                type: object
                properties:
                  spans:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: integer
                          end:
                            type: integer
                          kind:
                            type: string
                            enum: [parse, exec, fetch, close, other]
                            description: only with phases=1
                          us:
                            type: array
                            description: only with phases=1; elapsed µs per group, in the order parse, exec, fetch, close, other (other = every kind but PARSE/EXEC/FETCH/CLOSE)
                            minItems: 5
                            maxItems: 5
                            items:
                              type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
  /s/{id}/api/stmt/waitspans:
    get:
      operationId: sliceStmtWaitSpans
      summary: Stretches of statements' waits in scope with their dominant events, keyed by statement id
      description: >-
        A wait covers [tim-ela, tim] (a WAIT line's tim is its end). Waits are cut into segments in start order: a wait
        joins the current segment when it starts at most gap µs after its end and either is on the segment's dominant
        event, or the segment is still narrower than gap, or the wait is shorter than gap. Idle waits follow idle.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/StmtList"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Contexts"
        - $ref: "#/components/parameters/Idle"
        - name: gap
          in: query
          description: segmentation width in µs (see above)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: "{spans: {<stmt>: [{start, end, event, top, restUs}]}}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  spans:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: integer
                          end:
                            type: integer
                          event:
                            type: integer
                            description: id of the dominant event (most µs; ties the lower id) in the document's events table
                          top:
                            type: array
                            description: "[event id, µs] of the (at most 3) events with the most time, biggest first"
                            maxItems: 3
                            items:
                              type: array
                              minItems: 2
                              maxItems: 2
                              items:
                                type: integer
                          restUs:
                            type: integer
                            description: µs of the segment's other events
        "400":
          $ref: "#/components/responses/SliceBadRequest"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: the MTKPROF_TOKEN the engine was started with
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      description: session id (s + 12 hex digits)
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      description: job id (j + 12 hex digits)
      schema:
        type: string
    PromptID:
      name: id
      in: path
      required: true
      description: prompt id (p + 12 hex digits)
      schema:
        type: string
    File:
      name: file
      in: query
      description: index of the input file (document file.files order)
      schema:
        type: integer
        minimum: 0
        default: 0
    ConnectionID:
      name: id
      in: path
      required: true
      description: connection id (the shell's)
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    From:
      name: from
      in: query
      description: scope start, tim in µs (a row is in when its [tim-ela, tim] overlaps the scope)
      schema:
        type: integer
        minimum: 0
    To:
      name: to
      in: query
      description: scope end, tim in µs (0 = open; not before from)
      schema:
        type: integer
        minimum: 0
    Contexts:
      name: contexts
      in: query
      description: >-
        comma-separated context ids (at most 10000); empty or absent = every context;
        `-` = no context at all (an explicit empty set: no row is in scope)
      schema:
        type: string
    Stmt:
      name: stmt
      in: query
      description: one statement id
      schema:
        type: integer
        minimum: 0
    StmtList:
      name: stmt
      in: query
      required: true
      description: comma-separated statement ids (at most 200)
      schema:
        type: string
    Event:
      name: event
      in: query
      description: one event id (waits only)
      schema:
        type: integer
        minimum: 0
    Idle:
      name: idle
      in: query
      description: include idle waits
      schema:
        type: string
        enum: ["0", "1"]
        default: "1"
    Scope:
      name: scope
      in: query
      description: "all: every wait; without it event or stmt is required"
      schema:
        type: string
        enum: [all]
  responses:
    BadRequest:
      description: bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: missing or wrong bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: no such object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: the object is in the wrong state (session not ready, job finished, entry open, engine shutting down)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Remote:
      description: the remote host or the connection to it failed (unreachable, authentication, permission, missing file)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SliceBadRequest:
      description: a bad parameter, the reason as plain text
      content:
        text/plain:
          schema:
            type: string
    Pivot:
      description: PivotResponse
      content:
        application/json:
          schema:
            type: object
            properties:
              fact:
                type: string
              dims:
                type: array
                items:
                  type: object
              measures:
                type: array
                items:
                  type: object
              rows:
                type: array
                items:
                  type: object
              total:
                type: array
                items:
                  type: number
              facts:
                type: integer
              bucketUs:
                type: integer
              groups:
                type: integer
              truncated:
                type: boolean
  schemas:
    LineKind:
      type: string
      description: the parser's kind of a trace line (trace.Kind.String())
      enum: [unknown, blank, header, separator, marker, parsing-in-cursor, sql-text, end-of-stmt, call, wait, stat, binds, bind-line, xctend, error, parse-error, lob, rpc]
    LinesPage:
      type: object
      properties:
        from:
          type: integer
        total:
          type: integer
          description: the line count of the file
        lines:
          type: array
          items:
            type: object
            properties:
              t:
                type: string
                description: the line without its terminator
              k:
                $ref: "#/components/schemas/LineKind"
              c:
                type: integer
                description: annot=2 only. Call id of the line as api/at gives it (-1 where none; the keys c, s, u, x, w are all omitted when none applies)
              s:
                type: integer
                description: annot=2 only. Statement id (-1 where none)
              u:
                type: integer
                description: annot=2 only. Cursor id (-1 where none)
              x:
                type: integer
                description: annot=2 only. Execution number of the call (-1 where none)
              w:
                type: integer
                description: annot=2 only. Wait id (-1 where none)
    LinesProfile:
      type: object
      description: |
        Per-bucket counts of one file; every array has `buckets` entries.
        Bucket i covers lines `i*size+1 .. min(total, (i+1)*size)`.
      required: [total, buckets, size, calls, waits, cursors, errors, commits, maxCalls, maxWaits]
      properties:
        total:
          type: integer
          description: the line count of the file
        buckets:
          type: integer
          description: the number of buckets, min(requested, total)
        size:
          type: integer
          description: lines per bucket, ceil(total/buckets)
        calls:
          type: array
          items:
            type: integer
        waits:
          type: array
          items:
            type: integer
        cursors:
          type: array
          items:
            type: integer
        errors:
          type: array
          items:
            type: integer
        commits:
          type: array
          items:
            type: integer
        maxCalls:
          type: integer
        maxWaits:
          type: integer
    AtAnswer:
      type: object
      description: ids are -1 where absent
      properties:
        call:
          type: integer
        stmt:
          type: integer
        cursor:
          type: integer
        execNo:
          type: integer
        wait:
          type: integer
        bindSet:
          type: integer
        bindLine:
          type: integer
          description: line of the BINDS header of `bindSet`; -1 when `bindSet` is -1
        binds:
          type: array
          description: the values of `bindSet` (absent when `bindSet` is -1), so a client without the facts tables can decode a bind line
          items:
            $ref: "#/components/schemas/BindValue"
        ctx:
          type: integer
        planLine:
          type: integer
          description: index into the document's planLines
        kind:
          $ref: "#/components/schemas/LineKind"
        execFrom:
          type: integer
          description: |
            first line of the execution the line belongs to (set when `execNo`
            >= 1): the BINDS block of the EXEC when it has one, else the first
            call; -1 where absent
        execTo:
          type: integer
          description: last line of that execution (its last FETCH, or the CLOSE that follows it); -1 where absent
        prevExec:
          type: integer
          description: line of the EXEC call of the previous execution of the same cursor in this file; -1 where absent (also beyond a 100k-row search window)
        nextExec:
          type: integer
          description: line of the EXEC call of the next execution of the same cursor in this file; -1 where absent (also beyond a 100k-row search window)
        cursorLine:
          type: integer
          description: line of the cursor's PARSING IN CURSOR block; -1 for an implicit cursor or one parsed in another file
        closeLine:
          type: integer
          description: line of the first CLOSE of the cursor at or after the line (within 100k call rows); -1 where absent
        object:
          type: string
          description: owner.name of a WAIT line's obj# when the session has a reference bundle that knows it, else ""
    BindValue:
      type: object
      description: one bind value of an execution
      properties:
        pos:
          type: integer
        type:
          type: string
          description: datatype name (`NUMBER`, `VARCHAR2`, ...)
        value:
          type: string
        isNull:
          type: boolean
        noDef:
          type: boolean
          description: '"No oacdef for this bind." (repeated bind name)'
        dump:
          type: boolean
          description: the value is a memory dump
        mal:
          type: integer
        kind:
          type: string
        typed:
          type: string
          description: decoded typed form of a dumped value; absent when none
    SearchHit:
      type: object
      properties:
        line:
          type: integer
        col:
          type: integer
          description: 0-based byte offset of the first match
        text:
          type: string
          description: the line, cut to 400 bytes
    SearchEnd:
      type: object
      properties:
        done:
          type: boolean
        scanned:
          type: integer
        truncated:
          type: boolean
    PlanRow:
      type: object
      description: one STAT line in the V$SQL_PLAN_STATISTICS_ALL-style row format of ora-explain-plan-viz; numbers are omitted where unknown
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, "null"]
        depth:
          type: integer
        operation:
          type: string
        object_name:
          type: string
        object_id:
          type: integer
        object_alias:
          type: string
        qblock_name:
          type: string
        access_predicates:
          type: string
        filter_predicates:
          type: string
        cardinality:
          type: integer
        bytes:
          type: integer
        cost:
          type: integer
        actual_rows:
          type: integer
        starts:
          type: integer
        actual_elapsed_time:
          type: integer
          description: µs
        cr_buffer_gets:
          type: integer
        physical_reads:
          type: integer
        physical_writes:
          type: integer
        sql_id:
          type: string
        plan_hash_value:
          type: string
        sql_text:
          type: string
          description: first row only
        execution:
          type: integer
          description: first row only, the dump's number among those of the plan hash
        trace_line:
          type: integer
          description: first row only, line of the first STAT line
    CallStats:
      type: object
      description: analyze.CallStats, tkprof-style totals of one call kind
      properties:
        count:
          type: integer
          description: "calls"
        misses:
          type: integer
          description: "library cache misses (Σ mis)"
        cpu:
          type: integer
          description: "µs"
        elapsed:
          type: integer
          description: "µs"
        disk:
          type: integer
        query:
          type: integer
        current:
          type: integer
        rows:
          type: integer
        waitUs:
          type: integer
          description: "in-call waits attributed to these calls, µs"
        idleUs:
          type: integer
          description: "between-call waits attributed to these calls, µs"
        selfCpu:
          type: integer
          description: "µs, excluding recursive children"
        selfElapsed:
          type: integer
          description: "µs, excluding recursive children"
        selfDisk:
          type: integer
        selfQuery:
          type: integer
        selfCurrent:
          type: integer
    Link:
      type: object
      description: analyze.Link, a recursive relationship between two statements
      properties:
        statement:
          type: integer
        calls:
          type: integer
        elapsed:
          type: integer
          description: µs
    ScopeProfile:
      type: object
      description: analyze.ScopeProfile, the answer of api/profile
      properties:
        calls:
          type: integer
          description: calls in scope
        waits:
          type: integer
          description: waits in scope
        cpuUs:
          type: integer
          description: Σ c of the top-level calls in scope, µs
        events:
          type: array
          description: analyze.EventAgg per event with waits in scope (event, name, class, idle, count, us, minUs, maxUs)
          items:
            type: object
        responseUs:
          type: integer
          description: the scope's response time, Σ session spans, µs (the trace span for a single session)
        wallUs:
          type: integer
          description: wall-clock span of the scope, µs
        sessions:
          type: integer
          description: sessions with time in scope
    StmtStats:
      type: object
      description: analyze.StmtStats, one entry of doc.stats.statements
      properties:
        id:
          type: integer
          description: statement id (index into the document's statements)
        parse:
          $ref: "#/components/schemas/CallStats"
        exec:
          $ref: "#/components/schemas/CallStats"
        fetch:
          $ref: "#/components/schemas/CallStats"
        close:
          $ref: "#/components/schemas/CallStats"
        other:
          $ref: "#/components/schemas/CallStats"
        total:
          $ref: "#/components/schemas/CallStats"
        allCalls:
          $ref: "#/components/schemas/CallStats"
        elapsed:
          type: integer
          description: "response time, µs: Σ e of calls not nested in a call of the same statement"
        selfElapsed:
          type: integer
          description: "µs"
        cpu:
          type: integer
          description: "µs"
        selfCpu:
          type: integer
          description: "µs"
        waitUs:
          type: integer
          description: "in-call waits, µs"
        idleUs:
          type: integer
          description: "between-call waits, µs"
        childUs:
          type: integer
          description: "µs in recursive children"
        executions:
          type: integer
        hardParses:
          type: integer
        cursors:
          type: integer
          description: "cursors in scope"
        errors:
          type: integer
        minDepth:
          type: integer
        maxDepth:
          type: integer
        topLevel:
          type: boolean
        firstWallUs:
          type: integer
        lastWallUs:
          type: integer
        firstTim:
          type: integer
        lastTim:
          type: integer
        pxEla:
          type: integer
          description: "attached PX slaves: Σ self elapsed, µs"
        pxCpu:
          type: integer
          description: "attached PX slaves: Σ self cpu, µs"
        pxSessions:
          type: integer
          description: "distinct slave processes"
        parents:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Link"
        children:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Link"
        plans:
          type: [array, "null"]
          items:
            type: integer
        planHashes:
          type: [array, "null"]
          items:
            type: integer
    ErrorCode:
      type: string
      enum: [bad_request, unauthorized, not_found, conflict, cancelled, needs_prompt, internal, remote]
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
    Identity:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Health:
      type: object
      required: [version, protocol, uptime, sessions, cache]
      additionalProperties: false
      properties:
        version:
          type: string
        protocol:
          type: integer
        uptime:
          type: integer
          description: seconds
        sessions:
          type: integer
        cache:
          $ref: "#/components/schemas/CacheHealth"
    CacheHealth:
      type: object
      required: [bytes, entries, cap]
      additionalProperties: false
      properties:
        bytes:
          type: integer
        entries:
          type: integer
        cap:
          type: integer
    JobInfo:
      type: object
      required: [id, kind, state, phase, done, total, unit, message]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [open, fetch, follow, ref, live]
        state:
          type: string
          enum: [running, done, failed, cancelled]
        phase:
          type: string
          description: "open: open (cache lookup), parse (miss only), index (miss only), ready; fetch: fetch; follow, live: follow; ref: ref (obtaining the bundle), apply"
          enum: [open, parse, index, ready, fetch, follow, ref, apply]
        done:
          type: integer
        total:
          type: integer
          description: 0 = unknown
        unit:
          type: string
          description: "bytes in phases parse, fetch (ssh) and follow (live: bytes parsed at the last snapshot); lines in fetch of a db connection; files and queries in ref; empty otherwise"
          enum: [bytes, lines, files, queries, ""]
        message:
          type: string
          description: "the error of a failed job, \"cancelled\" for a cancelled one. A finished ref job: what the bundle holds, and the reference queries it skipped. A running db fetch: a note once it is past 200 MB"
        session:
          type: string
          description: the session the job opens (kind open) or applies to (kind ref)
        lines:
          type: integer
          description: parse progress
        statements:
          type: integer
          description: parse progress
        connection:
          type: string
          description: "fetch, follow, live (of a remote follow), and ref of a db connection: the connection"
        localPaths:
          type: array
          items:
            type: string
          description: "fetch: the local files, once done; follow: the local file"
    JobList:
      type: object
      required: [jobs]
      additionalProperties: false
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobInfo"
    FileInfo:
      type: object
      required: [path, name, size]
      additionalProperties: false
      properties:
        path:
          type: string
        name:
          type: string
        size:
          type: integer
    SessionState:
      type: string
      description: "opening → ready | failed; a live session: opening → live (from its first snapshot) → failed on a stream error; closed only in the event of a DELETE"
      enum: [opening, ready, live, failed, closed]
    SessionInfo:
      type: object
      required: [id, paths, state, rev, identity, cacheIdentity, hit, files, opened, bytes, lines]
      additionalProperties: false
      properties:
        id:
          type: string
        paths:
          type: array
          items:
            type: string
          description: the requested paths, absolute
        state:
          $ref: "#/components/schemas/SessionState"
        rev:
          type: integer
          description: document revision; a live session counts its snapshots (0 before the first)
        identity:
          type: string
          pattern: "^([0-9a-f]{64})?$"
          description: content identity of the trace files without options (sha256 of size and first MiB per file, order-independent); the key of annotations. Empty for a live session (a growing file has no identity)
        cacheIdentity:
          type: string
          pattern: "^([0-9a-f]{64})?$"
          description: identity of the cache entry (files plus bind mode, salt, thresholds, index format); the {identity} of /engine/cache. Empty for a live session (not cached)
        hit:
          type: boolean
          description: opened from the cache without a parse (false while opening)
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInfo"
          description: the input files (while opening) or the model's files (once ready, followed files included)
        opened:
          type: string
          format: date-time
        bytes:
          type: integer
        lines:
          type: integer
        job:
          type: string
          description: the open job
        error:
          type: string
          description: why the session failed ("cancelled" when its job was cancelled)
    SessionList:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
    SessionOptions:
      type: object
      additionalProperties: false
      properties:
        follow:
          type: boolean
          description: a live session over one growing file (see POST /engine/sessions)
        batchMs:
          type: integer
          minimum: 50
          maximum: 60000
          default: 1000
          description: "live: the batch period: a snapshot at most this often (and at least 3x the cost of the last one apart)"
        batchMB:
          type: integer
          minimum: 0
          default: 0
          description: "live: also a snapshot after this many MiB of new input (0 = off)"
        binds:
          type: string
          enum: [keep, redact, none]
          default: keep
        salt:
          type: string
          description: redaction salt (implies redact)
        thresholds:
          type: object
          description: finding thresholds (`mtkprof findings-config`); unknown keys are a 400
    OpenSessionRequest:
      type: object
      required: [paths]
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
          description: trace files or directories of them
        options:
          $ref: "#/components/schemas/SessionOptions"
    OpenSessionResponse:
      type: object
      required: [session, job]
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/SessionInfo"
        job:
          $ref: "#/components/schemas/JobInfo"
    SessionEvent:
      type: object
      required: [id, state, rev]
      additionalProperties: false
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/SessionState"
        rev:
          type: integer
    PromptEvent:
      type: object
      required: [id, connection, kind, text, echo, state]
      additionalProperties: false
      properties:
        id:
          type: string
        connection:
          type: string
        kind:
          type: string
          enum: [password, passphrase, otp, hostkey, confirm]
        text:
          type: string
        echo:
          type: boolean
        state:
          type: string
          enum: [open, closed]
        fingerprint:
          type: string
          description: "hostkey: the SHA256 fingerprint of the unknown host key (answer yes to accept; it is then added to ~/.ssh/known_hosts)"
    PromptAnswer:
      type: object
      description: "{answer} or {cancel: true}"
      properties:
        answer:
          type: string
        cancel:
          type: boolean
    LogEvent:
      type: object
      required: [level, message]
      additionalProperties: false
      properties:
        level:
          type: string
          enum: [info, error]
        message:
          type: string
    CacheItem:
      type: object
      required: [identity, bytes, created, lastUsed, paths, open]
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
        bytes:
          type: integer
        created:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
        paths:
          type: array
          items:
            type: string
          description: absolute source paths at build time
        open:
          type: boolean
          description: a session of this engine has it open
    CacheList:
      type: object
      required: [bytes, entries, cap, items]
      additionalProperties: false
      properties:
        bytes:
          type: integer
        entries:
          type: integer
        cap:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CacheItem"
    CacheWipe:
      type: object
      required: [removed, skipped, bytes]
      additionalProperties: false
      properties:
        removed:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
          description: entries kept because a session has them open
        bytes:
          type: integer
          description: bytes freed
    AskpassRequest:
      type: object
      required: [text]
      properties:
        connection:
          type: string
          description: MTKPROF_PROMPT_CONN (empty or unknown = no caching)
        kind:
          type: string
          enum: [password, passphrase, otp, hostkey, confirm]
          description: the helper's classification (absent = classified by the engine)
        text:
          type: string
          description: the prompt as ssh printed it
        fingerprint:
          type: string
        spawn:
          type: string
          description: id of the ssh run (MTKPROF_PROMPT_SPAWN)
    ConnectionDef:
      type: object
      required: [id, kind, host]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        kind:
          type: string
          enum: [ssh, db]
        host:
          type: string
          description: "ssh: a host name or ~/.ssh/config alias"
        port:
          type: integer
          description: 0 = ~/.ssh/config or 22
        user:
          type: string
          description: empty = ~/.ssh/config or the local user
        service:
          type: string
          description: db service name (required for db)
        adrHome:
          type: string
          description: db ADR home, the default of a fetch that names none (else V$DIAG_INFO's)
        tcps:
          type: boolean
          description: db only. Connect with TCPS (TLS); the port is then usually 2484
        tlsSkipVerify:
          type: boolean
          description: db only, needs tcps. Do not verify the server certificate (encrypts, does not authenticate)
        transport:
          type: string
          enum: [auto, cli, lib]
          default: auto
          description: "ssh only. cli: the system ssh/sftp with the askpass bridge; lib: the Go SSH library; auto: cli when ssh is on PATH, lib otherwise or once ssh ignored SSH_ASKPASS"
    ConnectionInfo:
      type: object
      required: [id, kind, host, port, user, transport, active]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [ssh, db]
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        service:
          type: string
        adrHome:
          type: string
        tcps:
          type: boolean
        tlsSkipVerify:
          type: boolean
        transport:
          type: string
          enum: [auto, cli, lib, ""]
        active:
          type: string
          enum: [cli, lib, ""]
          description: the SSH transport in use ("" before the first operation)
    ConnectionTest:
      type: object
      required: [server, transport]
      additionalProperties: false
      properties:
        server:
          type: string
          description: "ssh: the host's `uname -sr` (lib adds the SSH server version); db: the server version (V$INSTANCE.VERSION_FULL, else the V$VERSION banner)"
        transport:
          type: string
          enum: [cli, lib, tcp, tcps]
        diag:
          $ref: "#/components/schemas/DBDiag"
    SSHFetchRequest:
      type: object
      required: [paths]
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        gzip:
          type: boolean
          default: true
    DBFetchRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        adrHome:
          type: string
          description: "the file's ADR home (DBTraceFile.adrHome); default the connection's adrHome, else V$DIAG_INFO's"
        name:
          type: string
          description: "TRACE_FILENAME, a file name (no path)"
    DBDiag:
      type: object
      description: V$DIAG_INFO of a db connection
      required: [adrHome, traceDir]
      additionalProperties: false
      properties:
        adrHome:
          type: string
          description: "ADR Home: the adrHome of a fetch"
        traceDir:
          type: string
          description: "Diag Trace: the trace directory on the database host"
    DBTraceFile:
      type: object
      description: a trace file of the ADR home (V$DIAG_TRACE_FILE, with the session writing it)
      required: [adrHome, name]
      properties:
        adrHome:
          type: string
        name:
          type: string
          description: TRACE_FILENAME, the name of a fetch
        path:
          type: string
          description: full path on the host, when a live process writes the file (V$PROCESS.TRACEFILE)
        modified:
          type: string
          format: date-time
        conId:
          type: integer
        sid:
          type: integer
        serial:
          type: integer
        username:
          type: string
        fromProcess:
          type: boolean
          description: V$DIAG_TRACE_FILE was not readable (ORA-00942); the row is the file a live session would write
    DBSession:
      type: object
      description: a user session (V$SESSION type USER) with its server process' trace file
      required: [sid, serial, username, status, sqlTrace, traceFile, self]
      properties:
        sid:
          type: integer
        serial:
          type: integer
        username:
          type: string
        osuser:
          type: string
        machine:
          type: string
        program:
          type: string
        module:
          type: string
        action:
          type: string
        status:
          type: string
        sqlId:
          type: string
        logonTime:
          type: string
          format: date-time
        sqlTrace:
          type: string
          description: V$SESSION.SQL_TRACE, ENABLED or DISABLED
        traceFile:
          type: string
          description: V$PROCESS.TRACEFILE of the server process
        self:
          type: boolean
          description: the session the connection itself runs on
    RemoteEntry:
      type: object
      required: [name, path, size, mode, modTime, dir, link]
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        mode:
          type: string
          description: as ls -l prints it (-rw-r-----)
        modTime:
          type: string
          format: date-time
          description: minute precision (cli, from sftp ls -l; day precision past 6 months)
        dir:
          type: boolean
        link:
          type: boolean
    RemoteListing:
      type: object
      required: [path, entries]
      additionalProperties: false
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RemoteEntry"
    Document:
      type: object
      description: report.Document (format 3); see web/src/lib/data/types.ts
      properties:
        tool:
          type: string
        version:
          type: string
        generated:
          type: string
          format: date-time
        format:
          type: integer
        file:
          type: object
        span:
          type: object
        statements:
          type: array
          items:
            type: object
        cursors:
          type: array
          items:
            type: object
        contexts:
          type: array
          items:
            type: object
        events:
          type: array
          items:
            type: object
        plans:
          type: array
          items:
            type: object
        planLines:
          type: array
          items:
            type: object
        transactions:
          type: array
          items:
            type: object
        errors:
          type: array
          items:
            type: object
        markers:
          type: array
          items:
            type: object
        diag:
          type: object
        unknown:
          type: array
          items:
            type: object
        stats:
          type: object
          properties:
            minimap:
              type: object
              properties:
                bucketUs:
                  type: integer
                cpu:
                  type: array
                  items:
                    type: integer
                waits:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: integer
