openapi: 3.1.0
# The contract of `mtkprof engine` (docs/PLAN-DESKTOP.md § 2). Formatting
# rule: 2-space indentation, one path per line at indent 2 under `paths:`,
# its methods at indent 4. internal/engine/contract_test.go reads the paths
# with a line scanner and compares them with Server.Routes(); keep both in
# step (a route missing on either side fails the test).
info:
  title: mtkprof engine
  version: "1"
  description: |
    Control plane and per-session API of `mtkprof engine`, the desktop app's
    sidecar. `info.version` and `x-mtkprof-protocol` are the protocol
    integer (`engine.Protocol`); it increments on any breaking change and
    the shell refuses an engine whose protocol it does not know.

    Process: `mtkprof engine [-listen 127.0.0.1:0] [-cache DIR] [-cache-cap 20G]
    [-allow-origin O,...] [-idle-exit D] [-detach]`, token in the environment
    (`MTKPROF_TOKEN`, 32+ bytes). Once listening it prints one line on stdout:
    `{"ready":true,"addr":"127.0.0.1:41233","version":"...","protocol":1}`.
    It exits when stdin closes (unless -detach), on SIGINT/SIGTERM, or after
    -idle-exit without sessions and requests.

    Every request but `GET /engine/health` needs `Authorization: Bearer <token>`;
    that includes the event stream, so a browser client reads it with
    `fetch` (a streaming body), not `EventSource`, which cannot send headers.
    CORS is answered for the `-allow-origin` origins only.

    Control-plane errors use the envelope `{"error": {"code", "message"}}`
    (`ErrorEnvelope`) with the status of the code: bad_request 400,
    unauthorized 401, not_found 404, conflict and cancelled 409,
    needs_prompt 428, internal 500, remote 502 (a remote host or the
    connection to it failed). The slice endpoints under
    `/s/{id}/api/` answer a bad parameter with a plain-text 400 (they are
    the handlers of `mtkprof serve`); a missing session or a session that is
    not ready is the envelope (404, 409).
  license:
    name: Apache-2.0
x-mtkprof-protocol: 1
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
        description: the port of the ready line
security:
  - bearer: []
paths:
  /engine/health:
    get:
      operationId: health
      summary: Engine version, protocol, uptime, sessions and cache size (no token needed)
      security: []
      responses:
        "200":
          description: health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /engine/events:
    get:
      operationId: events
      summary: Server-sent events (job, session, prompt, log)
      description: |
        `text/event-stream`. The stream opens with the comment
        `: mtkprof engine`, then replays every prompt that is still open, then
        sends events as they happen; a `: keepalive` comment every 15 s.
        Each event is `event: <type>` and one `data:` line of JSON:

        - `job`: `JobInfo`, on every change of a job (state, phase, progress
          at most every 64 MB of parse).
        - `session`: `SessionEvent` (`{id, state, rev}`), on open, ready,
          failed and closed.
        - `prompt`: `PromptEvent`, `state: open` when a credential is needed
          and `state: closed` once it is answered, cancelled or abandoned.
        - `log`: `LogEvent` (`{level, message}`).

        A subscriber that falls behind by 256 events is disconnected; it
        reconnects and re-reads `GET /engine/sessions` and `/engine/jobs`.
      responses:
        "200":
          description: the event stream
          content:
            text/event-stream:
              schema:
                type: string
              x-mtkprof-events:
                job:
                  $ref: "#/components/schemas/JobInfo"
                session:
                  $ref: "#/components/schemas/SessionEvent"
                prompt:
                  $ref: "#/components/schemas/PromptEvent"
                log:
                  $ref: "#/components/schemas/LogEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/prompts/{id}:
    post:
      operationId: answerPrompt
      summary: Answer or cancel an open prompt
      parameters:
        - $ref: "#/components/parameters/PromptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptAnswer"
      responses:
        "204":
          description: answered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/sessions:
    get:
      operationId: listSessions
      summary: The sessions, oldest first
      responses:
        "200":
          description: sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: openSession
      summary: Open a trace set (one file, several, or directories of them)
      description: |
        Answers at once with the new session (`opening`) and its `open` job.
        The job's phases are `open` (cache lookup), on a miss `parse`
        (unit bytes, with lines and statements) and `index` (writing the cache
        entry), then `ready`. A hit goes from `open` straight to `ready`. The
        session becomes `ready` or `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
      responses:
        "202":
          description: opening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeSession
      summary: Close a session (cancels its open job); the cache entry stays
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/jobs:
    get:
      operationId: listJobs
      summary: Running jobs and the last 100 finished ones, oldest first
      responses:
        "200":
          description: jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/jobs/{id}:
    delete:
      operationId: cancelJob
      summary: Cancel a running job; a job event says when it has stopped
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: cancelling
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/cache:
    get:
      operationId: listCache
      summary: The entries of the index cache, most recently used first
      responses:
        "200":
          description: the cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: wipeCache
      summary: Remove every entry no session has open
      responses:
        "200":
          description: what was removed and what was kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheWipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /engine/cache/{identity}:
    delete:
      operationId: deleteCacheEntry
      summary: Remove one entry (409 while a session has it open)
      parameters:
        - name: identity
          in: path
          required: true
          description: a session's cacheIdentity
          schema:
            $ref: "#/components/schemas/Identity"
      responses:
        "204":
          description: removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/askpass:
    post:
      operationId: askpass
      summary: A prompt of ssh, posted by the `mtkprof askpass` helper; answered once the user has
      description: |
        The engine spawns the system ssh/sftp with `SSH_ASKPASS` set to the
        mtkprof binary and `MTKPROF_ENGINE`, `MTKPROF_TOKEN`,
        `MTKPROF_PROMPT_CONN` in its environment. ssh runs the helper with
        its prompt text; the helper classifies it and posts it here. The
        engine raises a `prompt` event and holds the request until
        `POST /engine/prompts/{id}`, then answers `{answer}` (hostkey and
        confirm: the helper prints yes or no). Password and passphrase
        answers are kept in memory per connection until it is deleted; a
        cached answer is offered once per ssh run (`spawn`), so a wrong one
        is asked again. A cancelled prompt is 409 `cancelled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskpassRequest"
      responses:
        "200":
          description: the answer
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections:
    get:
      operationId: listConnections
      summary: The registered connections, by id
      responses:
        "200":
          description: connections
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: putConnection
      summary: Register (or replace) a connection definition; no secrets
      description: |
        Replacing a definition closes the old connection and drops its
        credentials (409 while a fetch or follow of it runs). A `db`
        connection is stored, but its operations answer 400 "not
        implemented yet" until internal/remote/db is wired (E8); follow is
        ssh only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionDef"
      responses:
        "200":
          description: registered
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    $ref: "#/components/schemas/ConnectionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Cancel the connection's jobs, close it and forget its credentials
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "204":
          description: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /engine/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Connect (prompting as needed) and report the host
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/ls:
    get:
      operationId: lsConnection
      summary: List a remote directory (or one file)
      description: |
        ssh: `sftp -b -` running `ls -ln path` (cli) or SFTP ReadDir (lib).
        Hidden files are not listed; symbolic links are not followed.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: path
          in: query
          required: true
          description: remote directory or file (absolute, or relative to the login directory)
          schema:
            type: string
      responses:
        "200":
          description: the listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/diag:
    get:
      operationId: diagConnection
      summary: Candidate trace directories on the host
      description: |
        `$ORACLE_BASE/diag/rdbms/*/*/trace`, the same under the ORACLE_BASE of
        every home in /etc/oratab (/var/opt/oracle/oratab), then
        `/u01/app/oracle/diag/rdbms/*/*/trace`; existing directories only,
        without duplicates.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: directories
          content:
            application/json:
              schema:
                type: object
                required: [dirs]
                properties:
                  dirs:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Remote"
  /engine/connections/{id}/fetch:
    post:
      operationId: fetchConnection
      summary: Copy remote files into the cache (job kind fetch)
      description: |
        Files go to `<cache>/remote/<connection>/<basename>` (base names must
        differ). A local file shorter than the remote one is resumed at its
        size; a longer one is fetched again from the start. ssh/cli streams
        `tail -c +N -- path`, through `gzip -1 -c` when the host has gzip
        and `gzip` is not false; lib reads over SFTP. Progress: bytes over
        all files (`total` from the remote sizes, raised if a file grows).
        The finished job carries `localPaths`; open them with
        `POST /engine/sessions`. Cancel with `DELETE /engine/jobs/{id}`;
        the partial files stay for the next fetch to resume.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              additionalProperties: false
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                gzip:
                  type: boolean
                  default: true
      responses:
        "202":
          description: the job and where the files will be
          content:
            application/json:
              schema:
                type: object
                required: [job, localPaths]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
                  localPaths:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /engine/connections/{id}/follow:
    post:
      operationId: followConnection
      summary: Mirror a growing remote file into the cache (job kind follow)
      description: |
        Follow (file mirror); the live session is pending. The job copies the
        file to `<cache>/remote/<connection>/<basename>` (resuming at the
        local size) and keeps appending what the host writes (ssh/cli:
        `tail -c +N -f -- path`, stopped on the host when the stream ends;
        lib: SFTP size poll every 500 ms), reconnecting after a drop (5
        failures in a row end it). `done` is the local size, `total` 0. It
        runs until `DELETE /engine/jobs/{id}` (state cancelled). A later
        version opens a `live` session fed by the streaming parser instead.
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path:
                  type: string
      responses:
        "202":
          description: the job and the local file
          content:
            application/json:
              schema:
                type: object
                required: [job, localPath]
                properties:
                  job:
                    $ref: "#/components/schemas/JobInfo"
                  localPath:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/doc:
    get:
      operationId: sessionDoc
      summary: The session's document (format 3, slice true, packed, no fact tables)
      description: |
        The document `mtkprof serve -spill` serves at `/api/doc`. `stats.minimap`
        holds 1024 buckets of CPU and wait time per wait class over the whole
        span. `rev` is accepted; every session has revision 1 until reference
        data or follow exist.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: rev
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: the document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines:
    get:
      operationId: sessionLines
      summary: Raw lines of one input file (optionally annotated with the line kinds)
      description: |
        Up to `n` lines (at most 2000) of input file `file`, starting at line
        `from`. Plain: `text/plain` with the file's line count in
        `X-Total-Lines`. With `annot=1`: JSON `{from, total, lines: [{t, k}]}`,
        each line without its terminator and its kind `k` (`trace.Classify`,
        see `LineKind`). A page that starts in the middle of a statement is
        classified from the 64 lines before it; a statement longer than both
        that and the page has wrong kinds until its `END OF STMT` (bind value
        continuation lines and PARSE ERROR text come out as `unknown`).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: file
          in: query
          description: index of the input file (document file.files order)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: from
          in: query
          description: 1-based first line
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: n
          in: query
          description: number of lines (missing or above 2000 = 2000)
          schema:
            type: integer
            maximum: 2000
            default: 2000
        - name: annot
          in: query
          description: "1: the JSON form with a kind per line"
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
      responses:
        "200":
          description: the lines
          headers:
            X-Total-Lines:
              description: the line count of the file (plain form)
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/LinesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/lines/at:
    get:
      operationId: sessionLinesAt
      summary: The first line whose call or wait has tim >= the given one
      description: |
        Binary search over the call rows of the file, then over its waits;
        the smaller line wins (a call's WAIT lines come before its own line).
        A `tim` past the last record gives the line of the last call or wait.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: tim
          in: query
          required: true
          description: trace clock value in µs
          schema:
            type: integer
      responses:
        "200":
          description: "{line}: 1-based line number"
          content:
            application/json:
              schema:
                type: object
                properties:
                  line:
                    type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or a file without call and wait rows (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/at:
    get:
      operationId: sessionAt
      summary: The model objects a trace line belongs to
      description: |
        Ids are -1 where there is no such object (`execNo` and `planLine`
        too). By `kind` of the line: WAIT: the wait and the call it is
        attributed to; PARSING IN CURSOR, SQL text, END OF STMT: only the
        cursor (and its statement and context); STAT: `planLine`, the index
        into the document's `planLines`, and the cursor; BINDS block: the
        call (EXEC) it is attached to; anything else: the last call at or
        before the line.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: line
          in: query
          required: true
          description: 1-based line number
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: the objects at the line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtAnswer"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such file or no such line (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/search:
    get:
      operationId: sessionSearch
      summary: Search the text of one input file (NDJSON stream)
      description: |
        Scans the file from line `from` in 4 MB chunks and streams one JSON
        object per matching line, in line order, flushed as they are found:
        `{line, col, text}` (`col` is the 0-based byte offset of the first
        match, `text` the line without its terminator, cut to 400 bytes). The
        last record is `{done: true, scanned, truncated}`: `scanned` is the
        number of lines examined from `from`, `truncated` is true when
        `limit` stopped the scan. A request that is cancelled (the client
        closes the connection) stops within a chunk and ends without the done
        record. A literal `q` cannot contain a newline.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/File"
        - name: q
          in: query
          required: true
          description: the text, or the regular expression (Go RE2 syntax) with regex=1
          schema:
            type: string
        - name: regex
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
        - name: case
          in: query
          description: "1: case-sensitive; 0 folds ASCII letters (regex: (?i))"
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: from
          in: query
          description: 1-based first line to search
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: matches to report (above 10000 = 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        "200":
          description: newline-delimited JSON, SearchHit records then one SearchEnd
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SearchHit"
                  - $ref: "#/components/schemas/SearchEnd"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope) or no such file (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/plan:
    get:
      operationId: sessionPlan
      summary: The rows of one STAT plan dump (what `mtkprof plan` prints)
      description: |
        The statement is `stmt` (its id in the document's `statements`) or
        `sql_id`. With `plh` the answer is the array of `PlanRow` of one
        dump of that plan hash (visualizer input, the V$SQL_PLAN_STATISTICS_ALL
        row format); `exec` picks the n-th STAT dump of the hash in trace
        order, the latest when missing. Without `plh` the statement's plan
        hashes are answered: the array when it has one, otherwise an object
        `{"<plan hash>": [rows]}` in order of first appearance (hashes with
        fewer than `exec` dumps are left out). The first row carries
        `sql_text`, `execution` (the dump's number among those of the hash)
        and `trace_line`. Compact JSON; `mtkprof plan` prints the same
        indented.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: stmt
          in: query
          description: statement id (document statements index); give this or sql_id
          schema:
            type: integer
            minimum: 0
        - name: sql_id
          in: query
          description: the Oracle sql_id (the first statement with it)
          schema:
            type: string
        - name: plh
          in: query
          description: plan hash value, decimal
          schema:
            type: string
        - name: exec
          in: query
          description: n-th STAT dump of the plan hash, 1-based (0 or missing = the latest)
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: the rows of one dump, or an object of them keyed by plan hash
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/PlanRow"
                  - type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: "#/components/schemas/PlanRow"
        "400":
          $ref: "#/components/responses/SliceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such session (envelope), no such sql_id, no STAT plan for the statement, no such plan hash or dump (plain text)
        "409":
          $ref: "#/components/responses/Conflict"
  /s/{id}/api/report:
    get:
      operationId: sessionReport
      summary: The CLI's outputs for this session (download)
      description: |
        Streams what `mtkprof report`, `json`, `export` and `html` write for
        the session's trace, as an attachment (`Content-Disposition` names it
        after the first input file). The session's model is the aggregate one
        `mtkprof serve -spill` has, which shapes the outputs:

        - `text`: the report of `mtkprof report -aggregate`: everything but the
          per-statement executions tables, which it says it leaves out
          (`execs` is accepted and has no effect). Bind values are in or out
          as the session was opened (`options.binds`).
        - `json`: the document with `facts: false` and `packed: false` (an
          aggregate model has no fact tables), the plan visualizer URL of the
          engine (`-plan-viz-url`).
        - `csv`: a zip of the files `mtkprof export` writes (`statements.csv`
          ... `errors.csv`, flat in the archive); calls, waits and binds are
          read from the spill and equal the CLI's.
        - `html`: the single-file report, the UI page with the document of
          `json` (packed, no fact tables) inlined; the drill-downs that need
          fact tables have nothing to show.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: format
          in: query
          schema:
            type: string
            enum: [text, json, csv, html]
            default: text
        - name: sort
          in: query
          description: text only, statement order
          schema:
            type: string
            enum: [elapsed, self, cpu, execs, disk, query, rows, line]
            default: elapsed
        - name: top
          in: query
          description: text only, only the top N statements (0 = all)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: execs
          in: query
          description: text only, executions to list per statement (0 = none, -1 = all)
          schema:
            type: integer
            minimum: -1
            default: 20
        - name: binds
          in: query
          description: text only, bind sets to print per statement (0 = none)
          schema:
            type: integer
            minimum: 0
            default: 5
        - name: sys
          in: query
          description: text only, include recursive SYS statements
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: width
          in: query
          description: text only, report width (below 80 = 120)
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 120
      responses:
        "200":
          description: the report, as an attachment
          headers:
            Content-Disposition:
              description: attachment; filename="<first input without .trc>.txt|.json|.csv.zip|.html"
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
            application/zip:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: the report could not be produced (before the first byte; a failure later ends the stream short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /s/{id}/api/pivot:
