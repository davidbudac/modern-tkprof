                          start:
                            type: integer
                          end:
                            type: integer
        "400":
          $ref: "#/components/responses/SliceBadRequest"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: the MTKPROF_TOKEN the engine was started with
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      description: session id (s + 12 hex digits)
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      description: job id (j + 12 hex digits)
      schema:
        type: string
    PromptID:
      name: id
      in: path
      required: true
      description: prompt id (p + 12 hex digits)
      schema:
        type: string
    File:
      name: file
      in: query
      description: index of the input file (document file.files order)
      schema:
        type: integer
        minimum: 0
        default: 0
    ConnectionID:
      name: id
      in: path
      required: true
      description: connection id (the shell's)
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    From:
      name: from
      in: query
      description: scope start, tim in µs (a row is in when its [tim-ela, tim] overlaps the scope)
      schema:
        type: integer
        minimum: 0
    To:
      name: to
      in: query
      description: scope end, tim in µs (0 = open; not before from)
      schema:
        type: integer
        minimum: 0
    Contexts:
      name: contexts
      in: query
      description: comma-separated context ids (at most 10000)
      schema:
        type: string
    Stmt:
      name: stmt
      in: query
      description: one statement id
      schema:
        type: integer
        minimum: 0
    StmtList:
      name: stmt
      in: query
      required: true
      description: comma-separated statement ids (at most 200)
      schema:
        type: string
    Event:
      name: event
      in: query
      description: one event id (waits only)
      schema:
        type: integer
        minimum: 0
    Idle:
      name: idle
      in: query
      description: include idle waits
      schema:
        type: string
        enum: ["0", "1"]
        default: "1"
    Scope:
      name: scope
      in: query
      description: "all: every wait; without it event or stmt is required"
      schema:
        type: string
        enum: [all]
  responses:
    BadRequest:
      description: bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: missing or wrong bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: no such object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: the object is in the wrong state (session not ready, job finished, entry open, engine shutting down)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Remote:
      description: the remote host or the connection to it failed (unreachable, authentication, permission, missing file)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SliceBadRequest:
      description: a bad parameter, the reason as plain text
      content:
        text/plain:
          schema:
            type: string
    Pivot:
      description: PivotResponse
      content:
        application/json:
          schema:
            type: object
            properties:
              fact:
                type: string
              dims:
                type: array
                items:
                  type: object
              measures:
                type: array
                items:
                  type: object
              rows:
                type: array
                items:
                  type: object
              total:
                type: array
                items:
                  type: number
              facts:
                type: integer
              bucketUs:
                type: integer
              groups:
                type: integer
              truncated:
                type: boolean
  schemas:
    LineKind:
      type: string
      description: the parser's kind of a trace line (trace.Kind.String())
      enum: [unknown, blank, header, separator, marker, parsing-in-cursor, sql-text, end-of-stmt, call, wait, stat, binds, bind-line, xctend, error, parse-error, lob, rpc]
    LinesPage:
      type: object
      properties:
        from:
          type: integer
        total:
          type: integer
          description: the line count of the file
        lines:
          type: array
          items:
            type: object
            properties:
              t:
                type: string
                description: the line without its terminator
              k:
                $ref: "#/components/schemas/LineKind"
    AtAnswer:
      type: object
      description: ids are -1 where absent
      properties:
        call:
          type: integer
        stmt:
          type: integer
        cursor:
          type: integer
        execNo:
          type: integer
        wait:
          type: integer
        bindSet:
          type: integer
        ctx:
          type: integer
        planLine:
          type: integer
          description: index into the document's planLines
        kind:
          $ref: "#/components/schemas/LineKind"
    SearchHit:
      type: object
      properties:
        line:
          type: integer
        col:
          type: integer
          description: 0-based byte offset of the first match
        text:
          type: string
          description: the line, cut to 400 bytes
    SearchEnd:
      type: object
      properties:
        done:
          type: boolean
        scanned:
          type: integer
        truncated:
          type: boolean
    PlanRow:
      type: object
      description: one STAT line in the V$SQL_PLAN_STATISTICS_ALL-style row format of ora-explain-plan-viz; numbers are omitted where unknown
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, "null"]
        depth:
          type: integer
        operation:
          type: string
        object_name:
          type: string
        object_id:
          type: integer
        object_alias:
          type: string
        qblock_name:
          type: string
        access_predicates:
          type: string
        filter_predicates:
          type: string
        cardinality:
          type: integer
        bytes:
          type: integer
        cost:
          type: integer
        actual_rows:
          type: integer
        starts:
          type: integer
        actual_elapsed_time:
          type: integer
          description: µs
        cr_buffer_gets:
          type: integer
        physical_reads:
          type: integer
        physical_writes:
          type: integer
        sql_id:
          type: string
        plan_hash_value:
          type: string
        sql_text:
          type: string
          description: first row only
        execution:
          type: integer
          description: first row only, the dump's number among those of the plan hash
        trace_line:
          type: integer
          description: first row only, line of the first STAT line
    ErrorCode:
      type: string
      enum: [bad_request, unauthorized, not_found, conflict, cancelled, needs_prompt, internal, remote]
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
    Identity:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Health:
      type: object
      required: [version, protocol, uptime, sessions, cache]
      additionalProperties: false
      properties:
        version:
          type: string
        protocol:
          type: integer
        uptime:
          type: integer
          description: seconds
        sessions:
          type: integer
        cache:
          $ref: "#/components/schemas/CacheHealth"
    CacheHealth:
      type: object
      required: [bytes, entries, cap]
      additionalProperties: false
      properties:
        bytes:
          type: integer
        entries:
          type: integer
        cap:
          type: integer
    JobInfo:
      type: object
      required: [id, kind, state, phase, done, total, unit, message]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [open, fetch, follow]
        state:
          type: string
          enum: [running, done, failed, cancelled]
        phase:
          type: string
          description: "open: open (cache lookup), parse (miss only), index (miss only), ready; fetch: fetch; follow: follow"
          enum: [open, parse, index, ready, fetch, follow]
        done:
          type: integer
        total:
          type: integer
          description: 0 = unknown
        unit:
          type: string
          description: bytes in phases parse, fetch and follow, empty otherwise
          enum: [bytes, ""]
        message:
          type: string
          description: the error of a failed job, "cancelled" for a cancelled one
        session:
          type: string
          description: the session the job opens
        lines:
          type: integer
          description: parse progress
        statements:
          type: integer
          description: parse progress
        connection:
          type: string
          description: "fetch, follow: the connection"
        localPaths:
          type: array
          items:
            type: string
          description: "fetch: the local files, once done; follow: the local file"
    JobList:
      type: object
      required: [jobs]
      additionalProperties: false
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobInfo"
    FileInfo:
      type: object
      required: [path, name, size]
      additionalProperties: false
      properties:
        path:
          type: string
        name:
          type: string
        size:
          type: integer
    SessionState:
      type: string
      enum: [opening, ready, failed, closed]
    SessionInfo:
      type: object
      required: [id, paths, state, rev, identity, cacheIdentity, hit, files, opened, bytes, lines]
      additionalProperties: false
      properties:
        id:
          type: string
        paths:
          type: array
          items:
            type: string
          description: the requested paths, absolute
        state:
          $ref: "#/components/schemas/SessionState"
        rev:
          type: integer
        identity:
          $ref: "#/components/schemas/Identity"
          description: content identity of the trace files without options (sha256 of size and first MiB per file, order-independent); the key of annotations
        cacheIdentity:
          $ref: "#/components/schemas/Identity"
          description: identity of the cache entry (files plus bind mode, salt, thresholds, index format); the {identity} of /engine/cache
        hit:
          type: boolean
          description: opened from the cache without a parse (false while opening)
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInfo"
          description: the input files (while opening) or the model's files (once ready, followed files included)
        opened:
          type: string
          format: date-time
        bytes:
          type: integer
        lines:
          type: integer
        job:
          type: string
          description: the open job
        error:
          type: string
          description: why the session failed ("cancelled" when its job was cancelled)
    SessionList:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
    SessionOptions:
      type: object
      additionalProperties: false
      properties:
        follow:
          type: boolean
          description: not implemented yet (400)
        binds:
          type: string
          enum: [keep, redact, none]
          default: keep
        salt:
          type: string
          description: redaction salt (implies redact)
        thresholds:
          type: object
          description: finding thresholds (`mtkprof findings-config`); unknown keys are a 400
    OpenSessionRequest:
      type: object
      required: [paths]
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
          description: trace files or directories of them
        options:
          $ref: "#/components/schemas/SessionOptions"
    OpenSessionResponse:
      type: object
      required: [session, job]
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/SessionInfo"
        job:
          $ref: "#/components/schemas/JobInfo"
    SessionEvent:
      type: object
      required: [id, state, rev]
      additionalProperties: false
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/SessionState"
        rev:
          type: integer
    PromptEvent:
      type: object
      required: [id, connection, kind, text, echo, state]
      additionalProperties: false
      properties:
        id:
          type: string
        connection:
          type: string
        kind:
          type: string
          enum: [password, passphrase, otp, hostkey, confirm]
        text:
          type: string
        echo:
          type: boolean
        state:
          type: string
          enum: [open, closed]
        fingerprint:
          type: string
          description: "hostkey: the SHA256 fingerprint of the unknown host key (answer yes to accept; it is then added to ~/.ssh/known_hosts)"
    PromptAnswer:
      type: object
      description: "{answer} or {cancel: true}"
      properties:
        answer:
          type: string
        cancel:
          type: boolean
    LogEvent:
      type: object
      required: [level, message]
      additionalProperties: false
      properties:
        level:
          type: string
          enum: [info, error]
        message:
          type: string
    CacheItem:
      type: object
      required: [identity, bytes, created, lastUsed, paths, open]
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
        bytes:
          type: integer
        created:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
        paths:
          type: array
          items:
            type: string
          description: absolute source paths at build time
        open:
          type: boolean
          description: a session of this engine has it open
    CacheList:
      type: object
      required: [bytes, entries, cap, items]
      additionalProperties: false
      properties:
        bytes:
          type: integer
        entries:
          type: integer
        cap:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CacheItem"
    CacheWipe:
      type: object
      required: [removed, skipped, bytes]
      additionalProperties: false
      properties:
        removed:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
          description: entries kept because a session has them open
        bytes:
          type: integer
          description: bytes freed
    AskpassRequest:
      type: object
      required: [text]
      properties:
        connection:
          type: string
          description: MTKPROF_PROMPT_CONN (empty or unknown = no caching)
        kind:
          type: string
          enum: [password, passphrase, otp, hostkey, confirm]
          description: the helper's classification (absent = classified by the engine)
        text:
          type: string
          description: the prompt as ssh printed it
        fingerprint:
          type: string
        spawn:
          type: string
          description: id of the ssh run (MTKPROF_PROMPT_SPAWN)
    ConnectionDef:
      type: object
      required: [id, kind, host]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        kind:
          type: string
          enum: [ssh, db]
        host:
          type: string
          description: "ssh: a host name or ~/.ssh/config alias"
        port:
          type: integer
          description: 0 = ~/.ssh/config or 22
        user:
          type: string
          description: empty = ~/.ssh/config or the local user
        service:
          type: string
          description: db service name
        adrHome:
          type: string
          description: db ADR home
        transport:
          type: string
          enum: [auto, cli, lib]
          default: auto
          description: "ssh only. cli: the system ssh/sftp with the askpass bridge; lib: the Go SSH library; auto: cli when ssh is on PATH, lib otherwise or once ssh ignored SSH_ASKPASS"
    ConnectionInfo:
      type: object
      required: [id, kind, host, port, user, transport, active]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [ssh, db]
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        service:
          type: string
        adrHome:
          type: string
        transport:
          type: string
          enum: [auto, cli, lib, ""]
        active:
          type: string
          enum: [cli, lib, ""]
          description: the SSH transport in use ("" before the first operation)
    ConnectionTest:
      type: object
      required: [server, transport]
      additionalProperties: false
      properties:
        server:
          type: string
          description: the host's `uname -sr` (lib adds the SSH server version)
        transport:
          type: string
          enum: [cli, lib]
    RemoteEntry:
      type: object
      required: [name, path, size, mode, modTime, dir, link]
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        mode:
          type: string
          description: as ls -l prints it (-rw-r-----)
        modTime:
          type: string
          format: date-time
          description: minute precision (cli, from sftp ls -l; day precision past 6 months)
        dir:
          type: boolean
        link:
          type: boolean
    RemoteListing:
      type: object
      required: [path, entries]
      additionalProperties: false
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RemoteEntry"
    Document:
      type: object
      description: report.Document (format 3); see web/src/lib/data/types.ts
      properties:
        tool:
          type: string
        version:
          type: string
        generated:
          type: string
          format: date-time
        format:
          type: integer
        file:
          type: object
        span:
          type: object
        statements:
          type: array
          items:
            type: object
        cursors:
          type: array
          items:
            type: object
        contexts:
          type: array
          items:
            type: object
        events:
          type: array
          items:
            type: object
        plans:
          type: array
          items:
            type: object
        planLines:
          type: array
          items:
            type: object
        transactions:
          type: array
          items:
            type: object
        errors:
          type: array
          items:
            type: object
        markers:
          type: array
          items:
            type: object
        diag:
          type: object
        unknown:
          type: array
          items:
            type: object
        stats:
          type: object
          properties:
            minimap:
              type: object
              properties:
                bucketUs:
                  type: integer
                cpu:
                  type: array
                  items:
                    type: integer
                waits:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: integer
