<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mtkprof · Lines · readable (mock-up)</title>
<style>
:root {
  color-scheme: light dark;
  --surface: light-dark(oklch(98.8% 0.002 250), oklch(17.5% 0.007 240));
  --surface-raised: light-dark(oklch(100% 0 none), oklch(20.5% 0.007 240));
  --surface-sunken: light-dark(oklch(96.5% 0.004 250), oklch(15% 0.007 240));
  --ink: light-dark(oklch(22% 0.015 250), oklch(92% 0.008 240));
  --ink-2: light-dark(oklch(45% 0.015 250), oklch(72% 0.01 240));
  --ink-3: light-dark(oklch(62% 0.012 250), oklch(56% 0.01 240));
  --hairline: light-dark(oklch(91% 0.005 250), oklch(29% 0.007 240));
  --hairline-strong: light-dark(oklch(82% 0.008 250), oklch(38% 0.008 240));
  --wash: color-mix(in oklch, var(--ink) 6%, transparent);
  --wash-strong: color-mix(in oklch, var(--ink) 11%, transparent);
  --c-cpu: light-dark(#2a78d6, #3987e5);
  --c-userio: light-dark(#eb6834, #d95926);
  --c-sysio: light-dark(#1baf7a, #199e70);
  --c-network: light-dark(#0a8a2a, #2a9a3a);
  --c-other: light-dark(#6250d6, #9085e9);
  --c-idle: light-dark(oklch(78% 0.01 240), oklch(42% 0.01 240));
  --s-warning: #d7930a;
  --heat: light-dark(oklch(62% 0.19 35), oklch(66% 0.17 35));
  --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-xs: 0.6875rem; --text-sm: 0.75rem; --text-md: 0.8125rem;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem;
  --radius: 4px;
  --lane-w: 12.5rem;
  --cols: 4.2rem 3.4rem minmax(0, 1fr) 9.5rem 6.2rem 8.6rem;
}
* { box-sizing: border-box; margin: 0; }
html, body { block-size: 100%; }
body { display: flex; flex-direction: column; font: var(--text-md)/1.45 var(--font-ui); color: var(--ink); background: var(--surface); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: var(--surface-raised); border: 1px solid var(--hairline-strong); border-radius: var(--radius); padding: 1px 8px; cursor: pointer; }
button:hover { background: var(--wash); }
button.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
button.quiet:hover { color: var(--ink); background: var(--wash); }
.mono { font-family: var(--font-mono); }
.faint { color: var(--ink-3); }
.dim { color: var(--ink-2); }

/* ---- toolbar ---- */
.bar { flex: none; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4); border-block-end: 1px solid var(--hairline); background: var(--surface); }
.bar .file { font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--hairline-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; font-size: var(--text-sm); }
.seg button + button { border-inline-start: 1px solid var(--hairline-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.pinfo { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--text-sm); color: var(--ink-2); padding: 1px 4px 1px 8px; border-radius: 999px; background: var(--wash); }
.pinfo b { color: var(--ink); font-weight: 600; }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }
body.busy .list { animation: pulse .9s ease-in-out infinite; will-change: opacity; cursor: progress; }
.busy-src { animation: pulse .9s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { body.busy .list, .busy-src { animation: none; opacity: .55; } }
#fold[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.spacer { flex: 1; }

/* ---- overview: where the time went ---- */
.ov { flex: none; padding: var(--sp-2) var(--sp-4) var(--sp-3); border-block-end: 1px solid var(--hairline); background: var(--surface-sunken); }
.ov-head { display: flex; align-items: baseline; gap: var(--sp-3); font-size: var(--text-sm); color: var(--ink-2); margin-block-end: 6px; }
.ov-head b { color: var(--ink); font-weight: 600; }
.ov-track { position: relative; block-size: 22px; border-radius: 3px; background: var(--surface-raised); border: 1px solid var(--hairline); overflow: hidden; }
.ov-seg { position: absolute; inset-block: 2px; border-radius: 2px; background: var(--sc); min-inline-size: 2px; cursor: pointer; }
.ov-seg:hover { outline: 2px solid var(--ink); outline-offset: 0; z-index: 1; }
.ov-break { position: absolute; inset-block: 0; background: repeating-linear-gradient(135deg, transparent 0 3px, var(--hairline-strong) 3px 4px); }
.ov-axis { position: relative; block-size: 14px; font-size: var(--text-xs); color: var(--ink-3); }
.ov-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ov-legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-block-start: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: var(--text-xs); background: var(--surface-raised); border: 1px solid var(--hairline); cursor: pointer; }
.chip:hover, .chip[aria-pressed="true"] { border-color: var(--sc); box-shadow: inset 0 0 0 1px var(--sc); }
.chip i { inline-size: 8px; block-size: 8px; border-radius: 2px; background: var(--sc); }
.chip .mono { font-size: var(--text-xs); }
.chip small { color: var(--ink-2); font-size: var(--text-xs); }

/* ---- the list ---- */
.body { flex: 1; display: flex; min-block-size: 0; position: relative; }
.list { position: relative; flex: 1; overflow: auto; background: var(--surface-raised); font-family: var(--font-mono); font-size: var(--text-sm); overscroll-behavior: contain; }
.colhead { position: sticky; inset-block-start: 0; z-index: 5; display: grid; grid-template-columns: var(--lane-w) var(--cols); align-items: center; block-size: 22px; background: var(--surface-sunken); border-block-end: 1px solid var(--hairline); font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink-3); }
.colhead > * { padding-inline: var(--sp-2); }
.colhead .r { text-align: end; }

/* a run: rows of one cursor in a row, the statement once on the left */
.run { display: flex; border-block-end: 1px solid var(--hairline); }
.run.dim-out { opacity: .32; }
.lane { flex: none; inline-size: var(--lane-w); position: relative; background: color-mix(in oklch, var(--sc) 9%, var(--surface-raised)); border-inline-start: 4px solid var(--sc); }
.lane.rec { border-inline-start-width: 4px; padding-inline-start: 14px; background: color-mix(in oklch, var(--sc) 6%, var(--surface-raised)); }
.lane.rec::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 6px; border-inline-start: 1px dashed var(--hairline-strong); }
.lane-label { position: sticky; inset-block-start: 23px; padding: 5px var(--sp-2) 6px; display: flex; flex-direction: column; gap: 1px; }
.sqlid { font-weight: 600; color: color-mix(in oklch, var(--sc) 78%, var(--ink)); white-space: nowrap; }
.lane-sub { font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-tot { font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink-3); }
.lane-tot b { color: var(--ink); font-weight: 600; }
.rows { flex: 1; min-inline-size: 0; }

.row { display: grid; grid-template-columns: var(--cols); align-items: start; min-block-size: 21px; position: relative; }
.row:hover { background: var(--wash); }
.row > * { padding: 2px var(--sp-2); min-inline-size: 0; }
.row.hot { background: color-mix(in oklch, var(--heat) var(--h), transparent); }
.row.hot:hover { background: color-mix(in oklch, var(--heat) calc(var(--h) + 6%), transparent); }
.row.pinned { box-shadow: inset 3px 0 0 var(--ink); background: color-mix(in oklch, var(--ink) 8%, transparent); }
.ln { color: var(--ink-3); text-align: end; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.ln .pin { visibility: hidden; color: var(--ink-3); inline-size: 12px; block-size: 12px; }
.row:hover .ln .pin { visibility: visible; }
.row.pinned .ln .pin { visibility: visible; color: var(--ink); }
.ln:hover .pin { color: var(--ink); }
.kind { font-size: var(--text-xs); font-weight: 600; letter-spacing: .02em; color: var(--ink-2); padding-block-start: 3px; }
.kind.k-WAIT, .kind.k-RUN, .kind.k-BLOCK { font-weight: 400; color: var(--ink-3); }
.kind.k-SQL { color: color-mix(in oklch, var(--sc) 78%, var(--ink)); }
.what { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; white-space: nowrap; }
.what .nm { color: var(--ink); }
.fact { color: var(--ink-2); }
.fact b { color: var(--ink); font-weight: 500; }
.badge { font-family: var(--font-ui); font-size: var(--text-xs); padding: 0 6px; border-radius: 999px; background: var(--wash-strong); color: var(--ink-2); }
.badge.warn { background: color-mix(in oklch, var(--s-warning) 22%, transparent); color: light-dark(#8a5c00, #f0c062); }
.dot { inline-size: 7px; block-size: 7px; border-radius: 50%; display: inline-block; background: var(--wc); transform: translateY(-1px); }
.close .what { color: var(--ink-3); }

/* time: a linear bar against the longest row, and the number */
.tm { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; text-align: end; }
.tm .track { block-size: 6px; border-radius: 3px; background: var(--wash); position: relative; overflow: hidden; }
.tm .fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 3px; background: var(--wc, var(--ink-3)); min-inline-size: 1px; }
.tm .fill.cpu { background: var(--c-cpu); }
.tm .fill.call { background: color-mix(in oklch, var(--ink-3) 55%, transparent); }
.tm span { min-inline-size: 7ch; color: var(--ink-2); }
.row.hot .tm span { color: var(--ink); font-weight: 600; }
.dl, .clk { text-align: end; white-space: nowrap; color: var(--ink-2); }
.dl.neg { color: var(--ink-3); }
.dl .ref { font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink); background: var(--wash-strong); border-radius: 999px; padding: 0 6px; }
.clk .us { color: var(--ink-3); font-size: .9em; margin-inline-start: 1px; }
.row.mark .mk { font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink-2); display: flex; gap: var(--sp-2); align-items: center; }
.row.mark .mk::after { content: ""; flex: 1; border-block-start: 1px dashed var(--hairline-strong); }

/* SQL text */
.sqltext { white-space: pre-wrap; color: var(--ink); line-height: 1.5; }
.sqltext .kw { color: light-dark(oklch(45% 0.12 260), oklch(75% 0.1 260)); }
.sqltext .hint { color: var(--ink-3); }
.sqltext .bv { color: light-dark(oklch(50% 0.14 35), oklch(74% 0.13 50)); }
.sqlmeta { font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink-3); margin-block-start: 1px; }

/* binds */
.bind { display: inline-flex; gap: 4px; align-items: baseline; padding: 0 6px; border-radius: 3px; background: var(--wash); }
.bind .bn { color: light-dark(oklch(50% 0.14 35), oklch(74% 0.13 50)); }
.bind .bt { color: var(--ink-3); font-size: var(--text-xs); }
button.link { border: 0; background: none; padding: 0; color: light-dark(oklch(45% 0.14 255), oklch(76% 0.11 255)); font-family: var(--font-ui); font-size: var(--text-xs); text-decoration: underline; text-underline-offset: 2px; }

/* plan */
table.plan { border-collapse: collapse; font-size: var(--text-sm); margin-block: 2px 4px; }
.plan th { font-family: var(--font-ui); font-weight: 500; font-size: var(--text-xs); color: var(--ink-3); text-align: end; padding: 1px 10px; border-block-end: 1px solid var(--hairline-strong); white-space: nowrap; }
.plan th.l { text-align: start; }
.plan td { padding: 1px 10px; text-align: end; white-space: nowrap; border-block-end: 1px solid var(--hairline); color: var(--ink-2); }
.plan td.op { text-align: start; color: var(--ink); }
.plan td.op .tree { color: var(--ink-3); }
.plan td.obj { text-align: start; color: var(--ink); font-weight: 500; }
.plan td.id { color: var(--ink-3); }
.plan .pt { display: inline-grid; grid-template-columns: 4rem 6ch; gap: 6px; align-items: center; }
.plan .pt i { display: block; block-size: 5px; border-radius: 2px; background: var(--heat); }
.plan .pt .t { position: relative; block-size: 5px; background: var(--wash); border-radius: 2px; }
.plan .pt .t i { position: absolute; inset-block: 0; inset-inline-start: 0; }
.plan .self { color: var(--ink); }
.plan .mis { color: light-dark(#8a5c00, #f0c062); font-weight: 600; }

/* expandable wait runs */
.exp { cursor: pointer; }
.exp .chev { display: inline-block; inline-size: 1ch; color: var(--ink-3); transition: transform .12s; }
.exp[aria-expanded="true"] .chev { transform: rotate(90deg); }
.sub { grid-column: 1 / -1; padding: 0 0 4px 0 !important; background: var(--surface-raised); }
.sub .row { min-block-size: 18px; font-size: var(--text-xs); }
.sub .row .what { padding-inline-start: 14px; }
.stack { display: inline-flex; inline-size: 9rem; block-size: 7px; border-radius: 3px; overflow: hidden; background: var(--wash); transform: translateY(-1px); }
.stack i { display: block; background: var(--wc); }
.stack i + i { box-shadow: inset 1px 0 0 var(--surface-raised); }

/* rows that belong to no statement */
.solo { display: grid; grid-template-columns: var(--lane-w) var(--cols); border-block-end: 1px solid var(--hairline); background: var(--surface-sunken); font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink-2); }
.solo > * { padding: 3px var(--sp-2); }
.solo .label { grid-column: 3 / -1; display: flex; gap: var(--sp-2); align-items: center; }
.solo .label::after { content: ""; flex: 1; border-block-start: 1px solid var(--hairline-strong); }
.solo.elided { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--wash) 5px 6px); color: var(--ink-3); }
.solo .ln { text-align: end; grid-column: 2; }

/* the hot-spot strip: the whole list, every row with its share of the time */
.strip { flex: none; inline-size: 16px; position: relative; background: var(--surface-sunken); border-inline-start: 1px solid var(--hairline); cursor: pointer; }
.strip canvas { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; }
.strip .vp { position: absolute; inset-inline: 0; border: 1px solid var(--ink-2); border-radius: 2px; background: color-mix(in oklch, var(--ink) 8%, transparent); pointer-events: none; }

/* drawer: the statement as it ran */
.drawer { position: absolute; inset-block: 0; inset-inline-end: 16px; inline-size: min(36rem, 60%); background: var(--surface-raised); border-inline-start: 1px solid var(--hairline-strong); box-shadow: -8px 0 24px color-mix(in oklch, var(--ink) 14%, transparent); display: flex; flex-direction: column; z-index: 10; }
.drawer[hidden] { display: none; }
.dr-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-block-end: 1px solid var(--hairline); border-inline-start: 4px solid var(--sc); }
.dr-head h2 { font-size: var(--text-md); font-weight: 600; }
.dr-head .sqlid { font-family: var(--font-mono); font-size: var(--text-sm); }
.dr-body { padding: var(--sp-3); overflow: auto; display: flex; flex-direction: column; gap: var(--sp-3); }
.dr-body h3 { font-size: var(--text-xs); font-weight: 500; color: var(--ink-3); margin-block-end: 4px; }
.dr-sql { font-family: var(--font-mono); font-size: var(--text-sm); white-space: pre-wrap; padding: var(--sp-2) var(--sp-3); background: var(--surface-sunken); border: 1px solid var(--hairline); border-radius: var(--radius); line-height: 1.55; }
.dr-sql mark { background: color-mix(in oklch, var(--heat) 18%, transparent); color: var(--ink); border-radius: 2px; padding: 0 2px; border-block-end: 1px solid var(--heat); }
table.bt { border-collapse: collapse; inline-size: 100%; font-size: var(--text-sm); }
.bt th { font-weight: 500; font-size: var(--text-xs); color: var(--ink-3); text-align: start; padding: 2px 8px; border-block-end: 1px solid var(--hairline-strong); }
.bt td { padding: 2px 8px; border-block-end: 1px solid var(--hairline); font-family: var(--font-mono); }
.dr-note { font-size: var(--text-xs); color: var(--ink-3); }
.dr-nav { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--text-xs); color: var(--ink-2); }
</style>
</head>
<body>
<div class="bar">
  <span class="file">io_waits.trc</span>
  <span class="faint" id="meta"></span>
  <span class="seg" title="mock-up shows the readable mode"><button type="button" aria-pressed="false">raw</button><button type="button" aria-pressed="true">readable</button></span>
  <button type="button" id="fold" aria-pressed="false" title="fold repeated waits and fetch loops into one expandable line (f)">Fold repeats</button>
  <button type="button" class="quiet" id="nextHot" title="jump to the next row that took ≥ 2 % of the time (j / k)">Next hot spot ↓</button>
  <span class="pinfo" id="pinfo"></span>
  <span class="spacer"></span>
  <button type="button" class="quiet" id="theme">Theme</button>
</div>
<div class="ov">
  <div class="ov-head"><b>Where the time went</b><span id="ovsum"></span><span class="faint">— each block is a top-level call, x = wall clock; click to jump</span></div>
  <div class="ov-track" id="ovtrack"></div>
  <div class="ov-axis" id="ovaxis"></div>
  <div class="ov-legend" id="ovlegend"></div>
</div>
<div class="body">
  <div class="list" id="list">
    <div class="colhead"><span>Statement</span><span class="r">Line</span><span>Event</span><span>Detail</span><span class="r">Time</span><span class="r" id="dlhead">Δ pin</span><span class="r">Clock</span></div>
    <div id="rows"></div>
  </div>
  <div class="strip" id="strip"><canvas></canvas><div class="vp"></div></div>
  <aside class="drawer" id="drawer" hidden></aside>
</div>
<script>
const D = /*DATA*/null
const $ = (s, el = document) => el.querySelector(s)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const n0 = (n) => n.toLocaleString('en-US')
function dur(us) {
  if (us === undefined) return ''
  const a = Math.abs(us)
  if (a < 1000) return `${us} µs`
  if (a < 1e6) return `${(us / 1000).toFixed(a < 1e4 ? 2 : 1)} ms`
  return `${(us / 1e6).toFixed(3)} s`
}
const sdur = (us) => (us > 0 ? '+' : us < 0 ? '−' : '±') + dur(Math.abs(us))
function clock(us) {
  const s = Math.floor(us / 1e6), f = us - s * 1e6
  const hh = String(Math.floor(s / 3600)).padStart(2, '0'), mm = String(Math.floor(s / 60) % 60).padStart(2, '0'), ss = String(s % 60).padStart(2, '0')
  const ms = String(Math.floor(f / 1000)).padStart(3, '0'), u = String(f % 1000).padStart(3, '0')
  return `${hh}:${mm}:${ss}.${ms}<span class="us">${u}</span>`
}

// ---- statements: color, label, totals --------------------------------------------------------------------
const HUES = [30, 150, 255, 310, 190, 75, 350, 120, 280, 0, 220, 100]
const stmts = D.stmts
const ordered = Object.values(stmts).sort((a, b) => a.order - b.order)
const OCT = { 2: 'INSERT', 3: 'SELECT', 6: 'UPDATE', 7: 'DELETE', 47: 'PL/SQL block', 42: 'ALTER SESSION' }
for (const s of ordered) {
  s.total = 0; s.execs = 0; s.first = null
  s.label = s.text.replace(/\s+/g, ' ').replace(/\/\*\+?[^*]*\*\//g, '').trim()
}
// folding repeats (wait runs, wait blocks, fetch loops) is off by default: every line shows as written
let fold = false
let rows = D.flat
const CALLS = ['PARSE', 'EXEC', 'FETCH', 'FETCHES', 'CLOSE']
for (const r of rows) {
  const s = r.sqlid && stmts[r.sqlid]
  if (!s) continue
  if (CALLS.includes(r.k) && r.dep === s.dep) s.total += r.e
  if (r.k === 'EXEC') s.execs++
}

// colors: the costliest statements first, so they get the most distinct hues (the app would keep a color per sql_id stable)
let hi = 0
for (const s of [...ordered].sort((a, b) => b.total - a.total)) {
  // recursive SYS SQL stays neutral: it is noise for most reads
  if (s.uid === 0 && s.dep > 0) { s.color = 'light-dark(oklch(62% 0.02 250), oklch(58% 0.02 250))'; continue }
  const h = HUES[hi++ % HUES.length]
  s.color = `light-dark(oklch(56% 0.15 ${h}), oklch(72% 0.13 ${h}))`
}

// ---- wait classes (from the 19c event reference) ----------------------------------------------------------
const CLASS = { 'direct path read': 'userio', 'direct path read temp': 'userio', 'direct path write temp': 'userio', 'Disk file operations I/O': 'userio', 'db file sequential read': 'userio',
  'SQL*Net message to client': 'network', 'SQL*Net more data to client': 'network', 'SQL*Net message from client': 'idle', 'enq: KO - fast object checkpoint': 'other' }
const CLASSLBL = { userio: 'User I/O', network: 'Network', idle: 'Idle', other: 'Application', sysio: 'System I/O' }
const wc = (nam) => `var(--c-${CLASS[nam] ?? 'other'})`
const wclass = (nam) => CLASSLBL[CLASS[nam] ?? 'other'] ?? 'Other'

// ---- time of a row, the trace span, hot rows --------------------------------------------------------------
const own = (r) => (r.k === 'WAIT' || r.k === 'RUN' || r.k === 'BLOCK') ? r.ela : CALLS.includes(r.k) ? r.e : undefined
const segs = [] // the two excerpts, for the broken overview axis
{ let cur = null
  for (const r of rows) {
    if (r.k === 'elided') { cur = null; continue }
    if (r.us === undefined) continue
    if (!cur) segs.push(cur = { a: r.us - (own(r) ?? 0), b: r.us })

  const c = e.target.closest('[data-sqlid]'); if (!c) return
  focus = focus === c.dataset.sqlid ? null : c.dataset.sqlid
  document.querySelectorAll('#ovlegend .chip').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.sqlid === focus)))
  rerender(() => { if (focus) jumpTo(rows.findIndex((r) => r.sqlid === focus)) }, c)
})
$('#nextHot').addEventListener('click', () => {
  const list = $('#list'), y = list.scrollTop + 90
  const el = [...document.querySelectorAll('#rows > .run .rows > .row.hot')].find((e) => e.offsetTop > y + 4)
  if (el) jumpTo(+el.dataset.i)
})
$('#theme').addEventListener('click', () => { const h = document.documentElement; h.style.colorScheme = h.style.colorScheme === 'dark' ? 'light' : 'dark'; drawStrip() })

// hot-spot strip: each row at its place in the list, as wide as its share of the time
function drawStrip() {
  const strip = $('#strip'), cv = $('canvas', strip), list = $('#list')
  const H = strip.clientHeight, W = strip.clientWidth, dpr = devicePixelRatio || 1
  cv.width = W * dpr; cv.height = H * dpr
  const g = cv.getContext('2d'); g.scale(dpr, dpr)
  const total = list.scrollHeight
  const probe = document.createElement('span'); probe.style.color = 'var(--heat)'; document.body.append(probe)
  const heat = getComputedStyle(probe).color; probe.remove()
  g.fillStyle = heat
  document.querySelectorAll('#rows .row[data-i]').forEach((el) => {
    const r = rows[+el.dataset.i], sh = share(r)
    if (sh < 0.002) return
    const y = (el.offsetTop / total) * H
    g.globalAlpha = Math.min(1, 0.35 + sh * 3)
    g.fillRect(1, y, Math.max(3, (W - 2) * Math.min(1, Math.sqrt(sh) * 1.6)), Math.max(2, (el.offsetHeight / total) * H))
  })
  const vp = $('.vp', strip)
  vp.style.top = `${(list.scrollTop / total) * H}px`
  vp.style.height = `${Math.max(8, (list.clientHeight / total) * H)}px`
}
$('#list').addEventListener('scroll', () => { const s = $('#strip'), l = $('#list'); $('.vp', s).style.top = `${(l.scrollTop / l.scrollHeight) * s.clientHeight}px` })
$('#strip').addEventListener('click', (e) => { const s = $('#strip'), l = $('#list'); l.scrollTop = ((e.clientY - s.getBoundingClientRect().top) / s.clientHeight) * l.scrollHeight - l.clientHeight / 2 })
addEventListener('resize', drawStrip)
// the button shows the new state at once and pulses until the lines have switched
function setFold(on) { fold = on; rows = fold ? D.folded : D.flat; $('#fold').setAttribute('aria-pressed', String(fold)); rerender(null, $('#fold')) }
$('#fold').addEventListener('click', () => setFold(!fold))
addEventListener('keydown', (e) => { if (e.key === 'j') $('#nextHot').click(); if (e.key === 'f') setFold(!fold); if (e.key === 'Escape') $('#drawer').hidden = true })

overview()
render()
</script>
