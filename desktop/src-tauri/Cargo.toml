[package]
name = "mtkprof-desktop"
version = "0.5.0"
description = "mtkprof desktop: Tauri shell around the mtkprof engine"
authors = ["David Budac"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mtkprof_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
log = "0.4"
tokio = { version = "1", features = ["time", "sync"] }
keyring = "4"
# plain http to the engine on loopback only: no TLS, no proxy
ureq = { version = "3", default-features = false }
tauri-plugin-updater = "2.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
